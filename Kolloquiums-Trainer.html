<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kolloquiums-Trainer NRW</title>
<style>
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --sunk:#E3E7EB;
  --ink:#16202B; --muted:#5A6672; --faint:#8A939D;
  --line:#CBD2DA; --hair:#DDE2E7;
  --blue:#23446E; --blue-soft:#E5EBF3;
  --red:#A8232B; --red-soft:#F7E7E7;
  --green:#1D6A50; --green-soft:#E4EFEA;
  --ochre:#96681C; --ochre-soft:#F6EEDF;
  --r:4px;
}
html[data-theme="dark"]{
  --bg:#131A21; --surface:#1B242D; --sunk:#161E26;
  --ink:#E4E8EC; --muted:#9AA6B2; --faint:#6E7B88;
  --line:#2E3A45; --hair:#26303A;
  --blue:#7FA6D8; --blue-soft:#1E2C3D;
  --red:#E8848A; --red-soft:#2F1E20;
  --green:#6FBF9F; --green-soft:#152A23;
  --ochre:#D6AC63; --ochre-soft:#2B2317;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Shell ---------- */
#app{display:flex;min-height:100vh;align-items:stretch}
#rail{
  width:216px;flex:0 0 216px;background:var(--surface);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:20px 0 12px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
#rail h1{
  font-size:13px;font-weight:600;letter-spacing:.01em;margin:0 20px 2px;line-height:1.3;
}
#rail .sub{font-size:12px;color:var(--faint);margin:0 20px 22px}
.navgrp{margin-bottom:18px}
.navgrp .lbl{font-size:11px;color:var(--faint);margin:0 20px 6px;font-weight:600}
.nav{
  display:block;width:100%;text-align:left;padding:7px 20px;font-size:14px;
  border-left:2px solid transparent;color:var(--muted);
}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav[aria-current="true"]{border-left-color:var(--blue);color:var(--ink);font-weight:600;background:var(--sunk)}
.nav .badge{float:right;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
#railfoot{margin-top:auto;padding:12px 20px 0;border-top:1px solid var(--hair)}
#railfoot button{font-size:12px;color:var(--muted);display:block;padding:4px 0}
#railfoot button:hover{color:var(--ink);text-decoration:underline}

#main{flex:1;min-width:0;display:flex;justify-content:center;padding:34px 28px 80px}
.wrap{width:100%;max-width:720px}
.wrap.wide{max-width:940px}

h2.view{font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
p.lead{color:var(--muted);margin:0 0 26px;font-size:14px;max-width:62ch}

/* ---------- Countdown hero ---------- */
.hero{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:26px}
.hero .phase{font-size:12px;color:var(--blue);font-weight:600;margin-bottom:10px}
.hero .count{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hero .num{
  font-family:Georgia,"Iowan Old Style",serif;font-size:76px;line-height:.86;
  font-weight:400;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
}
.hero .unit{font-size:15px;color:var(--muted);max-width:34ch}
.hero .unit b{color:var(--ink);font-weight:600}

/* ---------- Cards & bits ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:14px;font-weight:600}
.rowsplit{display:flex;gap:16px;flex-wrap:wrap}
.rowsplit>*{flex:1 1 220px;min-width:0}

.btn{
  background:var(--blue);color:#fff;padding:9px 18px;border-radius:var(--r);
  font-size:14px;font-weight:600;
}
html[data-theme="dark"] .btn{color:#0E1720}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{background:var(--sunk);filter:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.tag{
  display:inline-block;font-size:11px;padding:2px 7px;border-radius:3px;
  border:1px solid var(--line);color:var(--muted);font-weight:600;
}
.tag.KS{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.tag.LAQ{background:var(--green-soft);border-color:transparent;color:var(--green)}
.tag.AMT{background:var(--ochre-soft);border-color:transparent;color:var(--ochre)}
.tag.ERG{background:var(--sunk);border-color:transparent;color:var(--faint)}
.tag.warn{background:var(--red-soft);border-color:transparent;color:var(--red)}

.meter{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue)}
.meter i.g{background:var(--green)} .meter i.o{background:var(--ochre)} .meter i.r{background:var(--red)}

table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th{text-align:left;font-weight:600;font-size:12px;color:var(--faint);padding:0 10px 8px 0;border-bottom:1px solid var(--hair)}
table.data td{padding:9px 10px 9px 0;border-bottom:1px solid var(--hair);vertical-align:middle}
table.data tr:last-child td{border-bottom:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- Session ---------- */
#bar{height:3px;background:var(--sunk);position:sticky;top:0;z-index:5;margin:-34px -28px 26px}
#bar i{display:block;height:100%;background:var(--blue);transition:width .25s}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:12px;color:var(--faint)}
.qtext{font-family:Georgia,"Iowan Old Style",serif;font-size:21px;line-height:1.45;margin:0 0 22px;max-width:60ch}
.qtext .stem{display:block;font-family:system-ui,sans-serif;font-size:13px;color:var(--muted);margin-bottom:10px;line-height:1.5}

.opts{border-top:1px solid var(--hair);margin-bottom:22px}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:13px 12px 13px 10px;border-bottom:1px solid var(--hair);
  border-left:2px solid transparent;font-size:15px;line-height:1.45;
}
.opt:hover:not(.locked){background:var(--sunk)}
.opt .key{
  flex:0 0 20px;height:20px;border:1px solid var(--line);border-radius:3px;
  font-size:11px;display:flex;align-items:center;justify-content:center;
  color:var(--faint);margin-top:1px;font-weight:600;
}
.opt.sel{border-left-color:var(--blue);background:var(--blue-soft)}
.opt.sel .key{border-color:var(--blue);background:var(--blue);color:#fff}
html[data-theme="dark"] .opt.sel .key{color:#0E1720}
.opt.right{border-left-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-left-color:var(--red);background:var(--red-soft)}
.opt.locked{cursor:default}
.opt .why{display:block;font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
.opt .why b{color:var(--ink);font-weight:600}

.confrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-top:4px}
.confrow .hint{font-size:12px;color:var(--faint);flex-basis:100%;margin-bottom:2px}

.verdict{padding:14px 16px;border-radius:var(--r);margin-bottom:18px;font-size:15px;font-weight:600}
.verdict.ok{background:var(--green-soft);color:var(--green)}
.verdict.no{background:var(--red-soft);color:var(--red)}
.verdict.alarm{background:var(--red);color:#fff}
html[data-theme="dark"] .verdict.alarm{color:#160E0F}
.verdict small{display:block;font-weight:400;font-size:13px;margin-top:4px;opacity:.9}

.expl{border-left:2px solid var(--blue);padding:2px 0 2px 16px;margin-bottom:18px}
.expl p{margin:0 0 10px;font-size:15px;line-height:1.6}
.expl p:last-child{margin-bottom:0}
.say{background:var(--sunk);border-radius:var(--r);padding:13px 16px;margin-bottom:16px}
.say .lbl{font-size:11px;color:var(--faint);font-weight:600;margin-bottom:5px}
.say .txt{font-family:Georgia,serif;font-size:15px;line-height:1.55}
details.trap{border:1px solid var(--line);border-radius:var(--r);padding:0;margin-bottom:16px}
details.trap summary{padding:11px 15px;font-size:14px;font-weight:600;cursor:pointer;list-style:none}
details.trap summary::-webkit-details-marker{display:none}
details.trap summary::before{content:"+ ";color:var(--faint)}
details.trap[open] summary::before{content:"– "}
details.trap .body{padding:0 15px 14px;font-size:14px;color:var(--muted);line-height:1.6}
details.trap .body q{color:var(--ink);font-style:normal;display:block;margin-bottom:6px;font-family:Georgia,serif;font-size:15px}

.srcline{font-size:12px;color:var(--faint);margin-bottom:20px;padding-top:2px}

/* order / match */
.ord{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
.ord .it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--hair);font-size:14px}
.ord .it:last-child{border-bottom:none}
.ord .it .pos{flex:0 0 22px;color:var(--faint);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.ord .it .txt{flex:1}
.ord .it .mv{display:flex;gap:4px}
.ord .it .mv button{border:1px solid var(--line);border-radius:3px;width:26px;height:26px;font-size:12px;color:var(--muted)}
.ord .it .mv button:hover{background:var(--sunk);color:var(--ink)}
.ord .it.right{background:var(--green-soft)} .ord .it.wrong{background:var(--red-soft)}
.mt{margin-bottom:22px}
.mt .pair{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair);font-size:14px}
.mt .pair .l{flex:1 1 50%}
.mt .pair select{flex:1 1 46%;font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink)}
.mt .pair.right select{border-color:var(--green);background:var(--green-soft)}
.mt .pair.wrong select{border-color:var(--red);background:var(--red-soft)}

/* speak */
.timer{font-family:Georgia,serif;font-size:44px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer.over{color:var(--red)}
.musts{margin:0 0 20px;padding:0;list-style:none}
.musts li{border-bottom:1px solid var(--hair)}
.musts label{display:flex;gap:11px;align-items:flex-start;padding:11px 4px;font-size:15px;line-height:1.45;cursor:pointer}
.musts input{margin-top:4px;width:16px;height:16px;accent-color:var(--blue);flex:0 0 auto}
textarea{
  width:100%;font:inherit;font-size:15px;padding:11px 13px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface);color:var(--ink);resize:vertical;line-height:1.55;
}
input[type=text],input[type=date]{
  font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface);color:var(--ink);
}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{border:1px solid var(--line);border-radius:20px;padding:5px 13px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}

.note{border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;margin-bottom:12px;background:var(--surface)}
.note h4{margin:0 0 3px;font-size:15px}
.note .m{font-size:12px;color:var(--faint);margin-bottom:9px}
.note dl{margin:0;font-size:14px;line-height:1.55}
.note dt{font-size:11px;color:var(--faint);font-weight:600;margin-top:8px}
.note dd{margin:1px 0 0}
.linknote{background:var(--blue-soft);border-radius:var(--r);padding:11px 15px;margin-bottom:16px;font-size:14px}
.linknote .l{font-size:11px;color:var(--blue);font-weight:600;margin-bottom:3px}

#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:var(--r);
  font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;
}
#toast.on{opacity:1}

@media (max-width:820px){
  #app{flex-direction:column}
  #rail{width:auto;flex:none;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);padding-bottom:8px}
  #rail .sub{margin-bottom:12px}
  .navgrp{margin-bottom:10px}
  .nav{display:inline-block;width:auto;border-left:none;border-bottom:2px solid transparent;padding:6px 12px}
  .nav[aria-current="true"]{border-left:none;border-bottom-color:var(--blue)}
  .navgrp .lbl{margin-left:12px}
  #railfoot{padding:10px 12px 0}
  #railfoot button{display:inline-block;margin-right:16px}
  #main{padding:22px 16px 60px}
  #bar{margin:-22px -16px 20px}
  .hero .num{font-size:58px}
  .qtext{font-size:19px}
}
@media print{
  #rail,#bar,.btnrow,.filters{display:none!important}
  body{background:#fff}
  .note,.panel{break-inside:avoid;border-color:#999}
}
</style>
</head>
<body>
<div id="app">
  <nav id="rail"></nav>
  <div id="main"><div class="wrap" id="view"></div></div>
</div>
<div id="toast"></div>

<script type="module">
/* ============================================================
   FIREBASE — Cloud-Synchronisation
   Trag hier deine eigenen sechs Werte aus der Firebase-Konsole
   ein (Projekteinstellungen -> Allgemein -> Meine Apps).
   Bleibt apiKey leer, läuft das Tool automatisch rein lokal
   im Browserspeicher weiter -- nichts bricht dadurch.
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDM6oBvt-iYmLr-9EZhbDtvVYN8wk09798",
  authDomain: "kolloquium-33c0c.firebaseapp.com",
  projectId: "kolloquium-33c0c",
  storageBucket: "kolloquium-33c0c.firebasestorage.app",
  messagingSenderId: "487278211502",
  appId: "1:487278211502:web:af035a1e40f3e30a88d83f"
};

window.__fb = { db: null, ready: Promise.resolve(null), doc, getDoc, setDoc };

if (firebaseConfig.apiKey) {
  try {
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    window.__fb.db = getFirestore(app);
    window.__fb.ready = new Promise((resolve) => {
      let settled = false;
      onAuthStateChanged(auth, (user) => {
        if (user && !settled) { settled = true; resolve(user.uid); }
      });
      signInAnonymously(auth).catch(() => { if (!settled) { settled = true; resolve(null); } });
      setTimeout(() => { if (!settled) { settled = true; resolve(null); } }, 6000);
    });
  } catch (e) {
    window.__fb = { db: null, ready: Promise.resolve(null) };
  }
}
</script>

<script type="module">
/* ============================================================
   FRAGENPOOL — hier kannst du selbst ergänzen oder korrigieren.
   Felder: id, b(lock), hf[], src(KS|LAQ|AMT|ERG), t(yp),
   q(uestion), stem, o(ptions:[t,ok,why,e]), ans, ref, say, trap{q,a}
   Fehlerarten (e): begriff | autor | recht | verfahren | hf | modell
   ============================================================ */

const BLOCKS = {
  imp:{n:"Gesprächsimpuls (Sprechprobe)", ord:9},
  cm: {n:"Classroom Management", ord:2},
  st: {n:"Unterrichtsstörungen", ord:3},
  r1: {n:"Recht I: § 53 Erziehung & Ordnung", ord:4},
  r2: {n:"Recht II: Rechtslandkarte", ord:5},
  lg: {n:"Lehrergesundheit", ord:6},
  be: {n:"Schulische Beratung", ord:7},
  ug: {n:"Unterrichtsgespräche", ord:8}
};

const HFN = {
  U:"Unterricht gestalten", E:"Erziehungsauftrag", L:"Leistung",
  B:"Beratung", S:"System Schule", V:"Leitlinie Vielfalt", P:"Prüfung/Ausbildung"
};

const SRCN = {
  KS:"Kernseminar-Zusammenfassung", LAQ:"LAQUILA / OVP",
  AMT:"Amtliche Quelle, geprüft", ERG:"Ergänzt — nicht in deinen Unterlagen"
};

const ERRN = {
  begriff:"Begriff verwechselt", autor:"Autor falsch zugeordnet",
  recht:"Rechtsgrundlage falsch", verfahren:"Verfahren / Stufenfolge falsch",
  hf:"Handlungsfeld falsch", modell:"Modelle nicht abgegrenzt"
};

const CRIT = {
  komplex:"Komplexität der Problemdarstellung", sach:"Sachlicher Gehalt",
  folge:"Folgerichtigkeit der Gedankenführung", eigen:"Eigenständigkeit des Urteils",
  komm:"Kommunikationsfähigkeit"
};

const Q = [];

/* ===================== BLOCK: GESPRÄCHSIMPULS (1) ===================== */
Q.push(
{id:"imp01",b:"imp",hf:["S"],src:"LAQ",t:"speak",
 q:"Halte deinen Gesprächsimpuls: fünf Minuten zu deinem professionsbezogenen Entwicklungsprozess.",
 stem:"Keine Wissensfrage — eine Probe. Frei sprechen, ohne Notizen, danach ehrlich abgleichen.",
 musts:[
  "Ich habe eine erkennbare Entwicklungslinie benannt statt chronologisch zu erzählen.",
  "Ich habe mindestens zwei konkrete Situationen aus meiner Praxis geschildert.",
  "Ich habe mindestens eine Theorie mit Autor zur Analyse herangezogen.",
  "Ich habe Gelungenes und weniger Gelungenes differenziert.",
  "Ich habe eine tragfähige Konsequenz für mein weiteres Handeln abgeleitet.",
  "Ich bin in der Zeit geblieben und habe nicht überzogen."],
 model:"Ein starker Impuls hat eine These. Zum Beispiel: „Meine zentrale Entwicklung war der Wechsel von der Störungsbekämpfung zur Störungsprävention.\u201c Dann zwei Situationen, an denen sich das zeigt — eine misslungene früh, eine gelungene später. Dann die Theorie, die den Unterschied erklärt. Dann die Selbstkritik: was daran noch nicht trägt. Und zum Schluss eine Konsequenz, die konkret genug ist, dass man sie überprüfen könnte.",
 crit:["komplex","folge","komm"],
 ref:"OVP § 33 (1); Planungshilfe Kolloquium",
 trap:{q:"Sie haben eben von Ihrer Entwicklung gesprochen — woran genau würden Sie merken, dass Sie sich getäuscht haben?",a:"Ein überprüfbares Kriterium nennen. Das rettet die Eigenständigkeit des Urteils."}}
);

/* ===================== BLOCK: CLASSROOM MANAGEMENT (20) ===================== */
Q.push(
{id:"cm01",b:"cm",hf:["U"],src:"KS",t:"multi",
 q:"Welche vier Bereiche muss eine Lehrkraft steuern, um Störungen präventiv zu begegnen?",
 stem:"Mehrfachauswahl.",
 o:[
  {t:"Präsenz- und Stoppsignale",ok:1},
  {t:"Regeln und Organisation",ok:1},
  {t:"Breite Aktivierung",ok:1},
  {t:"Unterrichtsfluss",ok:1},
  {t:"Konsequente Sanktionierung",why:"Sanktion ist gerade nicht der Kern. Nolting beschreibt präventive Steuerung; Sanktionen sind nachrangig.",e:"autor"},
  {t:"Beziehungsarbeit",why:"Beziehungsarbeit ist wichtig, gehört in dieser Systematik aber zu einem anderen Konzept (Eckert 2022) und nicht zu den vier Pfeilern.",e:"autor"}],
 ans:"Nolting: Präsenz- und Stoppsignale, Regeln und Organisation, breite Aktivierung, Unterrichtsfluss. Alle vier sind präventiv gedacht.",
 ref:"Nolting, Hans-Peter: Störungen in der Schulklasse. Weinheim/Basel 2013",
 say:"Nolting beschreibt vier Pfeiler: Präsenz- und Stoppsignale, Regeln und Organisation, breite Aktivierung und Unterrichtsfluss. Auffällig ist, dass alle vier präventiv sind — keiner davon ist eine Sanktion.",
 trap:{q:"Welcher der vier fällt Ihnen am schwersten?",a:"Konkret werden, Situation nennen, eine Maßnahme benennen, die du daraufhin geändert hast."}},

{id:"cm02",b:"cm",hf:["U"],src:"KS",t:"single",
 q:"Eine Lehrkraft bemerkt beginnende Unruhe früh und greift beim tatsächlichen Urheber ein, nicht beim Auffälligsten. Wie heißt diese Fähigkeit?",
 o:[
  {t:"With-it-ness, also Allgegenwärtigkeit (Kounin 1970)",ok:1},
  {t:"Overlapping",why:"Overlapping meint die Fähigkeit, mehrere Anforderungen gleichzeitig zu bearbeiten — ebenfalls Kounin, aber ein anderes Konstrukt. Die beiden werden ständig verwechselt.",e:"begriff"},
  {t:"Pädagogischer Takt",why:"Der pädagogische Takt beschreibt eine Haltung im Umgang, nicht die Wahrnehmungsleistung des frühen Erkennens.",e:"begriff"},
  {t:"Momentum",why:"Momentum bezeichnet die Zügigkeit des Unterrichtsablaufs, nicht die Wahrnehmung von Störungen.",e:"begriff"}],
 ans:"With-it-ness meint die Allgegenwärtigkeit der Lehrkraft — sie bemerkt Störungen früh und trifft beim Eingreifen den richtigen Urheber. Kounin beschrieb dies bereits 1970 und begründete damit die präventive Perspektive.",
 ref:"Kounin 1970; nach Tell, PPT Einstieg Classroom Management",
 say:"With-it-ness nach Kounin heißt Allgegenwärtigkeit: Ich nehme Störungen früh wahr und greife beim tatsächlichen Urheber ein, nicht beim Auffälligsten.",
 trap:{q:"Wie merkt eine Klasse, ob eine Lehrkraft with-it ist?",a:"An Timing und Treffsicherheit des Eingreifens — nicht an der Lautstärke."}},

{id:"cm03",b:"cm",hf:["U"],src:"KS",t:"single",
 q:"Welches Merkmal von Unterricht hängt empirisch am eindeutigsten mit Leistungsniveau und Leistungsfortschritt einer Klasse zusammen?",
 o:[
  {t:"Die Klassenführung — kein anderes Merkmal ist so eindeutig und konsistent damit verknüpft (Helmke 2003)",ok:1},
  {t:"Die Zahl der Lernenden pro Lerngruppe",why:"Klassengröße zeigt in der Unterrichtsforschung überraschend schwache und uneinheitliche Effekte — deutlich schwächer als die Führung der Gruppe.",e:"modell"},
  {t:"Der Anteil offener Unterrichtsformen",why:"Offenheit als solche ist kein Wirksamkeitsmerkmal. Offene Formen wirken, wenn sie gut strukturiert sind — womit man wieder bei der Klassenführung ist.",e:"modell"},
  {t:"Die fachliche Qualifikation der Lehrkraft",why:"Fachwissen ist notwendige Bedingung, erklärt aber deutlich weniger Varianz in der Schülerleistung als die Klassenführung.",e:"modell"}],
 ans:"Helmke (2003) bündelt den Forschungsstand: Klassenführung ist das am eindeutigsten und konsistentesten mit Leistungsniveau und Leistungsfortschritt verknüpfte Merkmal.",
 ref:"Helmke, Andreas: Unterrichtsqualität erfassen, verbessern, bewerten. Seelze 2003, S. 82–84",
 say:"Helmke fasst zusammen, dass kein anderes Unterrichtsmerkmal so konsistent mit Leistungsniveau und Leistungsfortschritt zusammenhängt wie die Klassenführung.",
 trap:{q:"Korrelation ist keine Kausalität — was folgt daraus?",a:"Zugeben, dass gut geführte Klassen auch leichter zu führen sein können. Trotzdem: Interventionsstudien zeigen Effekte, das ist mehr als Korrelation."}},

{id:"cm04",b:"cm",hf:["U"],src:"KS",t:"single",
 q:"Worauf zielt Klassenführung ihrem fachlichen Kern nach?",
 o:[
  {t:"Auf die Koordination des komplexen Unterrichtsgeschehens, damit die verfügbare Lernzeit optimal für Lernaktivitäten genutzt wird (Evertson & Weinstein 2006)",ok:1},
  {t:"die Summe aller Maßnahmen zur Durchsetzung von Regeln.",why:"Verengt Klassenführung auf Disziplin. Die Definition zielt auf Lernzeitnutzung.",e:"begriff"},
  {t:"die Gestaltung der Lehrer-Schüler-Beziehung.",why:"Beziehung ist eine Bedingung guter Klassenführung, aber nicht die Definition.",e:"begriff"},
  {t:"die Organisation von Material und Raum.",why:"Ein Teilaspekt (Regeln und Organisation), nicht das Ganze.",e:"begriff"}],
 ans:"Klassenführung ist die Koordination und Steuerung des komplexen Unterrichtsgeschehens mit dem Ziel, die verfügbare Lernzeit optimal für Lernaktivitäten zu nutzen. Der Bezugspunkt ist also Lernzeit, nicht Ruhe.",
 ref:"Evertson & Weinstein 2006; nach Tell, PPT Classroom Management",
 say:"Klassenführung ist nach Evertson und Weinstein die Steuerung des komplexen Unterrichtsgeschehens mit dem Ziel, Lernzeit optimal zu nutzen. Der Maßstab ist Lernzeit, nicht Stille.",
 trap:{q:"Eine stille Klasse ist also nicht automatisch gut geführt?",a:"Nein. Stille kann auch Nichtbeteiligung sein. Maßstab ist die aktive Lernzeit der Einzelnen."}},

{id:"cm05",b:"cm",hf:["U"],src:"KS",t:"multi",
 q:"Was gehört zum Bereich „Unterrichtsfluss“?",
 stem:"Mehrfachauswahl.",
 o:[
  {t:"Den Aufgaben Vorrang geben vor der Beschäftigung mit Störungen",ok:1},
  {t:"Unterbrechungen für Aufbauen, Austeilen und Organisatorisches minimieren",ok:1},
  {t:"Zügig von einer Aktivität in die nächste wechseln",ok:1},
  {t:"Mit einzelnen Lernenden keine langen Dialoge führen, die andere langweilen",ok:1},
  {t:"Fragen erkennbar an die ganze Klasse richten und Denkzeit gewähren",why:"Das gehört zur breiten Aktivierung, nicht zum Unterrichtsfluss. Die beiden Pfeiler werden gern vermischt.",e:"modell"},
  {t:"Elementare Regeln frühzeitig einführen",why:"Das ist der Pfeiler Regeln und Organisation.",e:"modell"}],
 ans:"Unterrichtsfluss meint: Aufgaben vor Störungsbearbeitung, Unterbrechungen minimieren, zügige Übergänge, keine langen Einzeldialoge. Untätiges Warten der Klasse ist zu vermeiden.",
 ref:"Nolting 2013; nach Tell, PPT Classroom Management",
 say:"Zum Unterrichtsfluss gehört, den Aufgaben Vorrang vor der Störungsbearbeitung zu geben, Übergänge zügig zu gestalten und Leerlauf zu vermeiden.",

{id:"cm06",b:"cm",hf:["U"],src:"KS",t:"single",
 q:"Ein Schüler stört wiederholt leise. Du gehst auf ihn zu. Was solltest du dabei ausdrücklich unterlassen?",
 o:[
  {t:"Ihn anzutippen.",ok:1},
  {t:"Blickkontakt aufzunehmen.",why:"Blickkontakt ist ausdrücklich ein empfohlenes Stoppsignal.",e:"verfahren"},
  {t:"Sich im Raum zu bewegen.",why:"Bewegung im Raum und Zugehen auf Störende sind empfohlen.",e:"verfahren"},
  {t:"Ein kurzes nonverbales Signal zu senden.",why:"Kurze Stoppsignale bei kleinen Störungen sind Kern des ersten Pfeilers.",e:"verfahren"}],
 ans:"Zugehen ja, antippen nein. Körperkontakt eskaliert, macht die Störung öffentlich und ist rechtlich heikel. Empfohlen sind Nähe, Blick, knappe Signale — und danach Bekräftigung des erwünschten Verhaltens.",
 ref:"Nolting 2013; nach Tell, PPT Classroom Management",
 say:"Ich gehe auf Störende zu und nutze Blick und knappe Signale — antippen tue ich bewusst nicht, weil Körperkontakt eskaliert und die Störung erst öffentlich macht.",
 trap:{q:"Ist das nicht übertriebene Vorsicht?",a:"Nein. Neben der Eskalationsgefahr gibt es einen Persönlichkeitsrechtsaspekt — und die Wirkung ist ohne Berührung mindestens so gut."}},

{id:"cm07",b:"cm",hf:["U"],src:"KS",t:"match",
 q:"Ordne die Maßnahmen den vier Bereichen der Klassenführung zu.",

  ["Gut verteiltes und etwas unvorhersehbares Drannehmen","Breite Aktivierung"],
  ["Standort mit gutem Einblick in die ganze Klasse wählen","Präsenz- und Stoppsignale"],
  ["Zügig von einer Aktivität in die nächste wechseln","Unterrichtsfluss"]],
 ans:"Regeln und Organisation zielen auf Routinen, breite Aktivierung auf Einbezug aller, Präsenz auf Wahrnehmbarkeit und frühe Signale, Unterrichtsfluss auf Leerlaufvermeidung.",

 say:"Die vier Pfeiler lassen sich an Maßnahmen festmachen: Routinen einüben gehört zu Regeln und Organisation, unvorhersehbares Drannehmen zur breiten Aktivierung, der Standort zur Präsenz, zügige Übergänge zum Unterrichtsfluss.",
 trap:{q:"Warum unvorhersehbar drannehmen?",a:"Weil Vorhersehbarkeit Abmeldung erlaubt. Wer nicht weiß, wann er dran ist, bleibt kognitiv beteiligt."}},

{id:"cm08",b:"cm",hf:["U","E"],src:"KS",t:"multi",

 o:[

  {t:"Gewissenhaftigkeit",ok:1},

 ans:"Fünf Eigenschaften: Stabilität/Belastbarkeit, Extraversion, Offenheit für Erfahrungen, Verträglichkeit, Gewissenhaftigkeit. Es ist die Struktur der Big Five, auf Lehrerhandeln übertragen.",
 ref:"Brüning, Ludger / Saum, Tobias: Classroom Management. Essen: NDS, 2023",

{id:"cm09",b:"cm",hf:["E"],src:"KS",t:"multi",
 q:"Was stärkt die Beziehung zwischen Lehrkraft und Lerngruppe?",
 stem:"Mehrfachauswahl.",
 o:[
  {t:"Wärme und Kompetenz zugleich ausstrahlen",ok:1},
  {t:"Lernenden etwas zutrauen und damit Autonomieerleben fördern",ok:1},
  {t:"Feedback einholen und konstruktiv nutzen",ok:1},
  {t:"Eine gute Grundlage schaffen und damit die Oxytocinproduktion anregen",ok:1},
  {t:"Konsequent Distanz halten, um Autorität zu sichern",why:"Wärme und Kompetenz schließen sich nicht aus — genau ihre Verbindung erzeugt Vertrauen. Distanz allein erzeugt Respekt vor der Rolle, nicht vor der Person.",e:"begriff"}],
 ans:"Eckert: Grundlage schaffen (Oxytocin), Wärme und Kompetenz ausstrahlen, etwas zutrauen (Autonomieerleben), Feedback einholen und nutzen.",
 ref:"Eckert, Markus: Classroom Management. Ditzingen: Reclam, 2022",

{id:"cm10",b:"cm",hf:["U"],src:"KS",t:"single",

{id:"cm11",b:"cm",hf:["U"],src:"KS",t:"multi",

 stem:"Mehrfachauswahl.",
 o:[
  {t:"Möglichst immer alle ansprechen und einbeziehen",ok:1},
  {t:"Fragen erkennbar an die ganze Klasse richten und Denkzeit gewähren",ok:1},
  {t:"Häufige kleine Leistungskontrollen, bei Gruppenarbeit auch Kontrolle der Einzelleistung",ok:1},

{id:"cm12",b:"cm",hf:["U"],src:"ERG",t:"single",
 q:"Was unterscheidet präventives von reaktivem Classroom Management?",
 o:[
  {t:"Präventives CM gestaltet Bedingungen so, dass Störungen seltener entstehen; reaktives CM antwortet auf bereits eingetretene Störungen.",ok:1},
  {t:"Präventives CM arbeitet mit Belohnung, reaktives mit Bestrafung.",why:"Verwechselt die Zeitachse mit der Verstärkungsrichtung. Auch präventives CM kann ohne Belohnungssysteme auskommen.",e:"begriff"},
  {t:"Präventives CM ist Aufgabe der Klassenleitung, reaktives Aufgabe der Fachlehrkräfte.",why:"Keine solche Zuständigkeitsteilung.",e:"begriff"},
  {t:"Präventives CM meint die Sitzordnung, reaktives das Gespräch.",why:"Beides ist zu eng; die Unterscheidung ist grundsätzlicher.",e:"begriff"}],
 ans:"Der Unterschied liegt im Zeitpunkt: Prävention setzt vor der Störung an (Struktur, Routinen, Aktivierung, Präsenz), Reaktion danach. Die Forschung seit Kounin priorisiert klar die Prävention.",
 ref:"Ergänzt; anschlussfähig an Kounin 1970 und Nolting 2013",
 say:"Präventives Classroom Management verändert die Bedingungen, unter denen Störungen entstehen. Reaktives Handeln bleibt nötig, ist aber die zweite Wahl.",
 trap:{q:"Kann man Störungen ganz vermeiden?",a:"Nein — und das wäre auch kein Ziel. Bräutigam beschreibt Störungen als Suchbewegungen und entwicklungsnotwendige Prozesse."}},

{id:"cm13",b:"cm",hf:["U"],src:"KS",t:"single",
 q:"Warum spricht man beim Unterricht von einer „komplexen sozialen Situation“?",
 o:[
  {t:"Wegen Merkmalen wie Simultanität und Unvorhersagbarkeit des Geschehens.",ok:1},
  {t:"Wegen der Anzahl der beteiligten Personen allein.",why:"Die Gruppengröße ist nur ein Faktor. Entscheidend sind Gleichzeitigkeit und Unvorhersagbarkeit der Ereignisse.",e:"begriff"},
  {t:"Wegen der fachlichen Komplexität der Unterrichtsinhalte.",why:"Gemeint ist die soziale, nicht die fachliche Komplexität.",e:"begriff"},
  {t:"Wegen der rechtlichen Rahmenbedingungen.",why:"Kein Bezug zur gemeinten Situationsanalyse.",e:"begriff"}],
 ans:"Unterricht ist gekennzeichnet durch Simultanität (vieles passiert gleichzeitig) und Unvorhersagbarkeit. Genau deshalb braucht es Steuerung, die nicht auf Einzelreaktion beruht, sondern auf Struktur.",
 ref:"nach Tell, PPT Einstieg Classroom Management",
 say:"Unterricht ist eine komplexe soziale Situation — vieles passiert gleichzeitig und vieles ist unvorhersehbar. Deshalb funktioniert Steuerung über Struktur besser als über Einzelreaktion.",
 trap:{q:"Was folgt daraus für Ihre Planung?",a:"Routinen und Übergänge vorab planen, damit im Moment kognitive Kapazität für Wahrnehmung frei bleibt."}},

{id:"cm14",b:"cm",hf:["U","E"],src:"KS",t:"single",
 q:"Ein Ausschussmitglied hält Classroom Management für „Disziplinierung mit neuem Namen“. Welche Antwort ist fachlich am stärksten?",
 o:[
  {t:"Der Bezugspunkt ist ein anderer: Nicht Ruhe, sondern nutzbare Lernzeit — und die vier Pfeiler Noltings sind sämtlich präventiv, keiner ist eine Sanktion.",ok:1},
  {t:"Classroom Management ist empirisch besser belegt als Disziplinierung.",why:"Stimmt tendenziell, geht aber am Einwand vorbei — der Vorwurf betrifft die Zielrichtung, nicht die Evidenz.",e:"verfahren"},
  {t:"Disziplinierung ist rechtlich unzulässig, Classroom Management nicht.",why:"Sachlich falsch. Erzieherische Einwirkungen sind nach § 53 SchulG ausdrücklich zulässig.",e:"recht"},
  {t:"Classroom Management verzichtet vollständig auf Regeln.",why:"Das Gegenteil: Regeln und Organisation sind ein eigener Pfeiler.",e:"begriff"}],
 ans:"Die überzeugende Antwort trennt Ziel und Mittel: Ziel ist Lernzeit, nicht Ruhe; die Mittel sind überwiegend präventiv und strukturbildend. Becker warnt zudem ausdrücklich vor Disziplinierungstechniken wie Drohen und Schreien, weil keine Bewusstseinsveränderung stattfindet.",
 ref:"Evertson & Weinstein 2006; Nolting 2013; Becker 2006",
 say:"Der Unterschied liegt im Bezugspunkt. Disziplinierung zielt auf Ruhe, Classroom Management auf nutzbare Lernzeit. Und alle vier Pfeiler Noltings sind präventiv — keiner ist eine Sanktion.",
 trap:{q:"Aber Sie sanktionieren doch trotzdem?",a:"Ja, wenn nötig — nach § 53 SchulG und verhältnismäßig. Nur ist das die Ausnahme, nicht das Konzept."}},

{id:"cm15",b:"cm",hf:["U"],src:"KS",t:"multi",
 q:"Was gehört zum Bereich „Regeln und Organisation“?",
 stem:"Mehrfachauswahl.",
 o:[
  {t:"Elementare Regeln frühzeitig einführen, weitere später nach Bedarf",ok:1},

  {t:"Eingeführte Regeln ernst nehmen und nicht selbst dagegen verstoßen",ok:1},
  {t:"Klassenraum, Geräte und Material für reibungslosen Ablauf vorbereiten",ok:1},
  {t:"Lebendige Stimme, Mimik und Gestik einsetzen",why:"Gehört zur breiten Aktivierung.",e:"modell"}],

{id:"cm16",b:"cm",hf:["U","V"],src:"ERG",t:"single",
 q:"Wie verhält sich Classroom Management zur Leitlinie Vielfalt?",
 o:[
  {t:"Klare Strukturen und Routinen entlasten besonders die Lernenden, die Orientierung brauchen — Classroom Management wirkt damit inklusiv, nicht nivellierend.",ok:1},
  {t:"Classroom Management steht im Spannungsverhältnis zur Vielfalt, weil es alle gleich behandelt.",why:"Verwechselt Struktur mit Gleichbehandlung im Ergebnis. Gemeinsame Struktur bedeutet nicht identische Anforderungen.",e:"begriff"},
  {t:"Classroom Management ist bei heterogenen Gruppen nachrangig gegenüber Differenzierung.",why:"Umgekehrt: Je heterogener die Gruppe, desto wichtiger die Struktur, weil offene Formen mehr Selbststeuerung voraussetzen.",e:"begriff"},
  {t:"Die Leitlinie Vielfalt hat keinen Bezug zum Handlungsfeld U.",why:"Die Leitlinie wirkt ausdrücklich in allen Handlungsfeldern.",e:"hf"}],
 ans:"Struktur ist ein Zugänglichkeitsmerkmal. Wer Aufmerksamkeitssteuerung, Sprache oder Selbstorganisation als Hürde erlebt, profitiert am stärksten von Vorhersehbarkeit — Routinen sind insofern eine Form des Barriereabbaus.",
 ref:"Ergänzt; anschlussfähig an Leitlinie Vielfalt, Kerncurriculum BASS 20-03 Nr. 21",
 say:"Klare Strukturen entlasten gerade die Lernenden, die Orientierung brauchen. Insofern ist Classroom Management für mich Teil des Barriereabbaus und kein Gegensatz zur Vielfalt.",
 trap:{q:"Können Strukturen nicht auch ausschließen?",a:"Ja, wenn sie starr sind. Deshalb der Referenzrahmen: Rituale gemeinsam verabreden, erproben und verändern."}},

{id:"cm17",b:"cm",hf:["U"],src:"KS",t:"single",
 q:"Was ist mit „Erfolgsfaktor CM — innere Haltung“ gemeint?",
 o:[
  {t:"Bewusste Wahrnehmung für die Situation und für das eigene Handeln.",ok:1},
  {t:"Eine grundsätzlich positive Erwartung an alle Lernenden.",why:"Positive Erwartung ist wichtig (Optimismus bezüglich der Schülerentwicklung bei Brüning/Saum), aber der Kern ist die bewusste Wahrnehmung.",e:"begriff"},
  {t:"Die Fähigkeit, Regeln konsequent durchzusetzen.",why:"Konsequenz ist Verhalten, nicht Haltung.",e:"begriff"},
  {t:"Eine klare Rollentrennung zwischen Lehrkraft und Lernenden.",why:"Kein Bestandteil dieser Systematik.",e:"begriff"}],
 ans:"Kern ist die bewusste Wahrnehmung — für die Situation und für das eigene Handeln darin. Erst daraus wird Steuerung möglich; ohne Wahrnehmung bleibt nur Reaktion.",
 ref:"nach Tell, PPT Classroom Management; Brüning/Saum 2023",
 say:"Der Erfolgsfaktor Haltung meint zuerst bewusste Wahrnehmung: der Situation und meines eigenen Anteils daran.",
 trap:{q:"Wie trainiert man das?",a:"Über Fremdwahrnehmung — kollegiale Hospitation, Videografie, Schülerfeedback. Selbstwahrnehmung allein bestätigt sich zu leicht selbst."}},

{id:"cm18",b:"cm",hf:["U"],src:"ERG",t:"case",
 q:"Deine Lerngruppe braucht nach jedem Materialwechsel drei bis vier Minuten, bis wieder gearbeitet wird. Was ist die naheliegendste Analyse?",
 stem:"Fallfrage — eine Antwort, danach Begründung.",
 o:[
  {t:"Ein Problem des Unterrichtsflusses: Übergänge sind nicht als Routine eingeübt.",ok:1},
  {t:"Ein Motivationsproblem: die Aufgaben sind zu wenig interessant.",why:"Möglich, erklärt aber nicht die spezifische Bindung an den Übergang. Nach Volkamer und Zimmer entsteht Unruhe vor allem bei Nichtbeschäftigung — der Übergang ist genau so eine Lücke.",e:"modell"},
  {t:"Ein Beziehungsproblem: die Klasse akzeptiert dich nicht.",why:"Ein sehr großer Schluss aus einem sehr spezifischen Symptom. Erst die einfachere Erklärung prüfen.",e:"modell"},
  {t:"Ein Disziplinproblem, das eine Ordnungsmaßnahme rechtfertigt.",why:"Unverhältnismäßig und rechtlich unhaltbar: Es liegt keine zurechenbare Pflichtverletzung Einzelner vor.",e:"recht"}],
 ans:"Symptome, die an eine bestimmte Unterrichtsphase gebunden sind, verweisen auf Organisation, nicht auf Personen. Der Übergang ist eine unbeschäftigte Lücke — nach Volkamer und Zimmer beschäftigen sich Lernende dann selbst. Lösung: Übergang als Routine mit klarem Signal und klarer Erwartung einüben.",
 ref:"Nolting 2013 (Unterrichtsfluss); Volkamer & Zimmer 1982",
 say:"Wenn Unruhe immer an derselben Stelle entsteht, ist es meist ein Organisationsproblem und kein Personenproblem. Ich würde den Übergang als Routine einüben, statt einzelne anzusprechen.",
 trap:{q:"Und wenn die Routine nach zwei Wochen wieder zerfällt?",a:"Dann war sie nicht eingeübt, sondern angekündigt. Routinen brauchen Wiederholung und sichtbares Ernstnehmen — Nolting: eingeführte Regeln wirklich ernst nehmen."}},

{id:"cm19",b:"cm",hf:["U"],src:"KS",t:"single",
 q:"Welche Empfehlung zum Feedback gehört zur breiten Aktivierung?",
 o:[
  {t:"Variantenreich und sehr spezifisch loben, auch für persönliche Fortschritte.",ok:1},
  {t:"Lob sparsam einsetzen, damit es seine Wirkung behält.",why:"Nicht die Menge ist das Problem, sondern die Unspezifik. Gefordert ist variantenreiches und spezifisches Lob.",e:"begriff"},
  {t:"Nur Ergebnisse loben, nicht den Prozess.",why:"Ausdrücklich auch persönliche Fortschritte — also die individuelle Bezugsnorm.",e:"begriff"},
  {t:"Öffentliches Lob vermeiden.",why:"Keine solche Empfehlung in dieser Systematik.",e:"begriff"}],
 ans:"Motivierende Rückmeldungen geben, auch für persönliche Fortschritte, variantenreich und sehr spezifisch. Spezifisch heißt: benennen, was genau gut war.",
 ref:"Nolting 2013",
 say:"Feedback sollte variantenreich und spezifisch sein und auch persönliche Fortschritte würdigen — also die individuelle Bezugsnorm einbeziehen.",
 trap:{q:"Verwöhnt das nicht?",a:"Spezifisches Lob ist Information, kein Bonbon. Es sagt, was wiederholbar ist. Unspezifisches Lob nutzt sich ab, spezifisches nicht."}},

{id:"cm20",b:"cm",hf:["U","E"],src:"KS",t:"speak",

  "Ich habe eine konkrete eigene Unterrichtssituation geschildert.",

 crit:["komplex","sach","eigen"],
 ref:"Nolting 2013; Evertson & Weinstein 2006; Helmke 2003; Eckert 2022",
 trap:{q:"Sie haben viel über Struktur gesagt. Wo bleibt das Kind?",a:"Nicht defensiv werden. Eckert und die Beziehungsarbeit anschließen und zeigen, dass Struktur die Voraussetzung dafür ist, dass Zeit für Einzelne bleibt."}}

Q.push(
{id:"st01",b:"st",hf:["E"],src:"KS",t:"match",
 q:"Ordne die drei gängigen Definitionen von Unterrichtsstörung ihrem jeweiligen Zugriff zu.",
 pairs:[
  ["Was die Voraussetzungen des Lehrens und Lernens außer Kraft setzt","Funktionaler Zugriff (Lohmann 2003)"],
  ["Was Prozess oder Beziehungsgefüge unterbricht — gerichtet gegen Lehrkraft, Mitschüler oder Verlauf","Beziehungsorientierter Zugriff (Ortner 2000)"],
  ["Wenn Lehren und Lernen stockt, aufhört, pervertiert, unerträglich oder inhuman wird","Wertender Zugriff (Winkel 2005)"]],
 ans:"Lohmann definiert über die außer Kraft gesetzten Voraussetzungen, Ortner über Prozess und Beziehungsgefüge mit drei Adressaten, Winkel drastisch über das Stocken und die Inhumanität.",
 ref:"Lohmann 2003; Ortner 2000; Winkel 2005 — nach Tell, PPT Umgang mit Unterrichtsstörungen",

{id:"st02",b:"st",hf:["E"],src:"KS",t:"single",
 q:"Wie lassen sich wiederkehrende Störungen im Jugendalter entwicklungspsychologisch deuten?",
 o:[
  {t:"Als Suchbewegungen und entwicklungsbedingte, notwendige Prozesse der Identitätsfindung (Bräutigam 2003)",ok:1},
  {t:"Als Kommunikationsversuch, auf den lösungsorientiert mit Reframing zu antworten ist (Lohmann 2011)",why:"Das ist eine Interventionslogik, keine entwicklungspsychologische Erklärung der Entstehung.",e:"modell"},
  {t:"Als Zustand, in dem Lehren und Lernen unerträglich wird (Winkel 2005)",why:"Das ist eine Definition der Störung, keine Erklärung ihrer Entstehung.",e:"modell"},
  {t:"Als Ausdruck fehlender Motivation, die sich in Disziplinproblemen niederschlägt (Heckhausen)",why:"Eine motivationstheoretische Erklärung — plausibel, aber sie erklärt nicht die Altersgebundenheit der Häufung.",e:"modell"}],
 ans:"Bräutigam (2003) deutet Störungen als Suchbewegungen und entwicklungsbedingte, notwendige Prozesse der Identitätsfindung. Er nennt zudem: der Lehrkraft fehlen in der Komplexität eindeutige Handlungsorientierungen, das Selbstwertgefühl eines Interaktionspartners ist gefährdet, der Erfolg der Maßnahme ist unkalkulierbar.",
 ref:"Bräutigam 2003; nach Tell, Sammlung Umgang mit Unterrichtsstörungen",
 say:"Bräutigam deutet Störungen als Suchbewegungen und entwicklungsnotwendige Prozesse der Identitätsfindung. Das entlastet mich, ohne die Störung zu verharmlosen.",
 trap:{q:"Ist das nicht eine bequeme Entschuldigung für Fehlverhalten?",a:"Es ist eine Erklärung, keine Rechtfertigung. Die Konsequenz bleibt — aber ich reagiere anders, wenn ich das Verhalten als Entwicklungsprozess und nicht als Angriff lese."}},

{id:"st03",b:"st",hf:["E"],src:"KS",t:"single",
 q:"Worauf lässt sich Unruhe zurückführen, die regelmäßig in Wartezeiten und Übergängen entsteht?",
 o:[
  {t:"Auf Nichtbeschäftigung: Wer nicht beschäftigt wird, beschäftigt sich selbst oder die Lehrkraft, und Langeweile wird mit Lärm beantwortet (Volkamer & Zimmer 1982)",ok:1},
  {t:"Auf ein grundsätzliches Motivationsdefizit der Lerngruppe (Heckhausen)",why:"Erklärt nicht, warum die Unruhe genau an die Übergänge gebunden ist. Wenn ein Symptom phasenspezifisch auftritt, liegt die Ursache in der Organisation.",e:"modell"},
  {t:"Auf gefährdetes Selbstwertgefühl einzelner Beteiligter (Bräutigam 2003)",why:"Ein realer Störungsmechanismus, aber er erklärt Einzelfälle, nicht die regelmäßige Bindung an eine Unterrichtsphase.",e:"modell"},
  {t:"Auf ungeklärte Rollen in der Gruppenentwicklung",why:"Gruppendynamik erklärt Konflikte, aber nicht die immer gleiche Stelle im Stundenverlauf.",e:"modell"}],
 ans:"Volkamer und Zimmer formulieren die Beschäftigungsthese: Nicht beschäftigte Lernende beschäftigen sich selbst oder die Lehrkraft; Langeweile wird mit Lärm beantwortet. Der Bezug zum Pfeiler Unterrichtsfluss ist unmittelbar.",
 ref:"Volkamer & Zimmer 1982; nach Tell, PPT Umgang mit Unterrichtsstörungen",
 say:"Volkamer und Zimmer sagen es zugespitzt: Wer die Lernenden nicht beschäftigt, wird von ihnen beschäftigt. Das verweist direkt auf Planung statt auf Sanktion.",
 trap:{q:"Dann ist jede Störung Ihre Schuld?",a:"Nein, aber jede Störung ist ein Anlass, zuerst die eigene Planung zu prüfen. Das ist eine Reihenfolge, keine Schuldzuweisung."}},

{id:"st04",b:"st",hf:["E"],src:"KS",t:"multi",
 q:"Welche Strategien gehören zum lösungsorientierten Umgang mit Störungen?",
 stem:"Mehrfachauswahl.",
 o:[
  {t:"Positives Umdenken (Reframing)",ok:1},
  {t:"Positive Motivzuschreibung",ok:1},
  {t:"Positive Funktionszuschreibung",ok:1},
  {t:"Lokalisierung von Ausnahmen",ok:1},
  {t:"Durch die Hintertür stürmen",ok:1},
  {t:"Konsequente Eskalationsleiter",why:"Das Gegenteil des lösungsorientierten Ansatzes, der ausdrücklich deeskalierend argumentiert.",e:"modell"}],
 ans:"Lohmann: Reframing, positive Motivzuschreibung, positive Funktionszuschreibung, Lokalisierung von Ausnahmen, durch die Hintertür stürmen, Symptomverschreibung, Wunderfrage. Die Herkunft ist erkennbar lösungsorientiert-systemisch.",
 ref:"Lohmann, Gert: Mit Schülern klarkommen. 4. Aufl., Berlin 2007/2011",
 say:"Lohmann arbeitet lösungsorientiert: Reframing, positive Motiv- und Funktionszuschreibung, Lokalisierung von Ausnahmen, durch die Hintertür stürmen, Symptomverschreibung und Wunderfrage.",
 trap:{q:"Wunderfrage im Klassenzimmer — ist das nicht Therapie?",a:"Berechtigter Einwand. Ich beherrsche das Format nicht therapeutisch und nutze es nicht als Intervention, sondern als Perspektivwechsel im Einzelgespräch. Beraten heißt nicht therapieren."}},

{id:"st05",b:"st",hf:["E"],src:"KS",t:"single",
 q:"Was meint „positive Funktionszuschreibung“?",
 o:[
  {t:"Das Störverhalten bewusst als Information nutzen — etwa: Unruhe zeigt mir, dass ich zu lange geredet habe.",ok:1},
  {t:"Dem störenden Schüler eine Aufgabe mit Verantwortung übertragen.",why:"Das ist eher „durch die Hintertür stürmen“ — Stärken nutzen und verstärken.",e:"modell"},
  {t:"Nach Motiven fragen, die das Verhalten für den Schüler sinnvoll machen.",why:"Das ist die positive Motivzuschreibung.",e:"modell"},
  {t:"Über das Problem anders denken lernen.",why:"Das ist Reframing, das positive Umdenken.",e:"modell"}],
 ans:"Funktionszuschreibung heißt: Der Störung eine Funktion im System zuschreiben und diese als Rückmeldung an das eigene Handeln lesen. Motivzuschreibung fragt dagegen nach dem Sinn des Verhaltens für die störende Person.",
 ref:"Lohmann 2011; nach Tell, Sammlung Becker/Lohmann",
 say:"Positive Funktionszuschreibung heißt, das Störverhalten als Information über meinen Unterricht zu lesen — Unruhe sagt mir zum Beispiel, dass ich zu lange doziert habe.",
 trap:{q:"Und wenn die Störung gar keine Funktion hat?",a:"Dann trägt die Deutung nicht, und ich wechsle das Werkzeug. Lohmann bietet ein Repertoire, kein Dogma."}},

{id:"st06",b:"st",hf:["E"],src:"KS",t:"multi",

  {t:"Nicht Bewährtes sein lassen",ok:1},

{id:"st07",b:"st",hf:["E"],src:"KS",t:"single",

  {t:"Weil sie zu zeitaufwendig sind.",why:"Sie sind im Gegenteil schnell — das ist gerade ihre Verführung.",e:"begriff"},

{id:"st09",b:"st",hf:["E"],src:"KS",t:"single",
 q:"Was kennzeichnet eine Ich-Botschaft?",
 o:[
  {t:"Sie beschreibt das Verhalten, die eigene Wirkung und das eigene Bedürfnis, ohne die Person zu bewerten.",ok:1},
  {t:"Sie beginnt mit „Ich finde, dass du …“.",why:"Das ist eine getarnte Du-Botschaft. Die Bewertung der Person bleibt erhalten, nur das Satzsubjekt wechselt.",e:"begriff"},
  {t:"Sie vermeidet jede Aussage über das Verhalten des Gegenübers.",why:"Die konkrete Verhaltensbeschreibung gehört dazu — ohne sie bleibt die Botschaft unverständlich.",e:"begriff"},
  {t:"Sie kündigt eine Konsequenz an.",why:"Die Konsequenzankündigung ist ein anderes Instrument.",e:"begriff"}],
 ans:"Die Ich-Botschaft trennt Verhalten und Person: konkretes Verhalten benennen, Wirkung auf mich schildern, Bedürfnis formulieren. Sie ist damit die sprachliche Umsetzung von „beschreiben statt kommentieren“.",
 ref:"Gordon 1977; nach Becker 2006",
 say:"Eine Ich-Botschaft nach Gordon benennt das Verhalten, meine Wirkung und mein Bedürfnis — ohne die Person zu bewerten. Sie ist die sprachliche Form von beschreiben statt kommentieren.",
 trap:{q:"Merken Jugendliche das nicht als Technik?",a:"Doch, wenn sie schablonenhaft klingt. Deshalb keine Formel, sondern echte Beschreibung — und nicht in jeder Situation."}},

{id:"st10",b:"st",hf:["E"],src:"KS",t:"single",
 q:"Was ist mit „Metaunterricht“ beziehungsweise Metakommunikation gemeint?",

  {t:"Unterricht über Lernstrategien und Metakognition.",why:"Metakognition ist ein Konzept des selbstständigen Lernens (Guldimann, Boekaerts). Metakommunikation zielt auf die Interaktion, nicht auf die Lernsteuerung.",e:"begriff"},
  {t:"Fächerübergreifender Unterricht.",why:"Kein Zusammenhang.",e:"begriff"},

{id:"st11",b:"st",hf:["E"],src:"KS",t:"single",
 q:"Wie hängen Disziplinprobleme und Motivationsprobleme zusammen?",
 o:[
  {t:"Wechselseitig: Disziplinprobleme sind Motivationsprobleme oder erzeugen sie — und Motivationsprobleme führen zu Disziplinproblemen (Heckhausen)",ok:1},
  {t:"Einseitig: Disziplinprobleme entstehen aus mangelnder Anstrengungsbereitschaft der Lernenden.",why:"Verkürzt und einseitig auf die Lernenden bezogen. Die Beziehung ist wechselseitig — und das ist der pädagogisch produktive Teil.",e:"modell"},
  {t:"Gar nicht: Motivation und Disziplin sind unabhängige Größen.",why:"Widerspricht der Befundlage. Gerade die Kopplung ist der Grund, bei wiederkehrenden Störungen zuerst die Aufgabe zu prüfen.",e:"modell"},
  {t:"Motivation ist eine Persönlichkeitseigenschaft.",why:"Widerspricht der situationsbezogenen Motivationsforschung.",e:"modell"}],
 ans:"Die Wechselseitigkeit ist der Punkt: Disziplinprobleme sind Motivationsprobleme oder erzeugen sie, und Motivationsprobleme können zu Disziplinproblemen führen. Daraus folgt die Verbindung zum Handlungsfeld U.",
 ref:"Heckhausen; nach Tell, PPT Umgang mit Unterrichtsstörungen",
 say:"Heckhausen beschreibt eine Wechselwirkung: Disziplinprobleme sind Motivationsprobleme oder erzeugen sie — und umgekehrt. Deshalb prüfe ich bei wiederkehrenden Störungen zuerst die Aufgabe.",
 trap:{q:"Dann brauchen Sie nur interessantere Aufgaben?",a:"Das wäre zu einfach. Motivation erklärt einen Teil; Beziehung, Gruppendynamik und individuelle Lebenslagen erklären andere Teile."}},

{id:"st13",b:"st",hf:["E"],src:"KS",t:"single",
 q:"Was meint „Lokalisierung von Ausnahmen“?",
 o:[
  {t:"Situationen identifizieren, in denen das Störverhalten nicht auftritt, und auf dieses Positive fokussieren.",ok:1},
  {t:"Ausnahmen von den Klassenregeln zulassen, um Eskalation zu vermeiden.",why:"Verwechselt die Beobachtungsstrategie mit einer Regelaufweichung.",e:"begriff"},
  {t:"Einzelne Schülerinnen und Schüler von Maßnahmen ausnehmen.",why:"Kein Bezug; § 53 (1) verlangt ohnehin individuelle Zurechenbarkeit.",e:"begriff"},
  {t:"Ausnahmesituationen wie Vertretungsstunden gesondert behandeln.",why:"Nicht gemeint.",e:"begriff"}],
 ans:"Der lösungsorientierte Kern: Wenn das Verhalten nicht immer auftritt, gibt es Bedingungen, unter denen es ausbleibt. Diese Bedingungen zu finden ist wirksamer, als das Problem weiter zu analysieren.",
 ref:"Lohmann 2011",
 say:"Lokalisierung von Ausnahmen heißt, gezielt die Situationen zu suchen, in denen die Störung ausbleibt — und dann zu fragen, was dort anders ist.",
