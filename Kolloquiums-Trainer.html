{id:"be05",b:"be",hf:["B","S"],src:"KS",t:"multi",
 q:"Wer gehört zum Netzwerk schulischer Beratung?",
 stem:"Mehrfachauswahl.",
 o:[
  {t:"Klassenleitung und Fachlehrkräfte",ok:1},{t:"Beratungslehrkräfte",ok:1},
  {t:"Sonderpädagoginnen und Sonderpädagogen",ok:1},{t:"Schulleitung",ok:1},
  {t:"Jugendamt",ok:1},{t:"Schulpsychologischer Dienst",ok:1},
  {t:"Schulaufsicht als Beratungsinstanz im Einzelfall",why:"Die Schulaufsicht berät Schulen in ihrer Selbstständigkeit (§ 3 SchulG), ist aber nicht Teil des Beratungsnetzes für einzelne Schülerinnen und Schüler.",e:"verfahren"}],
 ans:"Netzwerkorientierung ist ein tragendes Prinzip: Beratung ist Aufgabe jeder Lehrkraft, aber niemand berät allein. § 44 Absatz 5 nennt ausdrücklich die Zusammenarbeit mit dem schulpsychologischen Dienst und der Berufsberatung.",
 ref:"§ 44 (5) SchulG NRW; nach Tell, Schulische Beratung",
 say:"Zum Netzwerk gehören Klassenleitung und Fachlehrkräfte, Beratungslehrkräfte, Sonderpädagogik, Schulleitung, Schulsozialarbeit, Jugendamt und schulpsychologischer Dienst. § 44 Absatz 5 nennt die Zusammenarbeit ausdrücklich.",
 trap:{q:"Wen rufen Sie zuerst an?",a:"Kommt auf den Anlass an. Bei Lernproblemen die Beratungslehrkraft, bei Verdacht auf Kindeswohlgefährdung die Schulleitung — und die entscheidet über die Einbeziehung des Jugendamts nach § 42 Absatz 6."}},

{id:"be06",b:"be",hf:["B"],src:"KS",t:"single",
 q:"Wie verhält sich Datenschutz zur Beratung?",
 o:[
  {t:"Datenschutz ist zu beachten — mit der Ausnahme der Kindeswohlgefährdung.",ok:1},
  {t:"Im Beratungsgespräch gilt Datenschutz uneingeschränkt.",why:"Bei Anhaltspunkten für Kindeswohlgefährdung greift die Pflicht nach § 42 Absatz 6, jedem Anschein nachzugehen.",e:"recht"},
  {t:"Innerhalb des Kollegiums gilt kein Datenschutz.",why:"Auch intern gilt das Prinzip der Erforderlichkeit; §§ 120 ff. SchulG regeln den Schutz der Daten.",e:"recht"},
  {t:"Eltern haben ein Recht auf alle Informationen über ihre Klasse.",why:"Der Anspruch nach § 44 betrifft das eigene Kind.",e:"recht"}],
 ans:"Deine Zusammenfassung nennt es knapp: Datenschutz beachten — Ausnahme Kindeswohlgefährdung. Die rechtliche Brücke ist § 42 Absatz 6 SchulG: Die Schule entscheidet rechtzeitig über die Einbeziehung des Jugendamtes oder anderer Stellen.",
 ref:"§ 42 (6), §§ 120 ff. SchulG NRW; nach Tell, Schulische Beratung",
 say:"Datenschutz ist im Beratungsgespräch zu beachten. Die Ausnahme ist die Kindeswohlgefährdung — dann greift § 42 Absatz 6 mit der Pflicht, jedem Anschein nachzugehen.",
 trap:{q:"Ein Schüler sagt: Aber Sie erzählen es niemandem, oder?",a:"Ich verspreche keine Verschwiegenheit, die ich nicht halten kann. Ich sage vorher, dass ich manches weitergeben muss — und dass ich ihm sage, wenn ich es tue."}},

{id:"be07",b:"be",hf:["B"],src:"KS",t:"single",
 q:"Womit sollte ein Beratungsgespräch enden?",
 o:[
  {t:"Mit konkreten Vereinbarungen und einer Evaluation.",ok:1},
  {t:"Mit einer schriftlichen Zusammenfassung für die Akte.",why:"Dokumentation kann sinnvoll sein, ist aber nicht das inhaltliche Ziel.",e:"verfahren"},
  {t:"Mit einer Empfehlung der Lehrkraft.",why:"Eine Empfehlung ist keine Vereinbarung — und ohne Zustimmung der Ratsuchenden trägt sie nicht.",e:"verfahren"},
  {t:"Mit einem Folgetermin.",why:"Ein Folgetermin kann Teil der Evaluation sein, ersetzt aber die Vereinbarung nicht.",e:"verfahren"}],
 ans:"Beratung endet mit konkreten Vereinbarungen und Evaluation. Ohne beides bleibt sie ein gutes Gespräch ohne Folgen — und genau das erleben Eltern häufig.",
 ref:"nach Tell, Schulische Beratung",
 say:"Ein Beratungsgespräch endet für mich mit konkreten Vereinbarungen und einer verabredeten Überprüfung. Sonst bleibt es ein gutes Gespräch ohne Folgen.",
 trap:{q:"Was, wenn die Vereinbarung nicht eingehalten wird?",a:"Dann ist die Evaluation der Ort, das zu benennen — sachlich, ohne Vorwurf, und mit der Frage, ob die Vereinbarung realistisch war."}},

{id:"be08",b:"be",hf:["B"],src:"KS",t:"single",
 q:"Welche Aussage zur Zuständigkeit für Beratung ist richtig?",
 o:[
  {t:"Beratung ist Aufgabe jeder Lehrkraft und Teil professionellen Lehrerhandelns neben Unterrichten, Erziehen und Beurteilen.",ok:1},
  {t:"Beratung ist Aufgabe der Klassenleitung.",why:"Die Klassenleitung hat besondere Beratungsanlässe, aber die Aufgabe trifft jede Lehrkraft.",e:"verfahren"},
  {t:"Beratung ist ein freiwilliges Zusatzangebot.",why:"§ 44 begründet einen Anspruch.",e:"recht"},
  {t:"Beratung erfolgt nur auf Anfrage der Eltern.",why:"§ 44 Absatz 2 verpflichtet aktiv zur Information über die Lern- und Leistungsentwicklung.",e:"recht"}],
 ans:"Beratung steht in einer Reihe mit Unterrichten, Erziehen und Beurteilen — sie ist eine Kernaufgabe, kein Anhängsel. Der Bezug zum Handlungsfeld B und zu § 8 ADO (individuelle Förderung) ist unmittelbar.",
 ref:"§ 44 SchulG; § 8 ADO; nach Tell, Schulische Beratung",
 say:"Beratung ist Aufgabe jeder Lehrkraft und gehört als Kernaufgabe neben Unterrichten, Erziehen und Beurteilen.",
 trap:{q:"Wo nehmen Sie die Zeit her?",a:"Ehrliche Antwort: Nicht jede Beratung ist ein Termin. Vieles passiert in fünf Minuten nach der Stunde — vorausgesetzt, ich habe die Beziehung dafür."}},

{id:"be09",b:"be",hf:["B"],src:"KS",t:"single",
 q:"Was ist mit „lösungs- und ressourcenorientierter“ Beratung gemeint?",
 o:[
  {t:"Der Fokus liegt auf vorhandenen Stärken und auf dem gewünschten Zielzustand statt auf der Problemanalyse.",ok:1},
  {t:"Die Lehrkraft schlägt möglichst schnell eine Lösung vor.",why:"Lösungsorientierung heißt nicht, dass die Lehrkraft die Lösung liefert — sondern dass das Gespräch auf den Zielzustand ausgerichtet ist.",e:"begriff"},
  {t:"Es werden nur schulische Ressourcen einbezogen.",why:"Ressourcen meint Stärken und Möglichkeiten der Person, nicht Ausstattung.",e:"begriff"},
  {t:"Probleme werden nicht angesprochen.",why:"Sie werden angesprochen, aber sie strukturieren das Gespräch nicht.",e:"begriff"}],
 ans:"Die Verwandtschaft zu Lohmanns Interventionslogik ist eng: Lokalisierung von Ausnahmen, positive Motivzuschreibung, Wunderfrage — dieselbe systemisch-lösungsorientierte Herkunft.",
 ref:"nach Tell, Schulische Beratung; Lohmann 2011",
 say:"Lösungs- und ressourcenorientiert heißt, dass ich am Zielzustand und an vorhandenen Stärken arbeite statt an der Problemanalyse. Die Verwandtschaft zu Lohmanns Strategien ist deutlich.",
 trap:{q:"Und wenn es keine Ressourcen gibt?",a:"Die gibt es fast immer — aber sie sind manchmal außerhalb der Schule. Deshalb die Netzwerkorientierung."}},

{id:"be10",b:"be",hf:["B","L"],src:"AMT",t:"single",
 q:"Welche Pflicht ergibt sich aus § 44 (2) SchulG im Zusammenhang mit Noten?",
 o:[
  {t:"Bewertungsmaßstäbe sind zu erläutern; auf Wunsch werden Leistungsstand und einzelne Beurteilungen erklärt — auch bei Prüfungsleistungen.",ok:1},
  {t:"Jede Note ist schriftlich zu begründen.",why:"Eine generelle Schriftformpflicht besteht nicht.",e:"recht"},
  {t:"Noten sind nur auf Zeugnissen mitzuteilen.",why:"Absatz 2 verlangt laufende Information über die Lern- und Leistungsentwicklung.",e:"recht"},
  {t:"Die Bewertungsmaßstäbe legt die Schulkonferenz fest.",why:"Grundsätze der Leistungsbewertung stehen in § 48 SchulG, Konkretisierungen in APO und Fachkonferenz.",e:"recht"}],
 ans:"§ 44 (2) verbindet Beratung und Leistungsbewertung: Lehrkräfte informieren über die individuelle Lern- und Leistungsentwicklung und beraten; die Bewertungsmaßstäbe sind zu erläutern. Das gilt ausdrücklich auch für die Bewertung von Prüfungsleistungen.",
 ref:"§ 44 (2) SchulG NRW",
 say:"§ 44 Absatz 2 verpflichtet mich, die Bewertungsmaßstäbe zu erläutern und auf Wunsch den Leistungsstand und einzelne Beurteilungen zu erklären — auch bei Prüfungsleistungen.",
 trap:{q:"Transparenz der Maßstäbe — wie machen Sie das konkret?",a:"Kriterienraster vor der Leistung offenlegen, nicht erst bei der Rückgabe. Das ist zugleich lernwirksam: Hattie zeigt, dass klare Erfolgskriterien zu den wirksamen Faktoren gehören."}},

{id:"be11",b:"be",hf:["B"],src:"ERG",t:"case",
 q:"Ein Vater kommt aufgebracht in die Sprechstunde: Die Note seiner Tochter sei ungerecht. Wie beginnst du?",
 stem:"Fallfrage.",
 o:[
  {t:"Zuhören, das Anliegen und die Erwartung klären, erst danach die Bewertungsgrundlage erläutern.",ok:1},
  {t:"Sofort die Bewertungskriterien darlegen, um sachlich zu bleiben.",why:"Fachlich richtig, im Timing falsch. Wer im Erregungszustand mit Kriterien konfrontiert wird, hört sie nicht — Eckert: aktives Zuhören vor Ratschlag.",e:"verfahren"},
  {t:"Auf die Zuständigkeit der Schulleitung verweisen.",why:"Zuständig bist zunächst du; § 44 Absatz 2 verpflichtet dich zur Erläuterung.",e:"recht"},
  {t:"Die Note zur Beruhigung als vorläufig bezeichnen.",why:"Unehrlich und rechtlich problematisch — und es untergräbt die eigene Bewertung.",e:"verfahren"}],
 ans:"Reihenfolge entscheidet: erst verstehen, dann erklären. Häufig geht es nicht um die Note, sondern um eine Sorge dahinter. Danach die Pflicht aus § 44 (2) erfüllen — Maßstäbe erläutern, Beurteilung erklären. Und die Rollengrenze halten: Die Note wird begründet, nicht verhandelt.",
 ref:"§ 44 (2) SchulG; Eckert et al. 2024",
 say:"Ich höre zuerst zu und kläre, was er eigentlich braucht. Erst danach erläutere ich die Bewertungsgrundlage — dazu bin ich nach § 44 Absatz 2 ohnehin verpflichtet. Verhandelt wird die Note nicht.",
 trap:{q:"Er droht mit dem Anwalt.",a:"Ruhig bleiben, den Rechtsweg sachlich benennen und an die Schulleitung übergeben. Drohung verändert die Bewertung nicht — aber sie verändert das Verfahren."}},

{id:"be12",b:"be",hf:["B"],src:"ERG",t:"single",
 q:"Welchen sachlichen Einwand kannst du gegen rein lösungsorientierte Beratung formulieren?",
 o:[
  {t:"Sie kann strukturelle Ursachen individualisieren — wenn das Problem im System liegt, hilft die Suche nach persönlichen Ressourcen nur begrenzt.",ok:1},
  {t:"Sie ist zu zeitaufwendig.",why:"Sie ist eher kürzer als problemorientierte Beratung.",e:"begriff"},
  {t:"Sie ist rechtlich nicht zulässig.",why:"§ 44 macht keine methodischen Vorgaben.",e:"recht"},
  {t:"Sie erfordert eine therapeutische Ausbildung.",why:"Sie ist gerade auf nicht-therapeutische Kontexte übertragbar.",e:"begriff"}],
 ans:"Der stärkste Einwand ist der Individualisierungsvorwurf: Wer nach Ressourcen sucht, kann übersehen, dass Armut, Diskriminierung oder Überforderung durch Strukturen die Ursache sind. Die Antwort ist nicht der Verzicht auf die Methode, sondern die Verbindung mit Netzwerkorientierung.",
 ref:"Ergänzt; anschlussfähig an Leitlinie Vielfalt",
 say:"Der ernsthafteste Einwand gegen rein lösungsorientierte Beratung ist die Individualisierung: Wenn die Ursache strukturell ist, hilft die Ressourcensuche nur begrenzt. Deshalb gehört die Netzwerkorientierung zwingend dazu.",
 trap:{q:"Was tun Sie bei einem strukturellen Problem?",a:"Ich kann es nicht in der Sprechstunde lösen, aber ich kann es benennen und weitergeben — an Schulsozialarbeit, Jugendhilfe, gegebenenfalls in die Gremien."}},

{id:"be13",b:"be",hf:["B","V"],src:"KS",t:"single",
 q:"Was verlangt das Handlungsfeld B im Hinblick auf kulturell begründete Wertvorstellungen?",
 o:[
  {t:"Lehrkräfte beraten anlass- und situationsgerecht auch unter Berücksichtigung kulturell begründeter Wertvorstellungen lösungsorientiert.",ok:1},
  {t:"Lehrkräfte beraten unabhängig von kulturellen Prägungen einheitlich.",why:"Die Formulierung des Kerncurriculums verlangt ausdrücklich die Berücksichtigung.",e:"hf"},
  {t:"Kulturelle Fragen werden an externe Stellen abgegeben.",why:"Keine solche Delegation vorgesehen.",e:"hf"},
  {t:"Kulturelle Wertvorstellungen sind im Beratungsgespräch auszuklammern.",why:"Das Gegenteil ist gemeint.",e:"hf"}],
 ans:"Die Formulierung stammt aus dem Handlungsfeld B und verbindet es unmittelbar mit der Leitlinie Vielfalt. Berücksichtigen heißt nicht übernehmen — es heißt, die Perspektive zu kennen, in der beraten wird.",
 ref:"Kerncurriculum, Handlungsfeld B; nach Tell, Schulische Beratung",
 say:"Das Handlungsfeld B verlangt, anlass- und situationsgerecht und auch unter Berücksichtigung kulturell begründeter Wertvorstellungen lösungsorientiert zu beraten.",
 trap:{q:"Wo ist die Grenze der Berücksichtigung?",a:"Am Recht und am Kindeswohl. Ich kann Perspektiven verstehen, ohne Positionen zu übernehmen, die dem Bildungs- und Erziehungsauftrag nach § 2 widersprechen."}},

{id:"be14",b:"be",hf:["B"],src:"KS",t:"speak",
 q:"Erläutere dein Verständnis schulischer Beratung — rechtlich verankert, mit Rollengrenze und Netzwerkbezug.",
 stem:"90 Sekunden.",
 musts:[
  "Ich habe § 44 SchulG als Rechtsgrundlage genannt.",
  "Ich habe den Bezug zu § 1 SchulG und zur individuellen Förderung hergestellt.",
  "Ich habe die Rollengrenze benannt: beraten, nicht therapieren.",
  "Ich habe die Netzwerkorientierung erwähnt und mindestens zwei Partner genannt.",
  "Ich habe aktives Zuhören als Schlüsselkompetenz eingeordnet.",
  "Ich habe ein konkretes eigenes Beratungsbeispiel angeführt.",
  "Ich habe gesagt, dass Beratung mit Vereinbarung und Evaluation endet."],
 model:"Rechtlicher Rahmen zuerst: § 44 als Anspruch, § 1 als Zweck — Beratung dient der individuellen Förderung. Dann die Formen: Lern-, Schullaufbahn-, Erziehungsberatung, mit dem Hinweis auf Nähe und Distanz. Dann die Rollengrenze, klar und ohne Einschränkung: beraten, nicht therapieren. Dann die Methodik in einem Satz: lösungs- und ressourcenorientiert, aktives Zuhören als Schlüssel. Dann das Netzwerk mit zwei konkreten Partnern. Dann dein Beispiel. Und zum Schluss der Satz über Vereinbarung und Evaluation, weil er zeigt, dass du Beratung als Prozess und nicht als Gespräch denkst.",
 crit:["sach","folge","komplex"],
 ref:"§ 44, § 1, § 42 (6) SchulG NRW; Handlungsfeld B",
 trap:{q:"Sie sagen, Sie therapieren nicht. Was tun Sie, wenn ein Schüler Ihnen von Suizidgedanken erzählt?",a:"Ich bleibe bei ihm, nehme es ernst, verspreche keine Verschwiegenheit und hole sofort Hilfe — Schulleitung, schulpsychologischer Dienst. Das ist keine Beratungssituation mehr."}}
);

/* ===================== BLOCK: UNTERRICHTSGESPRÄCHE (12) ===================== */
Q.push(
{id:"ug01",b:"ug",hf:["U"],src:"KS",t:"single",
 q:"Was macht ein Unterrichtsgespräch im fachlichen Sinn aus?",
 o:[
  {t:"Gemeinsamer Austausch der Lehrkraft mit möglichst allen und zwischen allen Lernenden zu einem klar definierten Thema (Leisen)",ok:1},
  {t:"Der fragend-entwickelnde Wechsel von Lehrerfrage und Schülerantwort.",why:"Das ist eine Form des Unterrichtsgesprächs, nicht die Definition — und gerade nicht die, die den Austausch zwischen allen betont.",e:"begriff"},
  {t:"Jede mündliche Äußerung im Unterricht.",why:"Zu weit; die Definition verlangt ein klar definiertes Thema und gemeinsamen Austausch.",e:"begriff"},
  {t:"Die Phase der Ergebnissicherung im Plenum.",why:"Zu eng auf eine Phase begrenzt.",e:"begriff"}],
 ans:"Zwei Merkmale sind entscheidend: der Austausch mit möglichst allen und zwischen allen — nicht nur zwischen Lehrkraft und Einzelnen — und das klar definierte Thema.",
 ref:"Josef Leisen; nach Tell, Unterrichtsgespräche führen",
 say:"Leisen definiert das Unterrichtsgespräch als Situationen gemeinsamen Austauschs der Lehrkraft mit möglichst allen und zwischen allen Lernenden zu einem klar definierten Thema.",
 trap:{q:"Wie oft findet in Ihrem Unterricht ein Gespräch zwischen allen statt?",a:"Ehrlich sein. Der Normalfall ist das Sternmuster über die Lehrkraft. Das zu benennen ist stärker, als es zu behaupten."}},

{id:"ug02",b:"ug",hf:["U"],src:"KS",t:"single",
 q:"Wie wirksam ist das Unterrichtsgespräch im Vergleich zu anderen Unterrichtsstrategien?",
 o:[
  {t:"Es gehört zu den wirksamsten Strategien überhaupt (Hattie 2023)",ok:1},
  {t:"Es ist deutlich weniger wirksam als selbstständiges Arbeiten.",why:"Widerspricht der Befundlage — und trifft ein verbreitetes Missverständnis: Stille Einzelarbeit ist nicht der Goldstandard.",e:"modell"},
  {t:"Es wirkt nur in kleinen Lerngruppen.",why:"Keine solche Einschränkung in der Befundlage. Entscheidend ist die Struktur, nicht die Gruppengröße.",e:"modell"},
  {t:"Seine Wirksamkeit steigt mit der Redezeit der Lehrkraft.",why:"Eher umgekehrt: Ein hoher Lehreranteil ist typisch für die wenig wirksamen Gesprächsformen.",e:"modell"}],
 ans:"Die classroom discussion zählt bei Hattie zu den wirksamsten Strategien. Der Befund ist im Kolloquium stark, weil er ein häufiges Missverständnis korrigiert: Nicht die stille Einzelarbeit ist der Goldstandard, sondern das strukturierte Gespräch.",
 ref:"Hattie 2023; nach Tell, Unterrichtsgespräche führen",
 say:"Hattie ordnet die classroom discussion den wirksamsten Unterrichtsstrategien zu. Das spricht dafür, dem Gespräch mehr Raum zu geben — vorausgesetzt, es ist strukturiert.",
 trap:{q:"Effektstärken sind methodisch umstritten. Stört Sie das?",a:"Ja, und es ist ein berechtigter Einwand — Metaanalysen mitteln über sehr unterschiedliche Studien. Ich nutze Hattie als Hinweis auf Richtung, nicht als Beweis."}},

{id:"ug03",b:"ug",hf:["U"],src:"KS",t:"multi",
 q:"Welche Kompetenzen des Handlungsfelds U ordnet deine Zusammenfassung dem Unterrichtsgespräch zu?",
 stem:"Mehrfachauswahl.",
 o:[
  {t:"Kompetenz 1: Unterricht unter Berücksichtigung unterschiedlicher Lernvoraussetzungen fach- und sachgerecht planen und durchführen",ok:1},
  {t:"Kompetenz 2: durch die Gestaltung von Lernsituationen das Lernen unterstützen, motivieren und befähigen, Zusammenhänge herzustellen und Gelerntes zu nutzen",ok:1},
  {t:"Kompetenz 8: Leistungsentwicklung erfassen und Lernen auf Grundlage transparenter Beurteilungsmaßstäbe beurteilen",why:"Kompetenz 8 gehört zum Handlungsfeld L. Das Unterrichtsgespräch ist zwar Teil der sonstigen Mitarbeit, aber die Zuordnung hier lautet U.",e:"hf"}],
 ans:"Handlungsfeld U, Kompetenzen 1 und 2. Der Bezug zu L über die sonstige Mitarbeit besteht, ist aber nicht die Verortung des Themas.",
 ref:"Kerncurriculum, Handlungsfeld U; nach Tell, Unterrichtsgespräche führen",
 say:"Ich verorte das Unterrichtsgespräch im Handlungsfeld U mit den Kompetenzen 1 und 2 — mit einem deutlichen Bezug zu L, weil mündliche Beteiligung Teil der sonstigen Mitarbeit ist.",
 trap:{q:"Wie bewerten Sie mündliche Beteiligung fair?",a:"Kriterien vorab offenlegen, Qualität vor Quantität, und Formate schaffen, in denen auch Zurückhaltende zeigen können, was sie können — Think-Pair-Share zum Beispiel."}},

{id:"ug04",b:"ug",hf:["U"],src:"KS",t:"single",
 q:"Welche Gestaltungsmöglichkeit nennt deine Zusammenfassung ausdrücklich als Alternative zur Frage?",
 o:[
  {t:"Zwei Aspekte vergleichen lassen, Thesen aufstellen, Sozialformen wechseln, Rollenwechsel.",ok:1},
  {t:"Die Frage schriftlich stellen.",why:"Nicht genannt; es geht um andere Impulsformen, nicht um das Medium.",e:"begriff"},
  {t:"Die Antwort vorwegnehmen.",why:"Widerspricht dem Prinzip des Gesprächs.",e:"begriff"},
  {t:"Die Frage an einen einzelnen Schüler richten.",why:"Nolting empfiehlt gerade das Gegenteil: Fragen erkennbar an die ganze Klasse richten.",e:"begriff"}],
 ans:"Der Vergleich, die These und der Rollenwechsel erzeugen Positionierungen statt Antwortsuche. Damit entsteht Austausch zwischen den Lernenden — genau das, was Leisens Definition verlangt.",
 ref:"nach Tell, Unterrichtsgespräche führen",
 say:"Statt zu fragen, kann ich vergleichen lassen, eine These in den Raum stellen, die Sozialform wechseln oder mit Rollenwechseln arbeiten. Das erzeugt Positionierung statt Antwortsuche.",
 trap:{q:"Warum ist eine These stärker als eine Frage?",a:"Weil eine Frage nach der einen richtigen Antwort sucht und alle anderen ausschließt. Eine These lädt zum Widerspruch ein — und Widerspruch erzeugt Beteiligung."}},

{id:"ug05",b:"ug",hf:["U"],src:"KS",t:"single",
 q:"Wie lang sollte die Wartezeit nach einer Frage sein?",
 o:[
  {t:"Denkzeit gewähren, je nach Fragentyp unterschiedlich lang.",ok:1},
  {t:"Sofort aufrufen, um den Unterrichtsfluss zu erhalten.",why:"Verwechselt Unterrichtsfluss mit Tempo. Fluss meint Leerlaufvermeidung, nicht kurze Denkzeit.",e:"modell"},
  {t:"Immer mindestens 30 Sekunden warten.",why:"Eine feste Sekundenzahl nennt die Zusammenfassung nicht; die Länge hängt vom Fragentyp ab.",e:"begriff"},
  {t:"Die Wartezeit durch Meldungen steuern.",why:"Wer nach der ersten Meldung aufruft, beendet die Denkzeit für alle anderen.",e:"begriff"}],
 ans:"Denkzeit ist Teil der breiten Aktivierung. Die Differenzierung nach Fragentyp ist der Punkt: Eine Reproduktionsfrage braucht wenig, eine Bewertungsfrage viel Zeit.",
 ref:"Nolting 2013; nach Tell, PPT Classroom Management",
 say:"Nolting empfiehlt, Denkzeit zu gewähren — je nach Fragentyp unterschiedlich lang. Eine Bewertungsfrage braucht deutlich mehr Zeit als eine Reproduktionsfrage.",
 trap:{q:"Wie halten Sie Stille aus?",a:"Indem ich sie ankündige. Wenn ich sage, dass ich jetzt dreißig Sekunden warte, ist sie kein Zeichen des Scheiterns mehr."}},

{id:"ug06",b:"ug",hf:["U"],src:"ERG",t:"single",
 q:"Was bezeichnet das „IRE-Muster“ im Unterrichtsgespräch?",
 o:[
  {t:"Initiation, Response, Evaluation — Lehrerfrage, Schülerantwort, Lehrerbewertung; das dominante und wenig anspruchsvolle Grundmuster.",ok:1},
  {t:"Eine Methode zur Ergebnissicherung.",why:"Kein Sicherungsverfahren, sondern ein beschreibendes Interaktionsmuster.",e:"begriff"},
  {t:"Ein Modell der Fragetypen.",why:"Es beschreibt die Zugstruktur, nicht die Fragearten.",e:"begriff"},
  {t:"Eine Form kooperativen Lernens.",why:"Es ist das Gegenteil — die Kommunikation läuft ausschließlich über die Lehrkraft.",e:"begriff"}],
 ans:"Das IRE-Muster ist das empirisch dominante Muster im Unterrichtsgespräch. Es hält die Lehrkraft im Zentrum jedes zweiten Zuges und lässt kaum Austausch zwischen Lernenden zu — genau der Gegenpol zu Leisens Definition. Das ist nicht in deinen Unterlagen; ich ergänze es, weil es ein guter Anknüpfungspunkt für Kriterium 4 ist.",
 ref:"Ergänzt; Unterrichtskommunikationsforschung, u. a. Mehan 1979",
 say:"Das dominante Muster im Unterrichtsgespräch ist IRE — Lehrerfrage, Schülerantwort, Lehrerbewertung. Die Lehrkraft ist bei jedem zweiten Zug beteiligt, echter Austausch zwischen Lernenden entsteht dabei kaum.",

const LSKEY = "kolloq_trainer_v1";
const CODEKEY = "kolloq_trainer_code";
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const addDays = (d, n) => { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5);

let S = null, SES = null, VIEW = "heute", DIRTY = 0, FB_ACTIVE = false;

function fresh() {
  return {
    v: 1, exam: null, onb: 0, theme: "light",
    src: { KS: 1, LAQ: 1, AMT: 1, ERG: 1 },
    items: {}, errs: {}, crit: {}, notes: [], log: {},
    streak: { last: null, n: 0 }
  };
}

/* ---------- Gerätecode ---------- */
function genCode() {
  const arr = new Uint32Array(4); crypto.getRandomValues(arr);
  return [...arr].map(n => n.toString(36).toUpperCase().padStart(4, "0").slice(0, 4)).join("-");
}
function getCode() {
  let c = localStorage.getItem(CODEKEY);
  if (!c) { c = genCode(); localStorage.setItem(CODEKEY, c); }
  return c;
}
function setCode(c) { localStorage.setItem(CODEKEY, c); }

/* ---------- Firestore-Zugriff (fällt lautlos aus, wenn nicht eingerichtet) ---------- */
async function fbGet(code) {
  if (!window.__fb || !window.__fb.db) return null;
  const uid = await window.__fb.ready; if (!uid) return null;
  try {
    const ref = window.__fb.doc(window.__fb.db, "sessions", code);
    const snap = await window.__fb.getDoc(ref);
    FB_ACTIVE = true;
    return snap.exists() ? snap.data().payload : null;
  } catch (e) { return null; }
}
async function fbSet(code, data) {
  if (!window.__fb || !window.__fb.db) return false;
  const uid = await window.__fb.ready; if (!uid) return false;
  try {
    const ref = window.__fb.doc(window.__fb.db, "sessions", code);
    await window.__fb.setDoc(ref, { payload: data, updated: Date.now() });
    FB_ACTIVE = true; return true;
  } catch (e) { return false; }
}

/* ---------- Persistenz: lokal zuerst, Cloud im Hintergrund ---------- */
async function load() {
  const code = getCode();
  const remote = await fbGet(code);
  if (remote) { try { localStorage.setItem(LSKEY, JSON.stringify(remote)); } catch (e) { } return remote; }
  try { const raw = localStorage.getItem(LSKEY); if (raw) return JSON.parse(raw); } catch (e) { }
  return null;
}
let fbTimer = null;
function save() {
  DIRTY++;
  try { localStorage.setItem(LSKEY, JSON.stringify(S)); } catch (e) { }
  clearTimeout(fbTimer);
  fbTimer = setTimeout(() => fbSet(getCode(), S), 1500);
}
function flushNow() { clearTimeout(fbTimer); fbSet(getCode(), S); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && S) flushNow(); });
window.addEventListener("beforeunload", () => { if (S) flushNow(); });

function toast(m) {
  const t = $("#toast"); t.textContent = m; t.classList.add("on");
  clearTimeout(t._x); t._x = setTimeout(() => t.classList.remove("on"), 2600);
}

/* ---------- Phasenlogik ---------- */
function daysLeft() { return S.exam ? daysBetween(today(), S.exam) : null; }
function phase() {
  const d = daysLeft();
  if (d === null) return { k: "aufbau", n: "Aufbauphase", d: "Neue Inhalte blockweise, Erklärungen ausführlich." };
  if (d > 42) return { k: "aufbau", n: "Aufbauphase", d: "Neue Inhalte blockweise, Erklärungen ausführlich." };
  if (d > 21) return { k: "vernetzung", n: "Vernetzungsphase", d: "Themen werden gemischt, weniger Neues." };
  if (d > 7) return { k: "simulation", n: "Simulationsphase", d: "Sprechkarten und Fälle dominieren." };
  return { k: "feinschliff", n: "Feinschliff", d: "Nur noch Wackeliges und nur zitierfähige Quellen." };
}
function intervals() {
  const k = phase().k;
  return (k === "simulation" || k === "feinschliff") ? [1, 2, 4, 7, 10] : [1, 3, 7, 16, 35];
}

/* ---------- Item-Zugriff ---------- */
const byId = {}; Q.forEach(q => byId[q.id] = q);
function it(id) { return S.items[id] || null; }
function srcOk(q) { return !!S.src[q.src]; }
function pool() { return Q.filter(srcOk); }
function isDue(id) { const i = it(id); return i && i.due <= today(); }
function shaky(id) { const i = it(id); return i && (i.box <= 2 || i.sf > 0); }

/* ---------- Session-Planer ---------- */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }

function planHeute() {
  const ph = phase().k, p = pool();
  const seen = p.filter(q => it(q.id)), unseen = p.filter(q => !it(q.id));
  let due = shuffle(seen.filter(q => isDue(q.id)));
  if (ph === "feinschliff") due = due.concat(shuffle(seen.filter(q => shaky(q.id) && !isDue(q.id))));

  const blocksOrdered = Object.keys(BLOCKS).sort((a, b) => BLOCKS[a].ord - BLOCKS[b].ord);
  let nextBlock = blocksOrdered.find(b => unseen.some(q => q.b === b)) || null;

  let nNew = ph === "aufbau" ? 7 : ph === "vernetzung" ? 4 : ph === "simulation" ? 2 : 0;
  let nDue = ph === "aufbau" ? 5 : ph === "vernetzung" ? 8 : 8;

  let list = due.slice(0, nDue);
  let newOnes = (ph === "vernetzung" ? shuffle(unseen) : unseen.filter(q => q.b === nextBlock))
    .filter(q => q.t !== "speak").slice(0, nNew);
  list = list.concat(newOnes);

  const wantSpeak = ph === "simulation" || ph === "feinschliff" ? 2 : 1;
  const speaks = shuffle(p.filter(q => q.t === "speak" && !list.includes(q)))
    .sort((a, b) => (it(a.id) ? 1 : 0) - (it(b.id) ? 1 : 0)).slice(0, wantSpeak);
  const cases = shuffle(p.filter(q => q.t === "case" && !list.includes(q) && !it(q.id))).slice(0, 1);

  list = list.concat(cases, speaks);
  if (ph !== "aufbau") list = shuffle(list);
  return list.map(q => q.id).slice(0, 16);
}

function planBlock(b) { return shuffle(pool().filter(q => q.b === b)).map(q => q.id); }
function planDrill() {
  const p = pool().filter(q => q.t !== "speak");
  const weak = p.filter(q => shaky(q.id)), rest = p.filter(q => !shaky(q.id));
  return shuffle(weak).slice(0, 12).concat(shuffle(rest).slice(0, 20)).slice(0, 20).map(q => q.id);
}
function planFehler() {
  return pool().filter(q => shaky(q.id)).sort((a, b) => (it(b.id).sf - it(a.id).sf) || (it(a.id).box - it(b.id).box)).map(q => q.id);
}
function planRecht() { return shuffle(pool().filter(q => q.b === "r1" || q.b === "r2")).map(q => q.id); }
function planPruefung() {
  const p = pool();
  const impuls = p.find(q => q.id === "imp01");
  const rest = shuffle(p.filter(q => q.id !== "imp01"));
  const a = rest.filter(q => q.t === "speak").slice(0, 2);
  const b = rest.filter(q => q.t === "case").slice(0, 2);
  const c = rest.filter(q => q.t !== "speak" && q.t !== "case").slice(0, 10);
  const half = [].concat(a.slice(0, 1), c.slice(0, 5), b.slice(0, 1));
  const rest2 = [].concat(a.slice(1), c.slice(5), b.slice(1));
  return [impuls].concat(half, rest2).filter(Boolean).map(q => q.id);
}

/* ---------- Bewertung ---------- */
function record(q, correct, conf, errKind) {
  const i = S.items[q.id] || (S.items[q.id] = { box: 0, due: today(), n: 0, ok: 0, sf: 0 });
  i.n++;
  if (correct) { i.ok++; i.box = Math.min(5, i.box + 1); }
  else { i.box = 1; if (conf === "sicher") i.sf++; }
  if (correct && conf === "sicher" && i.box < 2) i.box = 2;
  const iv = intervals();
  let step = Math.max(1, i.box) - 1;
  if (correct && conf === "unsicher") step = Math.max(0, step - 1);
  i.due = addDays(today(), iv[Math.min(step, iv.length - 1)]);
  if (!correct && errKind) S.errs[errKind] = (S.errs[errKind] || 0) + 1;
  const d = today();
  S.log[d] = S.log[d] || { n: 0, ok: 0 };
  S.log[d].n++; if (correct) S.log[d].ok++;
  if (S.streak.last !== d) {
    S.streak.n = (S.streak.last && daysBetween(S.streak.last, d) === 1) ? S.streak.n + 1 : 1;
    S.streak.last = d;
  }
  save();
}

  t1.onclick = () => { S.theme = S.theme === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = S.theme; save(); rail(); };
  const t2 = el("button", null, "Fortschritt exportieren");

}

    "<tr><td>Heute fällig</td><td class='num'>" + dueN + "</td></tr>" +
    "<tr><td>Wackelig</td><td class='num'>" + pool().filter(q => shaky(q.id)).length + "</td></tr>" +
    "<tr><td>Tage in Folge</td><td class='num'>" + (S.streak.n || 0) + "</td></tr>";
  s.appendChild(t2);
  v.appendChild(s);
}

/* ---------- Session ---------- */
function startSession(ids, title, seconds) {
  if (!ids.length) { toast("Keine Fragen im aktuellen Filter."); return; }
  SES = { ids: ids, i: 0, title: title, res: [], t0: Date.now(), limit: seconds || 0 };
  VIEW = "session"; render();
}

function viewSession(v) {
  if (!SES) return viewHeute(v);
  if (SES.i >= SES.ids.length) return viewSummary(v);
  const q = byId[SES.ids[SES.i]];
  const bar = el("div"); bar.id = "bar";
  const bi = el("i"); bi.style.width = Math.round(SES.i / SES.ids.length * 100) + "%";
  bar.appendChild(bi); v.appendChild(bar);

  const head = el("div", "qhead");
  head.innerHTML = "<span class='tag " + q.src + "'>" + q.src + "</span>" +
    q.hf.map(h => "<span class='tag'>" + h + "</span>").join("") +
    "<span>" + esc(BLOCKS[q.b].n) + "</span><span>·</span><span>" + (SES.i + 1) + " von " + SES.ids.length + "</span>" +
    "<span>·</span><span>" + esc(SES.title) + "</span>" +
    (SES.limit ? "<span>·</span><span id='clk'></span>" : "");
  v.appendChild(head);
  if (SES.limit) tickClock();

  const qt = el("div", "qtext");
  if (q.stem) qt.appendChild(el("span", "stem", esc(q.stem)));
  qt.appendChild(document.createTextNode(q.q));
  v.appendChild(qt);

  const box = el("div"); v.appendChild(box);
  ({ single: rSingle, case: rSingle, multi: rMulti, order: rOrder, match: rMatch, speak: rSpeak }[q.t])(box, q);
}

function tickClock() {
  const c = $("#clk"); if (!c || !SES) return;
  const left = SES.limit - Math.floor((Date.now() - SES.t0) / 1000);
  const m = Math.max(0, Math.floor(left / 60)), s = Math.max(0, left % 60);
  c.textContent = m + ":" + String(s).padStart(2, "0") + " verbleibend";
  setTimeout(tickClock, 1000);
}

function confRow(box, onCheck) {
  const r = el("div", "confrow");
  r.appendChild(el("div", "hint", "Wie sicher bist du? Das ist wichtiger als richtig oder falsch — sicher und falsch ist die Kategorie, die im Kolloquium teuer wird."));
  const a = el("button", "btn", "Prüfen — ich bin sicher");
  const b = el("button", "btn ghost", "Prüfen — unsicher");
  a.onclick = () => onCheck("sicher"); b.onclick = () => onCheck("unsicher");
  r.append(a, b); box.appendChild(r);
  box._check = onCheck;
}

/* --- single / case --- */
function rSingle(box, q) {
  let sel = -1, done = 0;
  const ord = shuffle(q.o.map((_, i) => i));   // Reihenfolge der Optionen mischen
  const wrap = el("div", "opts");
  ord.forEach((oi, pos) => {
    const o = q.o[oi];
    const b = el("button", "opt");
    b.appendChild(el("span", "key", pos + 1));
    const t = el("span"); t.appendChild(document.createTextNode(o.t)); b.appendChild(t);
    b.onclick = () => { if (done) return; sel = pos; [...wrap.children].forEach((c, j) => c.classList.toggle("sel", j === pos)); };
    wrap.appendChild(b);
  });
  box.appendChild(wrap);
  confRow(box, conf => {
    if (done || sel < 0) { if (sel < 0) toast("Erst eine Antwort wählen."); return; }
    done = 1;
    const chosen = q.o[ord[sel]];
    const ok = !!chosen.ok;
    [...wrap.children].forEach((c, pos) => {
      const o = q.o[ord[pos]];
      c.classList.remove("sel"); c.classList.add("locked");
      if (o.ok) c.classList.add("right");
      else if (pos === sel) c.classList.add("wrong");
      if (!o.ok && o.why) c.querySelector("span:last-child").appendChild(el("span", "why", "<b>Warum nicht:</b> " + esc(o.why)));
    });
    finish(box, q, ok, conf, ok ? null : chosen.e);
  });
  keys(box, wrap, i => { if (!done) { sel = i; [...wrap.children].forEach((c, j) => c.classList.toggle("sel", j === i)); } });
}

/* --- multi --- */
function rMulti(box, q) {
  const sel = new Set(); let done = 0;
  const ord = shuffle(q.o.map((_, i) => i));   // Reihenfolge der Optionen mischen
  const wrap = el("div", "opts");
  ord.forEach((oi, pos) => {
    const o = q.o[oi];
    const b = el("button", "opt");
    b.appendChild(el("span", "key", pos + 1));
    const t = el("span"); t.appendChild(document.createTextNode(o.t)); b.appendChild(t);
    b.onclick = () => { if (done) return; sel.has(pos) ? sel.delete(pos) : sel.add(pos); b.classList.toggle("sel", sel.has(pos)); };
    wrap.appendChild(b);
  });
  box.appendChild(wrap);
  confRow(box, conf => {
    if (done) return; if (!sel.size) { toast("Erst auswählen."); return; }
    done = 1;
    let ok = 1, err = null;
    ord.forEach((oi, pos) => {
      const o = q.o[oi];
      if (!!o.ok !== sel.has(pos)) { ok = 0; if (!o.ok && sel.has(pos)) err = err || o.e; }
    });
    if (!ok && !err) err = "begriff";
    [...wrap.children].forEach((c, pos) => {
      const o = q.o[ord[pos]];
      c.classList.remove("sel"); c.classList.add("locked");
      if (o.ok) c.classList.add("right");
      else if (sel.has(pos)) c.classList.add("wrong");
      if (!o.ok && o.why) c.querySelector("span:last-child").appendChild(el("span", "why", "<b>Warum nicht:</b> " + esc(o.why)));
    });
    finish(box, q, !!ok, conf, err);
  });
  keys(box, wrap, i => { if (!done) { sel.has(i) ? sel.delete(i) : sel.add(i); wrap.children[i].classList.toggle("sel", sel.has(i)); } });
}

/* --- order --- */
function rOrder(box, q) {
  let cur = shuffle(q.steps.map((_, i) => i)); let done = 0;
  const wrap = el("div", "ord"); box.appendChild(wrap);
  function draw() {
    wrap.innerHTML = "";
    cur.forEach((si, pos) => {
      const r = el("div", "it");
      r.appendChild(el("span", "pos", pos + 1));
      r.appendChild(el("span", "txt", esc(q.steps[si])));
      if (!done) {
        const mv = el("div", "mv");
        const u = el("button", null, "↑"), d = el("button", null, "↓");
        u.onclick = () => { if (pos > 0) { [cur[pos - 1], cur[pos]] = [cur[pos], cur[pos - 1]]; draw(); } };
        d.onclick = () => { if (pos < cur.length - 1) { [cur[pos + 1], cur[pos]] = [cur[pos], cur[pos + 1]]; draw(); } };
        mv.append(u, d); r.appendChild(mv);
      } else r.classList.add(cur[pos] === pos ? "right" : "wrong");
      wrap.appendChild(r);
    });
  }
  draw();
  confRow(box, conf => {
    if (done) return; done = 1;
    const ok = cur.every((s, i) => s === i);
    draw();
    if (!ok) {
      const c = el("div", "expl"); c.appendChild(el("p", null, "<b>Richtige Reihenfolge:</b> " + q.steps.map((s, i) => (i + 1) + ". " + esc(s)).join(" — ")));
      box.insertBefore(c, box.firstChild);
    }
    finish(box, q, ok, conf, ok ? null : "verfahren");
  });
}

/* --- match --- */
function rMatch(box, q) {
  let done = 0;
  const rights = shuffle([...new Set(q.pairs.map(p => p[1]))]);
  const wrap = el("div", "mt"); const sels = [];
  q.pairs.forEach(p => {
    const row = el("div", "pair");
    row.appendChild(el("div", "l", esc(p[0])));
    const s = el("select");
    s.appendChild(el("option", null, "— zuordnen —"));
    rights.forEach(r => { const o = el("option", null, esc(r)); o.value = r; s.appendChild(o); });
    row.appendChild(s); sels.push([s, p[1], row]); wrap.appendChild(row);
  });
  box.appendChild(wrap);
  confRow(box, conf => {
    if (done) return; done = 1;
    let ok = 1;
    sels.forEach(([s, right, row]) => {
      const good = s.value === right;
      if (!good) ok = 0;
      row.classList.add(good ? "right" : "wrong");
      s.disabled = 1;
      if (!good) row.appendChild(el("div", "why", "richtig: " + esc(right)));
    });
    finish(box, q, !!ok, conf, ok ? null : "modell");
  });
}

/* --- speak --- */
function rSpeak(box, q) {
  let done = 0, t = 0, iv = null;
  const p = el("div", "panel");
  const tm = el("div", "timer", "0:00");
  p.appendChild(tm);
  const row = el("div", "btnrow");
  const st = el("button", "btn", "Sprechen starten");
  st.onclick = () => {
    if (iv) { clearInterval(iv); iv = null; st.textContent = "Weiter sprechen"; return; }
    iv = setInterval(() => { t++; tm.textContent = Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); tm.classList.toggle("over", t > 100); }, 1000);
    st.textContent = "Pause";
  };
  row.appendChild(st);
  p.appendChild(row);
  p.appendChild(el("p", "lead", "Sprich laut. Erst danach nach unten schauen — wer die Musskriterien vorher liest, prüft sich nicht, sondern liest ab."));
  box.appendChild(p);

  const ta = el("textarea"); ta.rows = 4; ta.placeholder = "Optional: Stichworte deiner Antwort, um sie mit der Musterlösung zu vergleichen.";
  box.appendChild(ta);

  const rev = el("button", "btn"); rev.textContent = "Ich bin fertig — Abgleich zeigen";
  rev.style.marginTop = "14px";
  box.appendChild(rev);
  rev.onclick = () => {
    if (done) return; done = 1; if (iv) clearInterval(iv);
    rev.remove();
    const ul = el("ul", "musts");
    const cbs = [];
    q.musts.forEach(m => {
      const li = el("li"); const lb = el("label");
      const cb = el("input"); cb.type = "checkbox"; cbs.push(cb);
      lb.appendChild(cb); lb.appendChild(el("span", null, esc(m)));
      li.appendChild(lb); ul.appendChild(li);
    });
    box.appendChild(el("h3", null, "Was hätte drin sein müssen"));
    box.appendChild(ul);
    const md = el("div", "expl"); md.appendChild(el("p", null, "<b>Musterlinie.</b> " + esc(q.model)));
    box.appendChild(md);
    const done2 = el("button", "btn", "Bewertung übernehmen");
    done2.onclick = () => {
      const hit = cbs.filter(c => c.checked).length, ratio = hit / cbs.length;
      done2.remove();
      const ok = ratio >= .7;
      (q.crit || []).forEach(c => { S.crit[c] = S.crit[c] || []; S.crit[c].push(ratio); if (S.crit[c].length > 20) S.crit[c].shift(); });
      const vd = el("div", "verdict " + (ok ? "ok" : "no"));
      vd.innerHTML = (ok ? "Trägt." : "Noch nicht tragfähig.") + "<small>" + hit + " von " + cbs.length + " Musskriterien getroffen. Sprechzeit " + Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0") + ".</small>";
      box.insertBefore(vd, box.firstChild);
      finish(box, q, ok, "unsicher", null, 1);
    };
    box.appendChild(done2);
  };
}

/* --- Auflösung --- */
function finish(box, q, ok, conf, errKind, quiet) {
  record(q, ok, conf, errKind);
  SES.res.push({ id: q.id, ok: ok, conf: conf });
  box.querySelectorAll(".confrow").forEach(n => n.remove());

  if (!quiet) {
    const alarm = !ok && conf === "sicher";
    const vd = el("div", "verdict " + (ok ? "ok" : alarm ? "alarm" : "no"));
    vd.innerHTML = ok ? (conf === "sicher" ? "Richtig und sicher." : "Richtig — aber du warst unsicher.<small>Kommt bald wieder.</small>")
      : alarm ? "Falsch — und du warst sicher.<small>Das ist die teuerste Kategorie. Diese Frage bekommt Vorrang bis zur Prüfung.</small>"
        : "Nicht richtig.";
    box.insertBefore(vd, box.firstChild);
  }
  if (q.ans) {
    const e = el("div", "expl");
    e.appendChild(el("p", null, "<b>Warum das die richtige Antwort ist.</b> " + esc(q.ans)));
    box.appendChild(e);
  }
  if (q.say) box.appendChild(el("div", "say", "<div class='lbl'>So sagst du es in der Prüfung</div><div class='txt'>" + esc(q.say) + "</div>"));
  if (q.trap) {
    const d = el("details", "trap");
    d.innerHTML = "<summary>Nachfrage, die hier wirklich käme</summary><div class='body'><q>" + esc(q.trap.q) + "</q>" + esc(q.trap.a) + "</div>";
    box.appendChild(d);
  }
  const rel = S.notes.filter(n => n.b === q.b || n.hf.some(h => q.hf.includes(h)));
  if (rel.length) {
    const n = rel[0];
    box.appendChild(el("div", "linknote", "<div class='l'>Dein eigenes Beispiel passt hier</div>" + esc(n.title) + " — " + esc(n.d)));
  }
  box.appendChild(el("div", "srcline", "<span class='tag " + q.src + "'>" + q.src + "</span> " + esc(SRCN[q.src]) + " · " + esc(q.ref) +
    " · Handlungsfeld " + q.hf.map(h => esc(HFN[h] || h)).join(", ")));

  const r = el("div", "btnrow");
  const b = el("button", "btn", SES.i + 1 >= SES.ids.length ? "Einheit abschließen" : "Weiter");
  b.onclick = next; r.appendChild(b);
  const b2 = el("button", "btn ghost", "Abbrechen");
  b2.onclick = () => go("heute"); r.appendChild(b2);
  box.appendChild(r);
  box._next = next;
  function next() { SES.i++; render(); window.scrollTo(0, 0); }
}

function keys(box, wrap, pick) {
  document.onkeydown = e => {
    if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= wrap.children.length) { pick(n - 1); e.preventDefault(); }
    else if (e.key === "s" && box._check) box._check("sicher");
    else if (e.key === "u" && box._check) box._check("unsicher");
    else if ((e.key === "Enter" || e.key === "ArrowRight") && box._next) box._next();
  };
}

/* ---------- Auswertung ---------- */
function viewSummary(v) {
  document.onkeydown = null;
  const n = SES.res.length, ok = SES.res.filter(r => r.ok).length;
  const sf = SES.res.filter(r => !r.ok && r.conf === "sicher").length;
  v.appendChild(el("h2", "view", "Einheit abgeschlossen"));
  v.appendChild(el("p", "lead", esc(SES.title) + " · " + Math.round((Date.now() - SES.t0) / 60000) + " Minuten"));
  const p = el("div", "panel");
  const t = el("table", "data");
  t.innerHTML = "<tr><td>Richtig</td><td class='num'>" + ok + " von " + n + "</td></tr>" +
    "<tr><td>Sicher und falsch</td><td class='num'>" + sf + "</td></tr>";
  p.appendChild(t);
  if (sf) p.appendChild(el("p", "lead", "Die " + sf + " Fragen, bei denen du sicher warst und danebenlagst, stehen ab jetzt im Fehlerkorb ganz oben."));
  v.appendChild(p);

  if (SES.title === "Prüfungssimulation") {
    const c = el("div", "panel");
    c.appendChild(el("h3", null, "Selbsteinschätzung nach § 33 (4)"));
    c.appendChild(el("p", "lead", "Diese Werte stammen aus deinen Sprechkarten-Abgleichen. Sie sind eine Selbstauskunft, keine Note."));
    c.appendChild(critTable());
    v.appendChild(c);
  }

  const wrong = SES.res.filter(r => !r.ok);
  if (wrong.length) {
    const w = el("div", "panel");
    w.appendChild(el("h3", null, "Zum Nacharbeiten"));
    wrong.forEach(r => {
      const q = byId[r.id];
      w.appendChild(el("div", "note", "<h4>" + esc(q.q) + "</h4><div class='m'>" + esc(BLOCKS[q.b].n) + " · " + esc(q.ref) + "</div>" +
        (q.say ? "<div class='say'><div class='lbl'>So sagst du es</div><div class='txt'>" + esc(q.say) + "</div></div>" : "")));
    });
    v.appendChild(w);
  }
  const r = el("div", "btnrow");
  const b1 = el("button", "btn", "Zurück zu Heute"); b1.onclick = () => go("heute");
  const b2 = el("button", "btn ghost", "Ein Erlebnis festhalten"); b2.onclick = () => go("erlebnis");
  r.append(b1, b2); v.appendChild(r);
  SES = null;
}

function critTable() {
  const t = el("table", "data");
  Object.keys(CRIT).forEach(k => {
    const a = S.crit[k] || [];
    const m = a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
    const tr = el("tr");
    tr.appendChild(el("td", null, esc(CRIT[k])));
    const td = el("td");
    if (!a.length) td.appendChild(el("span", null, "noch keine Daten"));
    else { const mm = el("div", "meter"); mm.appendChild(el("i", m >= .7 ? "g" : m >= .4 ? "o" : "r", "")).style.width = Math.round(m * 100) + "%"; td.appendChild(mm); }
    tr.appendChild(td); t.appendChild(tr);
  });
  return t;
}

/* ---------- Erlebnisspeicher ---------- */
function viewErlebnis(v) {
  v.appendChild(el("h2", "view", "Erlebnisspeicher"));
  v.appendChild(el("p", "lead", "Eigene Beispiele fallen dir am Prüfungstag nicht ein — die sammelst du über Wochen. Struktur: Situation, Analyse mit Theorie, Entscheidung, Wirkung, Konsequenz."));

  const cov = el("div", "panel");
  cov.appendChild(el("h3", null, "Abdeckung nach Handlungsfeld"));
  const ct = el("table", "data");
  ["U", "E", "L", "B", "S", "V"].forEach(h => {
    const n = S.notes.filter(x => x.hf.includes(h)).length;
    ct.innerHTML += "<tr><td>" + h + " · " + esc(HFN[h]) + "</td><td class='num'>" + (n ? n + " Beispiel" + (n > 1 ? "e" : "") : "<span style='color:var(--red)'>keines</span>") + "</td></tr>";
  });
  cov.appendChild(ct);
  cov.appendChild(el("p", "lead", "Ein Handlungsfeld ohne eigenes Beispiel ist eine Lücke, die dir sonst erst in der Prüfung auffällt."));
  v.appendChild(cov);

  const f = el("div", "panel");
  f.appendChild(el("h3", null, "Neues Erlebnis festhalten"));
  const ti = el("input"); ti.type = "text"; ti.placeholder = "Kurzer Titel, z. B. Konflikt in der 8b vor den Herbstferien"; ti.style.width = "100%";
  f.appendChild(ti);
  const hfrow = el("div", "filters"); const hfsel = new Set();
  ["U", "E", "L", "B", "S", "V"].forEach(h => {
    const c = el("button", "chip", h + " · " + esc(HFN[h]));
    c.setAttribute("aria-pressed", "false");
    c.onclick = () => { hfsel.has(h) ? hfsel.delete(h) : hfsel.add(h); c.setAttribute("aria-pressed", hfsel.has(h) ? "true" : "false"); };
    hfrow.appendChild(c);
  });
  f.appendChild(hfrow);
  const fields = [["sit", "Situation"], ["ana", "Analyse mit Theorie"], ["ent", "Entscheidung"], ["wir", "Wirkung"], ["kon", "Konsequenz"]];
  const tas = {};
  fields.forEach(([k, l]) => {
    f.appendChild(el("div", "m", "<div style='font-size:11px;color:var(--faint);font-weight:600;margin:12px 0 4px'>" + l + "</div>"));
    const t = el("textarea"); t.rows = 2; tas[k] = t; f.appendChild(t);
  });
  const sb = el("button", "btn", "Speichern"); sb.style.marginTop = "14px";
  sb.onclick = () => {
    if (!ti.value.trim()) { toast("Titel fehlt."); return; }
    S.notes.unshift({ id: Date.now(), title: ti.value.trim(), d: today(), b: null, hf: [...hfsel], sit: tas.sit.value, ana: tas.ana.value, ent: tas.ent.value, wir: tas.wir.value, kon: tas.kon.value });
    save(); render(); toast("Festgehalten.");
  };
  f.appendChild(sb); v.appendChild(f);

  S.notes.forEach(n => {
    const c = el("div", "note");
    c.appendChild(el("h4", null, esc(n.title)));
    c.appendChild(el("div", "m", esc(n.d) + (n.hf.length ? " · Handlungsfeld " + n.hf.join(", ") : "")));
    const dl = el("dl");
    fields.forEach(([k, l]) => { if (n[k]) dl.innerHTML += "<dt>" + l + "</dt><dd>" + esc(n[k]) + "</dd>"; });
    c.appendChild(dl);
    const del = el("button", "btn ghost", "Löschen"); del.style.marginTop = "10px";
    del.onclick = () => { S.notes = S.notes.filter(x => x.id !== n.id); save(); render(); };
    c.appendChild(del);
    v.appendChild(c);
  });
}

/* ---------- Dashboard ---------- */
function viewDash(v) {
  v.className = "wrap wide";
  v.appendChild(el("h2", "view", "Übersicht"));
  v.appendChild(el("p", "lead", "Nicht wie viel Prozent, sondern was du tun solltest."));

  const hfp = el("div", "panel");
  hfp.appendChild(el("h3", null, "Reifegrad nach Handlungsfeld"));
  hfp.appendChild(el("p", "lead", "Die Kommission denkt in Handlungsfeldern, nicht in Themenblöcken."));
  const t = el("table", "data");
  t.innerHTML = "<tr><th>Handlungsfeld</th><th>Bearbeitet</th><th>Reife</th><th>Status</th></tr>";
  ["U", "E", "L", "B", "S", "V", "P"].forEach(h => {
    const qs = pool().filter(q => q.hf.includes(h)); if (!qs.length) return;
    const s = qs.filter(q => it(q.id));
    const m = qs.length ? s.reduce((a, q) => a + Math.min(it(q.id).box / 4, 1), 0) / qs.length : 0;
    const cov = s.length / qs.length;
    const st = !s.length ? ["kalt", "r"] : (m >= .6 && cov >= .6) ? ["reif", "g"] : ["wackelig", "o"];
    const tr = el("tr");
    tr.appendChild(el("td", null, h + " · " + esc(HFN[h])));
    tr.appendChild(el("td", "num", s.length + "/" + qs.length));
    const td = el("td"); const mm = el("div", "meter");
    mm.appendChild(el("i", st[1], "")).style.width = Math.round(m * 100) + "%";
    td.appendChild(mm); tr.appendChild(td);
    tr.appendChild(el("td", null, st[0]));
    t.appendChild(tr);
  });
  hfp.appendChild(t); v.appendChild(hfp);

  const two = el("div", "rowsplit");

  const ep = el("div", "panel");
  ep.appendChild(el("h3", null, "Häufigste Fehlerarten"));
  const ks = Object.keys(S.errs).sort((a, b) => S.errs[b] - S.errs[a]);
  if (!ks.length) ep.appendChild(el("p", "lead", "Noch keine Fehler erfasst."));
  else {
    const max = S.errs[ks[0]];
    const et = el("table", "data");
    ks.forEach(k => {
      const tr = el("tr");
      tr.appendChild(el("td", null, esc(ERRN[k] || k)));
      const td = el("td"); const mm = el("div", "meter");
      mm.appendChild(el("i", "r", "")).style.width = Math.round(S.errs[k] / max * 100) + "%";
      td.appendChild(mm); tr.appendChild(td);
      tr.appendChild(el("td", "num", S.errs[k])); et.appendChild(tr);
    });
    ep.appendChild(et);
    ep.appendChild(el("p", "lead", "Deine häufigste Fehlerart ist <b>" + esc(ERRN[ks[0]]) + "</b>. Eine Prozentzahl sagt dir nicht, was zu tun ist — das hier schon."));
  }
  two.appendChild(ep);

  const zp = el("div", "panel");
  zp.appendChild(el("h3", null, "Zitierfähigkeit des Gelernten"));
  zp.appendChild(el("p", "lead", "Wie viel von dem, was sitzt, kannst du in der Prüfung belastbar zitieren?"));
  const mast = Q.filter(q => it(q.id) && it(q.id).box >= 3);
  const zt = el("table", "data");
  Object.keys(SRCN).forEach(k => {
    const n = mast.filter(q => q.src === k).length;
    zt.innerHTML += "<tr><td>" + k + " · " + esc(SRCN[k]) + "</td><td class='num'>" + n + "</td></tr>";
  });
  zp.appendChild(zt);
  const erg = mast.filter(q => q.src === "ERG").length;
  if (erg) zp.appendChild(el("p", "lead", erg + " gemeisterte Inhalte stammen nicht aus deinen Unterlagen. Die kannst du sagen, aber nicht als Seminarwissen ausgeben."));
  two.appendChild(zp);
  v.appendChild(two);

  const cp = el("div", "panel");
  cp.appendChild(el("h3", null, "Kriterien nach § 33 (4)"));
  cp.appendChild(el("p", "lead", "Aus deinen Sprechkarten-Selbstbewertungen. Selbstauskunft, keine Prognose."));
  cp.appendChild(critTable());
  v.appendChild(cp);

  const rp = el("div", "panel");
  rp.appendChild(el("h3", null, "Prüfungsreife"));
  const p2 = pool(), seen = p2.filter(q => it(q.id));
  const mastery = p2.length ? seen.reduce((a, q) => a + Math.min(it(q.id).box / 4, 1), 0) / p2.length : 0;
  const hfCold = ["U", "E", "L", "B", "S"].filter(h => !pool().filter(q => q.hf.includes(h)).some(q => it(q.id))).length;
  const noteCov = ["U", "E", "L", "B", "S"].filter(h => S.notes.some(n => n.hf.includes(h))).length / 5;
  const score = Math.round((mastery * .6 + noteCov * .2 + (1 - hfCold / 5) * .2) * 100);
  const mm = el("div", "meter"); mm.appendChild(el("i", score >= 70 ? "g" : score >= 40 ? "o" : "r", "")).style.width = score + "%";
  rp.appendChild(mm);
  rp.appendChild(el("p", "lead", "<b>" + score + " von 100.</b> Rechenweg offengelegt: 60 % Reife über alle Fragen im Filter, 20 % Abdeckung der Handlungsfelder mit eigenen Beispielen, 20 % kein kaltes Handlungsfeld. Der Wert sagt, wo du stehst — er sagt nichts über deine Note voraus."));
  v.appendChild(rp);
}

/* ---------- Einstellungen ---------- */
function viewEinst(v) {
  v.appendChild(el("h2", "view", "Einstellungen"));
  const p = el("div", "panel");
  p.appendChild(el("h3", null, "Prüfungstermin"));
  const inp = el("input"); inp.type = "date"; inp.value = S.exam || "";
  inp.onchange = () => { S.exam = inp.value || null; save(); rail(); };
  p.appendChild(inp);
  p.appendChild(el("p", "lead", "Aktuelle Phase: <b>" + esc(phase().n) + "</b> — " + esc(phase().d) + " Wiederholungsabstände: " + intervals().join(", ") + " Tage."));
  v.appendChild(p);

  const q = el("div", "panel");
  q.appendChild(el("h3", null, "Quellenfilter"));
  q.appendChild(el("p", "lead", "In der letzten Woche vor der Prüfung solltest du <b>ERG</b> abschalten. Dann bleibt nur, was du belastbar zitieren kannst."));
  q.appendChild(srcFilterUI());
  v.appendChild(q);

  const sy = el("div", "panel");
  sy.appendChild(el("h3", null, "Gerätewechsel"));
  const hasFb = !!(window.__fb && window.__fb.db);
  sy.appendChild(el("p", "lead", hasFb
    ? (FB_ACTIVE ? "<b>Cloud-Synchronisation aktiv.</b> Dein Stand wird automatisch mit diesem Code verknüpft und läuft im Hintergrund mit."
                 : "Cloud-Synchronisation ist eingerichtet, aber noch nicht bestätigt — meist braucht der erste Abgleich einen Moment oder eine Internetverbindung.")
    : "Keine Cloud-Synchronisation eingerichtet — dein Stand bleibt nur auf diesem Gerät. Exportiere regelmäßig als Datei."));
  const cc = el("div", "say");
  cc.appendChild(el("div", "lbl", "Dein Code"));
  const ct = el("div", "txt", esc(getCode())); ct.style.fontSize = "20px"; ct.style.letterSpacing = ".04em";
  cc.appendChild(ct);
  const cb = el("button", "btn ghost", "Kopieren"); cb.style.marginTop = "10px";
  cb.onclick = () => { navigator.clipboard?.writeText(getCode()).then(() => toast("Code kopiert.")); };
  cc.appendChild(cb);
  sy.appendChild(cc);

  if (hasFb) {
    sy.appendChild(el("h3", null, "Stand von einem anderen Gerät laden"));
    sy.appendChild(el("p", "lead", "Code von deinem anderen Gerät eingeben. <b>Achtung:</b> Das überschreibt den Stand hier."));
    const row = el("div", "btnrow");
    const inp = el("input"); inp.type = "text"; inp.placeholder = "XXXX-XXXX-XXXX-XXXX"; inp.style.flex = "1 1 220px";
    const gb = el("button", "btn", "Übernehmen");
    gb.onclick = async () => {
      const code = inp.value.trim().toUpperCase();
      if (!code) { toast("Bitte Code eingeben."); return; }
      if (!confirm("Der aktuelle Stand auf diesem Gerät wird ersetzt. Fortfahren?")) return;
      const remote = await fbGet(code);
      if (!remote) { toast("Unter diesem Code liegt nichts vor."); return; }
      setCode(code); S = Object.assign(fresh(), remote); save(); go("heute");
      toast("Stand übernommen.");
    };
    row.append(inp, gb); sy.appendChild(row);
  }
  v.appendChild(sy);

  const d = el("div", "panel");
  d.appendChild(el("h3", null, "Daten"));
  d.appendChild(el("p", "lead", "Zusätzlich zur Cloud kannst du den Stand jederzeit als Datei sichern."));
  const r = el("div", "btnrow");
  const b1 = el("button", "btn", "Exportieren"); b1.onclick = doExport;
  const b2 = el("button", "btn ghost", "Importieren"); b2.onclick = doImport;
  const b3 = el("button", "btn ghost", "Alles zurücksetzen");
  b3.onclick = () => { if (confirm("Wirklich alles löschen? Fortschritt und Erlebnisspeicher sind danach weg.")) { S = fresh(); save(); go("heute"); } };
  r.append(b1, b2, b3); d.appendChild(r); v.appendChild(d);

  const i = el("div", "panel");
  i.appendChild(el("h3", null, "Bedienung"));
  i.appendChild(el("p", "lead", "Tasten 1 bis 6 wählen eine Antwort, <b>s</b> prüft als sicher, <b>u</b> als unsicher, Enter geht weiter. Der Fragenpool steht als JSON im Quelltext dieser Datei — du kannst Fragen selbst ergänzen oder korrigieren."));
  i.appendChild(el("p", "lead", "Fragen im Pool: " + Q.length + ". Blöcke: " + Object.keys(BLOCKS).length + "."));
  v.appendChild(i);
}

function doExport() {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "kolloquium-fortschritt-" + today() + ".json";
  a.click(); toast("Datei erzeugt.");
}
function doImport() {
  const i = document.createElement("input"); i.type = "file"; i.accept = ".json";
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || typeof d !== "object" || !d.items) throw 0;
        S = Object.assign(fresh(), d); save(); go("heute"); toast("Fortschritt wiederhergestellt.");
      } catch (e) { toast("Datei nicht lesbar. Nichts geändert."); }
    };
    r.readAsText(f);
  };
  i.click();
}

/* ---------- Fehleranzeige statt stiller Absturz ---------- */
function showCrash(err) {
  try {
    const v = $("#view");
    if (v) v.innerHTML =
      "<div class='panel' style='border-color:var(--red)'>" +
      "<h3 style='color:var(--red)'>Etwas ist schiefgelaufen</h3>" +
      "<p class='lead'>Bitte davon einen Screenshot machen und weitergeben:</p>" +
      "<pre style='white-space:pre-wrap;font-size:12px;color:var(--muted);background:var(--sunk);padding:10px;border-radius:4px'>" +
      esc(String((err && err.message) || err)) +
      (err && err.stack ? "\n\n" + esc(String(err.stack)) : "") +
      "</pre></div>";
  } catch (e2) { document.body.insertAdjacentHTML("beforeend", "<p style='color:red'>Fehler: " + String(err) + "</p>"); }
}
window.addEventListener("error", e => showCrash(e.error || e.message));
window.addEventListener("unhandledrejection", e => showCrash(e.reason));

/* ---------- Start ---------- */
(async function () {
  try {
    $("#view").innerHTML = "<p class='lead' style='margin-top:40px'>Lädt …</p>";
    S = (await load()) || fresh();
    S = Object.assign(fresh(), S);
    document.documentElement.dataset.theme = S.theme || "light";
    render();
  } catch (err) { showCrash(err); }
})();

</script>
