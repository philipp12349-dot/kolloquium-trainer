{id:"st14",b:"st",hf:["E"],src:"ERG",t:"case",
 q:"Eine Schülerin unterläuft deinen Unterricht seit Wochen mit ironischen Zwischenrufen. Du hast bereits mehrfach ermahnt. Was ist der nächste fachlich richtige Schritt?",
 stem:"Fallfrage.",
 o:[
  {t:"Ein erzieherisches Gespräch außerhalb des Unterrichts führen und dabei nach Motiven und Ausnahmen suchen.",ok:1},
  {t:"Sie für den Rest der Woche vom Unterricht ausschließen.",why:"Der vorübergehende Ausschluss vom Unterricht ist eine Ordnungsmaßnahme nach § 53 (3) Nr. 3 und setzt voraus, dass erzieherische Einwirkungen nicht ausreichen. Mehrfaches Ermahnen schöpft das Repertoire nicht aus.",e:"recht"},
  {t:"Die Klasse gemeinsam für die Störungen zur Verantwortung ziehen.",why:"Unzulässig. Nach § 53 (1) sind Einwirkungen gegen mehrere nur zulässig, wenn das Fehlverhalten jeder oder jedem Einzelnen zuzurechnen ist.",e:"recht"},
  {t:"Sie im Unterricht direkt und deutlich konfrontieren, um Autorität zu zeigen.",why:"Genau der Machtkampf, den Lohmann und Becker zu vermeiden empfehlen — und öffentlich vor der Gruppe verschärft er sich.",e:"verfahren"}],
 ans:"Das erzieherische Gespräch ist die erste ausdrücklich genannte erzieherische Einwirkung nach § 53 (2) und zugleich der Ort, an dem Motivzuschreibung und Ausnahmensuche funktionieren. Ironie ist häufig ein Statusinstrument — öffentliche Konfrontation liefert genau die Bühne, die sie sucht.",
 ref:"§ 53 (1) und (2) SchulG NRW; Lohmann 2011; Becker 2006",
 say:"Ich würde das Gespräch außerhalb des Unterrichts suchen. Öffentlich zu konfrontieren liefert die Bühne, und rechtlich muss ich erzieherische Einwirkungen ohnehin ausschöpfen, bevor Ordnungsmaßnahmen zulässig sind.",
 trap:{q:"Und wenn das Gespräch nichts bringt?",a:"Dann Eltern einbeziehen, Absprachen mit dem Team, schriftliche Missbilligung — und erst wenn das erkennbar nicht reicht, der Bericht an die Schulleitung."}},

{id:"st15",b:"st",hf:["E"],src:"KS",t:"single",
 q:"Was bedeutet „Symptomverschreibung“?",
 o:[
  {t:"das störende Verhalten paradox einzufordern, um seine Wirkung zu entziehen.",ok:1},
  {t:"das Verhalten schriftlich zu dokumentieren.",why:"Dokumentation ist kein Element dieser Strategie.",e:"begriff"},
  {t:"die Ursache des Verhaltens zu diagnostizieren.",why:"Diagnose ist etwas anderes als die paradoxe Intervention.",e:"begriff"},
  {t:"das Verhalten zu benennen, ohne zu bewerten.",why:"Das ist beschreiben statt kommentieren.",e:"begriff"}],
 ans:"Die Symptomverschreibung ist eine paradoxe Intervention aus der systemischen Praxis: Wird das Verhalten eingefordert, verliert es seine oppositionelle Funktion. Sie ist heikel und sollte sparsam und ohne Zynismus eingesetzt werden.",
 ref:"Lohmann 2011",
 say:"Symptomverschreibung ist eine paradoxe Intervention: Ich fordere das Verhalten ein und entziehe ihm damit seine oppositionelle Funktion. Ich setze das sehr sparsam ein, weil es leicht zynisch wirkt.",
 trap:{q:"Sie klingen skeptisch.",a:"Bin ich. Die Grenze zwischen paradoxer Intervention und Bloßstellung ist schmal, und die Klasse entscheidet, auf welcher Seite ich gelandet bin."}},

{id:"st16",b:"st",hf:["E"],src:"ERG",t:"single",
 q:"Wo liegt die Grenze lösungsorientierter Strategien im Umgang mit Störungen?",
 o:[
  {t:"Sie setzen voraus, dass die Beziehung tragfähig und die Situation nicht sicherheitsrelevant ist; bei Gewalt oder Gefährdung gelten andere Wege.",ok:1},
  {t:"Sie sind nur in der Sekundarstufe I anwendbar.",why:"Keine Altersgrenze; die Formen ändern sich, das Prinzip nicht.",e:"begriff"},
  {t:"Sie sind mit dem Schulgesetz nicht vereinbar.",why:"Im Gegenteil: § 53 (1) verlangt Verhältnismäßigkeit, und § 53 (2) nennt das erzieherische Gespräch an erster Stelle.",e:"recht"},
  {t:"Sie widersprechen dem präventiven Classroom Management.",why:"Sie ergänzen es — Prävention und Intervention greifen ineinander.",e:"modell"}],
 ans:"Der ehrliche Einwand: Reframing und Motivzuschreibung brauchen Zeit und eine Beziehung. Bei akuter Gefährdung, Gewalt oder Kindeswohlgefährdung greifen andere Verfahren — bis hin zu § 42 (6) SchulG mit der Pflicht, jedem Anschein von Vernachlässigung oder Misshandlung nachzugehen.",
 ref:"Ergänzt; § 42 (6), § 53 SchulG NRW",
 say:"Die Grenze der lösungsorientierten Strategien liegt dort, wo Sicherheit betroffen ist. Sie brauchen Zeit und eine tragfähige Beziehung — bei Gefährdung greifen andere Wege, bis hin zur Pflicht nach § 42 Absatz 6, jedem Anschein von Vernachlässigung nachzugehen.",
 trap:{q:"Wo verläuft die Grenze genau?",a:"Ehrlich sein: Sie ist nicht scharf. Mein Kriterium ist, ob jemand zu Schaden kommen kann, wenn ich weiter pädagogisch arbeite."}},

{id:"st17",b:"st",hf:["E"],src:"KS",t:"multi",
 q:"Welche der folgenden Maßnahmen sind pädagogische Maßnahmen und noch keine Ordnungsmaßnahmen?",
 stem:"Mehrfachauswahl.",
 o:[
  {t:"Nacharbeiten",ok:1},
  {t:"Entschuldigen",ok:1},
  {t:"Aufräumen des Klassenzimmers",ok:1},
  {t:"Rote und gelbe Karte",ok:1},
  {t:"Auszeit im Trainingsraum",ok:1},
  {t:"Schriftlicher Verweis",why:"Der schriftliche Verweis ist keine pädagogische Maßnahme, sondern die erste Ordnungsmaßnahme nach § 53 (3) Nr. 1. Diese Verwechslung ist im Kolloquium teuer.",e:"recht"}],
 ans:"Beckers pädagogische Maßnahmen: Nacharbeiten, Entschuldigen, Aufräumen, rote und gelbe Karte, Auszeit im Trainingsraum. Der schriftliche Verweis gehört auf die andere Seite der Grenze — er ist Ordnungsmaßnahme.",
 ref:"Becker 2006; § 53 (2) und (3) SchulG NRW",
 say:"Beckers pädagogische Maßnahmen sind Nacharbeiten, Entschuldigen, Aufräumen, Kartensysteme und die Auszeit. Der schriftliche Verweis wäre schon eine Ordnungsmaßnahme nach § 53 Absatz 3.",
 trap:{q:"Ist die Nacharbeit nicht auch schon eine Ordnungsmaßnahme?",a:"Nein. § 53 Absatz 2 nennt die Nacharbeit unter Aufsicht ausdrücklich als erzieherische Einwirkung — allerdings nur nach vorheriger Benachrichtigung der Eltern."}},

{id:"st18",b:"st",hf:["E"],src:"ERG",t:"single",
 q:"Warum ist die Reihenfolge „erst Analyse, dann Intervention“ im Kolloquium so wichtig?",
 o:[
  {t:"Weil das Kriterium Komplexität der Problemdarstellung ausdrücklich theoriegeleitete Analyse und begründete Schwerpunktsetzung verlangt.",ok:1},
  {t:"Weil Interventionen ohne Analyse rechtswidrig sind.",why:"Rechtlich zählt die Verhältnismäßigkeit, nicht die vorherige Analyse. Der Grund ist prüfungsbezogen und pädagogisch.",e:"recht"},
  {t:"Weil die Prüfungskommission Theorie stärker gewichtet als Praxis.",why:"Gefordert ist die Verbindung, nicht die Bevorzugung der Theorie.",e:"verfahren"},
  {t:"Weil Interventionen ohne Analyse immer scheitern.",why:"Zu absolut; erfahrungsgeleitetes Handeln kann funktionieren. Im Kolloquium musst du es aber begründen können.",e:"verfahren"}],
 ans:"§ 33 (4) fragt unter Komplexität ausdrücklich: Analysiert der Prüfling theoriegeleitet? Setzt er begründet Schwerpunkte? Leitet er tragfähige Konsequenzen ab? Wer mit der Maßnahme beginnt, überspringt genau den bewerteten Teil.",
 ref:"OVP § 33 (4)",
 say:"Ich beginne bei Störungsfällen mit der Analyse, weil das Bewertungskriterium Komplexität ausdrücklich theoriegeleitete Analyse und begründete Schwerpunkte verlangt — die Maßnahme ist der letzte Schritt, nicht der erste.",
 trap:{q:"Im Unterricht haben Sie diese Zeit nicht.",a:"Richtig. Im Moment handle ich schnell und klein. Die Analyse folgt danach — und verändert, was beim nächsten Mal schnell verfügbar ist."}},

{id:"st19",b:"st",hf:["E"],src:"KS",t:"order",
 q:"Bringe die Deeskalationslogik bei einer wiederkehrenden Störung in eine sinnvolle Reihenfolge.",
 steps:[
  "Nonverbales Signal, Blickkontakt, Nähe herstellen",
  "Kurze direkte Ansprache mit Beschreibung des Verhaltens",
  "Erzieherisches Gespräch außerhalb des Unterrichts",
  "Einbezug der Eltern, schriftliche Information",
  "Bericht an die Schulleitung mit Begründung der Notwendigkeit",
  "Ordnungsmaßnahme nach § 53 (3)"],
 ans:"Von der leisesten zur eingriffsintensivsten Maßnahme. Die Verhältnismäßigkeit nach § 53 (1) verlangt genau diese Richtung: Ordnungsmaßnahmen sind nur zulässig, wenn erzieherische Einwirkungen nicht ausreichen.",
 ref:"§ 53 (1)–(3) SchulG NRW; Nolting 2013; Becker 2006",
 say:"Die Logik geht immer vom leisesten zum stärksten Mittel: nonverbales Signal, kurze Ansprache, Gespräch außerhalb, Eltern, Bericht an die Schulleitung, erst dann Ordnungsmaßnahme.",
 trap:{q:"Müssen Sie jede Stufe durchlaufen?",a:"Nicht schematisch — bei schwerem Fehlverhalten kann sofort eine Ordnungsmaßnahme in Betracht kommen. Aber ich muss begründen können, warum mildere Mittel nicht ausreichen."}},

{id:"st20",b:"st",hf:["E","U"],src:"KS",t:"speak",
 q:"Eine Kollegin sagt: „In meiner Klasse stören sie ständig, aber bei Ihnen läuft es. Was machen Sie anders?“ Antworte theoriegeleitet.",
 stem:"90 Sekunden. Perspektivwechsel gehört zu Kriterium 5.",
 musts:[
  "Ich habe nicht behauptet, dass es an ihr liegt.",
  "Ich habe mindestens eine Definition von Störung mit Autor genannt.",
  "Ich habe eine Erklärung für die Entstehung angeboten (Bräutigam, Volkamer/Zimmer oder Heckhausen).",
  "Ich habe konkrete präventive Maßnahmen genannt statt nur Interventionen.",
  "Ich habe die Grenzen meines eigenen Wissens markiert.",
  "Ich bin kollegial geblieben und habe nicht doziert."],
 model:"Der Fehler wäre, mit Rezepten zu antworten. Stärker: erst die gemeinsame Beobachtung klären — wann genau, in welcher Phase, bei wem. Dann eine Deutung anbieten (Volkamer und Zimmer zur Beschäftigungslücke, Bräutigam zur Entwicklungsfunktion). Dann eine konkrete präventive Maßnahme, die zu ihrer Beobachtung passt. Und die Ehrlichkeit, dass Lerngruppen unterschiedlich sind und du ihre nicht kennst. Für Kriterium 5 zählt hier vor allem, dass du kollegial und nicht belehrend klingst.",
 crit:["komm","eigen","sach"],
 ref:"Lohmann 2003; Bräutigam 2003; Volkamer & Zimmer 1982; Nolting 2013",
 trap:{q:"Sie weichen aus. Was machen Sie nun konkret anders?",a:"Dann konkret werden — eine Sache nennen, die du wirklich anders machst, und zugeben, dass du nicht weißt, ob sie in ihrer Gruppe trägt."}}
);

/* ===================== BLOCK: RECHT I — § 53 (20) ===================== */
Q.push(
{id:"r101",b:"r1",hf:["E","S"],src:"AMT",t:"single",
 q:"Achtung, Korrektur: In welchem Paragrafen ist die Teilkonferenz geregelt, die über bestimmte Ordnungsmaßnahmen entscheidet?",
 stem:"Deine Kernseminar-Zusammenfassung nennt hier § 54 SchulG. Das ist nicht korrekt.",
 o:[
  {t:"§ 53 Absatz 7 SchulG NRW",ok:1},
  {t:"§ 54 SchulG NRW",why:"§ 54 SchulG NRW regelt die Schulgesundheit — Schulgesundheitspflege, schulärztlicher Dienst. Mit Ordnungsmaßnahmen hat der Paragraf nichts zu tun. In deiner Zusammenfassung steht das falsch.",e:"recht"},
  {t:"§ 67 SchulG NRW",why:"§ 67 regelt Teilkonferenzen und Eilentscheidungen im Rahmen der Schulverfassung allgemein. Die für Ordnungsmaßnahmen zuständige Teilkonferenz ist aber in § 53 Absatz 7 geregelt.",e:"recht"},
  {t:"§ 68 SchulG NRW",why:"§ 68 regelt die Lehrerkonferenz. Sie beruft die Teilkonferenz zwar, ist aber nicht selbst die Entscheidungsinstanz.",e:"recht"}],
 ans:"§ 53 Absatz 7 SchulG NRW: Über Ordnungsmaßnahmen nach Absatz 3 Nummer 4 und 5 entscheidet eine von der Lehrerkonferenz berufene Teilkonferenz. § 54 SchulG NRW ist die Schulgesundheit. Präge dir das ein — die Verwechslung steht in deinen Unterlagen und würde im Kolloquium sofort auffallen.",
 ref:"§ 53 (7), § 54 SchulG NRW (BASS 1-1), Stand 2026",
 say:"Die Teilkonferenz für Ordnungsmaßnahmen ist in § 53 Absatz 7 geregelt. Sie wird von der Lehrerkonferenz berufen.",
 trap:{q:"Wer sitzt in dieser Teilkonferenz?",a:"Ständige Mitglieder: ein Mitglied der Schulleitung, die Klassenlehrkraft oder Jahrgangsstufenleitung und drei weitere gewählte Lehrkräfte. Dazu je ein Mitglied aus Schulpflegschaft und Schülerrat — die aber nicht teilnehmen, wenn Schüler oder Eltern widersprechen."}},

{id:"r102",b:"r1",hf:["E","S"],src:"AMT",t:"single",
 q:"Wer entscheidet über die Ordnungsmaßnahmen nach § 53 (3) Nr. 1 bis 3 — also schriftlicher Verweis, Überweisung in eine Parallelklasse und vorübergehender Ausschluss vom Unterricht?",
 o:[
  {t:"Die Schulleiterin oder der Schulleiter beziehungsweise ein beauftragtes Mitglied der Schulleitung, nach Anhörung der Schülerin oder des Schülers.",ok:1},
  {t:"Immer die Teilkonferenz.",why:"Die Teilkonferenz entscheidet über Nummer 4 und 5. Bei Nummer 1 bis 3 kann die Schulleitung sich von ihr beraten lassen oder ihr die Entscheidung übertragen — muss es aber nicht.",e:"verfahren"},
  {t:"Die Klassenkonferenz.",why:"Die Klassenkonferenz ist für Ordnungsmaßnahmen nicht zuständig.",e:"verfahren"},
  {t:"Die Lehrkraft, in deren Unterricht das Fehlverhalten aufgetreten ist.",why:"Ordnungsmaßnahmen liegen nie bei der einzelnen Lehrkraft. Erzieherische Einwirkungen dagegen schon.",e:"verfahren"}],
 ans:"§ 53 (6): Die Schulleitung oder ein beauftragtes Mitglied entscheidet nach Anhörung der Schülerin oder des Schülers. Sie kann sich von der Teilkonferenz beraten lassen oder ihr die Entscheidungsbefugnis übertragen. Eltern und Klassenlehrkraft ist vor der Entscheidung Gelegenheit zur Stellungnahme zu geben.",
 ref:"§ 53 (6) SchulG NRW",
 say:"Über die Ordnungsmaßnahmen Nummer 1 bis 3 entscheidet die Schulleitung nach Anhörung. Sie kann die Teilkonferenz beratend hinzuziehen oder ihr die Entscheidung übertragen.",
 trap:{q:"Und wenn es eilt?",a:"§ 53 Absatz 6 lässt in dringenden Fällen den Verzicht auf vorherige Anhörungen zu — sie sind dann aber nachzuholen."}},

{id:"r103",b:"r1",hf:["E","S"],src:"AMT",t:"single",
 q:"Wer entscheidet über die Androhung der Entlassung und über die Entlassung von der Schule?",
 o:[
  {t:"Eine von der Lehrerkonferenz berufene Teilkonferenz.",ok:1},
  {t:"Die Schulleitung allein.",why:"Bei Nummer 4 und 5 entscheidet zwingend die Teilkonferenz, nicht die Schulleitung.",e:"verfahren"},
  {t:"Die Schulaufsichtsbehörde.",why:"Bei Schulpflichtigen bedarf die Entlassung der Bestätigung durch die Schulaufsichtsbehörde — die Entscheidung selbst trifft aber die Teilkonferenz.",e:"verfahren"},
  {t:"Die Schulkonferenz.",why:"Die Schulkonferenz ist das oberste Mitwirkungsgremium, aber für Einzelfallentscheidungen dieser Art nicht zuständig.",e:"verfahren"}],
 ans:"§ 53 (7): Über Nummer 4 und 5 entscheidet eine von der Lehrerkonferenz berufene Teilkonferenz. Bei Schulpflichtigen bedarf die Entlassung zusätzlich der Bestätigung durch die Schulaufsichtsbehörde, die die Schülerin oder den Schüler einer anderen Schule zuweisen kann.",
 ref:"§ 53 (4) und (7) SchulG NRW",
 say:"Über Androhung der Entlassung und Entlassung entscheidet die von der Lehrerkonferenz berufene Teilkonferenz. Bei Schulpflichtigen kommt die Bestätigung durch die Schulaufsichtsbehörde hinzu.",
 trap:{q:"Unter welcher Voraussetzung überhaupt?",a:"§ 53 Absatz 4: nur bei schwerem oder wiederholtem Fehlverhalten, durch das die Aufgaben der Schule oder die Rechte anderer ernstlich gefährdet oder verletzt wurden."}},

{id:"r104",b:"r1",hf:["E"],src:"AMT",t:"order",
 q:"Bringe die sieben Ordnungsmaßnahmen des § 53 (3) in die gesetzliche Reihenfolge.",
 steps:[
  "Schriftlicher Verweis",
  "Überweisung in eine parallele Klasse oder Lerngruppe",
  "Vorübergehender Ausschluss vom Unterricht von einem Tag bis zu zwei Wochen",
  "Androhung der Entlassung von der Schule",
  "Entlassung von der Schule",
  "Androhung der Verweisung von allen öffentlichen Schulen des Landes",
  "Verweisung von allen öffentlichen Schulen des Landes"],
 ans:"Die Reihenfolge des Gesetzes ist zugleich eine Steigerung der Eingriffsintensität. Die letzten beiden erfolgen durch die obere Schulaufsichtsbehörde.",
 ref:"§ 53 (3) SchulG NRW",
 say:"Die sieben Ordnungsmaßnahmen steigern sich vom schriftlichen Verweis über die Überweisung in eine Parallelklasse und den zeitweisen Ausschluss bis zu Androhung und Vollzug von Entlassung und Verweisung von allen öffentlichen Schulen des Landes.",
 trap:{q:"Wer verhängt die letzten beiden?",a:"Die obere Schulaufsichtsbehörde. Zulässig nur, wenn die Anwesenheit aus Sicherheitsgründen nicht verantwortet werden kann — und mit Bestätigung durch das Ministerium."}},

{id:"r105",b:"r1",hf:["E"],src:"AMT",t:"multi",
 q:"Welche Maßnahmen nennt § 53 (2) ausdrücklich als erzieherische Einwirkungen?",
 stem:"Mehrfachauswahl.",
 o:[
  {t:"Das erzieherische Gespräch",ok:1},
  {t:"Die Ermahnung",ok:1},
  {t:"Gruppengespräche mit Schülerinnen, Schülern und Eltern",ok:1},
  {t:"Die mündliche oder schriftliche Missbilligung des Fehlverhaltens",ok:1},
  {t:"Der Ausschluss von der laufenden Unterrichtsstunde",ok:1},
  {t:"Die Nacharbeit unter Aufsicht nach vorheriger Benachrichtigung der Eltern",ok:1},
  {t:"Die zeitweise Wegnahme von Gegenständen",ok:1},
  {t:"Die Überweisung in eine parallele Lerngruppe",why:"Das ist Ordnungsmaßnahme Nummer 2 nach § 53 Absatz 3 — die häufigste Verwechslung in diesem Themenfeld.",e:"recht"}],
 ans:"§ 53 (2) nennt zusätzlich Maßnahmen mit dem Ziel der Wiedergutmachung und die Beauftragung mit Aufgaben, die das Fehlverhalten verdeutlichen. Merke die Grenze: Ausschluss von der laufenden Stunde ist erzieherisch, Ausschluss vom Unterricht für einen Tag bis zwei Wochen ist Ordnungsmaßnahme.",
 ref:"§ 53 (2) SchulG NRW",
 say:"Erzieherische Einwirkungen sind Gespräch, Ermahnung, Gruppengespräche, mündliche oder schriftliche Missbilligung, Ausschluss von der laufenden Unterrichtsstunde, Nacharbeit nach Elternbenachrichtigung, zeitweise Wegnahme von Gegenständen, Wiedergutmachung und verdeutlichende Aufgaben.",
 trap:{q:"Wo genau verläuft die Grenze zur Ordnungsmaßnahme?",a:"An der laufenden Unterrichtsstunde. Ein Ausschluss für den Rest der Stunde ist erzieherisch; ab einem Tag ist es Ordnungsmaßnahme nach Absatz 3 Nummer 3."}},

{id:"r106",b:"r1",hf:["E"],src:"AMT",t:"single",
 q:"Welchen Grundsatz nennt § 53 (1) ausdrücklich, und was folgt daraus für Ordnungsmaßnahmen?",
 o:[
  {t:"Den Grundsatz der Verhältnismäßigkeit; Ordnungsmaßnahmen sind nur zulässig, wenn erzieherische Einwirkungen nicht ausreichen.",ok:1},
  {t:"Den Grundsatz der Gleichbehandlung; alle Beteiligten sind gleich zu sanktionieren.",why:"Das Gegenteil steht im Gesetz: Einwirkungen gegen mehrere sind nur zulässig, wenn das Fehlverhalten jedem Einzelnen zuzurechnen ist.",e:"recht"},
  {t:"Den Grundsatz der Öffentlichkeit; Maßnahmen sind der Klasse mitzuteilen.",why:"Es gibt keine solche Regelung. Ordnungsmaßnahmen werden den Eltern schriftlich bekannt gegeben und begründet (Absatz 9).",e:"recht"},
  {t:"Den Grundsatz der Unverzüglichkeit; Maßnahmen müssen sofort erfolgen.",why:"Nicht im Gesetz. In dringenden Fällen kann auf vorherige Anhörung verzichtet werden, sie ist dann nachzuholen.",e:"recht"}],
 ans:"§ 53 (1): Der Grundsatz der Verhältnismäßigkeit ist zu beachten. Ordnungsmaßnahmen sind nur zulässig, wenn erzieherische Einwirkungen nicht ausreichen. Einwirkungen gegen mehrere sind nur bei individueller Zurechenbarkeit zulässig.",
 ref:"§ 53 (1) SchulG NRW",
 say:"§ 53 Absatz 1 nennt ausdrücklich die Verhältnismäßigkeit. Daraus folgt: Ordnungsmaßnahmen sind nur zulässig, wenn erzieherische Einwirkungen nicht ausreichen — und Kollektivmaßnahmen nur, wenn das Fehlverhalten jedem Einzelnen zuzurechnen ist.",
 trap:{q:"Was heißt „nicht ausreichen“ praktisch?",a:"Dass ich zeigen kann, was ich versucht habe und warum es nicht getragen hat. Deshalb ist Dokumentation kein Formalismus, sondern die Grundlage der Begründung."}},

{id:"r107",b:"r1",hf:["E"],src:"AMT",t:"single",
 q:"Die ganze Klasse war laut, du kannst aber nicht sagen, wer. Darfst du die Klasse gemeinsam nacharbeiten lassen?",
 o:[
  {t:"Nein — Einwirkungen gegen mehrere sind nur zulässig, wenn das Fehlverhalten jeder oder jedem Einzelnen zuzurechnen ist.",ok:1},
  {t:"Ja, weil Nacharbeit eine erzieherische Einwirkung und damit frei einsetzbar ist.",why:"Auch erzieherische Einwirkungen unterliegen § 53 Absatz 1 — inklusive der individuellen Zurechenbarkeit.",e:"recht"},
  {t:"Ja, wenn die Eltern vorher benachrichtigt werden.",why:"Die Elternbenachrichtigung ist Voraussetzung für die Nacharbeit, ersetzt aber die Zurechenbarkeit nicht.",e:"recht"},
  {t:"Ja, wenn die Klassenkonferenz zustimmt.",why:"Keine Zuständigkeit der Klassenkonferenz, und Zustimmung heilt die fehlende Zurechenbarkeit nicht.",e:"recht"}],
 ans:"§ 53 (1) Satz 5 schließt Kollektivmaßnahmen ohne individuelle Zurechenbarkeit aus. Pädagogisch ist das ebenso sinnvoll: Kollektivstrafen bestrafen die Unbeteiligten und beschädigen die Beziehung zu genau den Lernenden, die mitgearbeitet haben.",
 ref:"§ 53 (1) SchulG NRW",
 say:"Nein. § 53 Absatz 1 lässt Einwirkungen gegen mehrere nur zu, wenn das Fehlverhalten jedem Einzelnen zuzurechnen ist. Kollektivstrafen sind rechtlich unzulässig und pädagogisch kontraproduktiv.",
 trap:{q:"Was tun Sie stattdessen?",a:"§ 53 Absatz 2 gibt den Hinweis: Bei gemeinschaftlichem Fehlverhalten der Klasse soll den Ursachen in besonderer Weise nachgegangen werden. Also Metakommunikation statt Sanktion."}},

{id:"r108",b:"r1",hf:["E","S"],src:"AMT",t:"order",
 q:"Bringe das Verfahren bis zu einer Ordnungsmaßnahme in die richtige Reihenfolge.",
 steps:[
  "Erzieherische Einwirkungen ausschöpfen und dokumentieren",
  "Bericht an die Schulleitung mit Begründung der Notwendigkeit",
  "Anhörung der Schülerin oder des Schülers; Eltern und Klassenlehrkraft erhalten Gelegenheit zur Stellungnahme",
  "Entscheidung durch die Schulleitung oder — bei Nr. 4 und 5 — durch die Teilkonferenz",
  "Schriftliche Bekanntgabe und Begründung gegenüber den Eltern"],
 ans:"Die Kette folgt aus § 53 Absätze 1, 6, 7 und 9. Der letzte Schritt ist zwingend: Ordnungsmaßnahmen werden den Eltern schriftlich bekannt gegeben und begründet.",
 ref:"§ 53 (1), (6), (7), (9) SchulG NRW",
 say:"Der Weg ist: erzieherische Einwirkungen ausschöpfen und dokumentieren, Bericht an die Schulleitung, Anhörung, Entscheidung durch Schulleitung oder Teilkonferenz, schriftliche Bekanntgabe mit Begründung an die Eltern.",
 trap:{q:"Warum ist die Dokumentation so zentral?",a:"Weil ich sonst nicht belegen kann, dass mildere Mittel nicht ausreichten — und genau daran scheitern Ordnungsmaßnahmen im Widerspruchsverfahren."}},

{id:"r109",b:"r1",hf:["E","S"],src:"AMT",t:"single",
 q:"Haben Widerspruch und Anfechtungsklage gegen die Überweisung in eine Parallelklasse aufschiebende Wirkung?",
 o:[
  {t:"Nein — bei Nummer 2 und 3 haben Rechtsbehelfe keine aufschiebende Wirkung.",ok:1},
  {t:"Ja, wie bei allen Verwaltungsakten.",why:"§ 53 Absatz 3 Satz 2 enthält gerade die Ausnahme von diesem Grundsatz für Nummer 2 und 3.",e:"recht"},
  {t:"Nur wenn die Schulaufsichtsbehörde zustimmt.",why:"Keine solche Bedingung im Gesetz.",e:"recht"},
  {t:"Bei allen sieben Ordnungsmaßnahmen entfällt die aufschiebende Wirkung.",why:"Die Ausnahme gilt ausdrücklich nur für Nummer 2 und 3.",e:"recht"}],
 ans:"§ 53 (3) Satz 2: Rechtsbehelfe gegen Nummer 2 und 3 haben keine aufschiebende Wirkung; § 80 Absätze 4, 5, 7 und 8 VwGO bleibt unberührt. Der Sinn ist praktisch — Überweisung und Ausschluss sollen sofort wirken können.",
 ref:"§ 53 (3) SchulG NRW; § 80 VwGO",
 say:"Bei der Überweisung in eine Parallelklasse und beim vorübergehenden Ausschluss haben Widerspruch und Anfechtungsklage keine aufschiebende Wirkung — die Maßnahme greift also sofort.",
 trap:{q:"Ist das nicht rechtsstaatlich bedenklich?",a:"Es ist eine Abwägung. Der Rechtsschutz bleibt über § 80 VwGO erhalten; nur die automatische Aufschiebung entfällt, weil sie die Maßnahme wirkungslos machen würde."}},

{id:"r110",b:"r1",hf:["E"],src:"AMT",t:"single",
 q:"Was ist bei der Nacharbeit unter Aufsicht rechtlich zwingend?",
 o:[
  {t:"Die vorherige Benachrichtigung der Eltern.",ok:1},
  {t:"Die Zustimmung der Schulleitung.",why:"Nicht im Gesetz gefordert; die Nacharbeit ist erzieherische Einwirkung und liegt bei der Lehrkraft.",e:"recht"},
  {t:"Ein Beschluss der Klassenkonferenz.",why:"Kein Konferenzbeschluss erforderlich.",e:"recht"},
  {t:"Die Zustimmung der Schülerin oder des Schülers.",why:"Erzieherische Einwirkungen setzen keine Zustimmung voraus.",e:"recht"}],
 ans:"§ 53 (2) nennt die Nacharbeit unter Aufsicht ausdrücklich nur „nach vorheriger Benachrichtigung der Eltern“. Praktischer Grund: Der Heimweg und die Betreuung ändern sich, die Eltern müssen davon wissen.",
 ref:"§ 53 (2) SchulG NRW",
 say:"Nacharbeit ist als erzieherische Einwirkung zulässig, aber nur nach vorheriger Benachrichtigung der Eltern — und unter Aufsicht.",
 trap:{q:"Warum ist die Aufsicht ausdrücklich erwähnt?",a:"Weil die Aufsichtspflicht fortbesteht. Wer nacharbeiten lässt, muss die Aufsicht sicherstellen — geregelt im Aufsichtserlass, BASS 12-08 Nr. 1."}},

{id:"r111",b:"r1",hf:["E"],src:"AMT",t:"single",
 q:"Ein Schüler nutzt im Unterricht sein Handy. Du nimmst es an dich. Auf welcher Grundlage, und wie lange?",
 o:[
  {t:"Zeitweise Wegnahme von Gegenständen nach § 53 (2) — zeitweise, also nicht dauerhaft.",ok:1},
  {t:"Als Ordnungsmaßnahme nach § 53 (3), weil Eigentum betroffen ist.",why:"Die Wegnahme ist ausdrücklich in Absatz 2 als erzieherische Einwirkung genannt, nicht in Absatz 3.",e:"recht"},
  {t:"Auf Grundlage der Hausordnung, unabhängig vom Schulgesetz.",why:"Die Hausordnung konkretisiert, aber die gesetzliche Ermächtigung steht in § 53 Absatz 2.",e:"recht"},
  {t:"Ohne besondere Grundlage, da es sich um eine Bagatelle handelt.",why:"Ein Eingriff in fremdes Eigentum braucht eine Grundlage — die hier auch existiert.",e:"recht"}],
 ans:"§ 53 (2) nennt die zeitweise Wegnahme von Gegenständen als erzieherische Einwirkung. Das Wort „zeitweise“ ist die Grenze: Einbehalten über einen angemessenen Zeitraum ja, dauerhafte Entziehung nein. Die Rückgabemodalitäten regelt sinnvollerweise die Hausordnung.",
 ref:"§ 53 (2) SchulG NRW",
 say:"Grundlage ist die zeitweise Wegnahme von Gegenständen nach § 53 Absatz 2. Entscheidend ist das Wort zeitweise — ich darf einbehalten, nicht entziehen.",
 trap:{q:"Bis wann müssen Sie es zurückgeben?",a:"Das Gesetz nennt keine Frist, verlangt aber Verhältnismäßigkeit. Üblich und vertretbar ist das Ende des Schultags; alles Längere braucht eine besondere Begründung und sollte in der Hausordnung stehen."}},

{id:"r112",b:"r1",hf:["E","S"],src:"AMT",t:"multi",
 q:"Wer gehört nach § 53 (7) als ständiges Mitglied der Teilkonferenz an?",
 stem:"Mehrfachauswahl.",
 o:[
  {t:"Ein Mitglied der Schulleitung",ok:1},
  {t:"Die Klassenlehrerin oder der Klassenlehrer bzw. die Jahrgangsstufenleitung",ok:1},
  {t:"Drei weitere für ein Schuljahr gewählte Lehrkräfte oder Mitarbeitende gemäß § 58",ok:1},
  {t:"Eine Vertretung der Schulpflegschaft",why:"Sie ist weiteres, für ein Schuljahr zu wählendes Mitglied — aber nicht ständiges Mitglied. Und sie nimmt nicht teil, wenn Schülerin, Schüler oder Eltern widersprechen.",e:"verfahren"},
  {t:"Eine Vertretung des Schülerrates",why:"Ebenfalls weiteres Mitglied mit demselben Widerspruchsvorbehalt, nicht ständiges Mitglied.",e:"verfahren"}],
 ans:"Ständige Mitglieder sind Schulleitungsmitglied, Klassenlehrkraft bzw. Jahrgangsstufenleitung und drei gewählte Lehrkräfte oder Mitarbeitende nach § 58. Vertretungen von Schulpflegschaft und Schülerrat kommen als weitere Mitglieder hinzu, nehmen aber bei Widerspruch der Betroffenen nicht teil.",
 ref:"§ 53 (7) SchulG NRW",
 say:"Ständige Mitglieder sind ein Schulleitungsmitglied, die Klassenlehrkraft und drei gewählte Lehrkräfte. Vertretungen von Schulpflegschaft und Schülerrat kommen hinzu, können aber von den Betroffenen abgelehnt werden.",
 trap:{q:"Warum dieser Widerspruchsvorbehalt?",a:"Persönlichkeitsschutz. Der Fall ist hochsensibel, und Eltern oder Schüler sollen nicht gezwungen sein, ihn vor Mitschülern und anderen Eltern verhandeln zu lassen."}},

{id:"r113",b:"r1",hf:["E","S"],src:"AMT",t:"single",
 q:"Wen darf die Schülerin oder der Schüler zur Anhörung vor der Teilkonferenz hinzuziehen?",
 o:[
  {t:"Eine Person des Vertrauens aus dem Kreis der Schülerinnen und Schüler, der Lehrkräfte oder des pädagogischen bzw. sozialpädagogischen Personals an der Schule.",ok:1},
  {t:"Niemanden; die Anhörung erfolgt allein.",why:"§ 53 Absatz 8 sieht die Vertrauensperson ausdrücklich vor.",e:"recht"},
  {t:"Eine anwaltliche Vertretung.",why:"Das Gesetz benennt Personen aus der Schule. Eine anwaltliche Vertretung ist hier nicht vorgesehen.",e:"recht"},
  {t:"Nur die Eltern.",why:"Den Eltern ist ohnehin Gelegenheit zur Stellungnahme zu geben. Die Vertrauensperson kommt zusätzlich hinzu.",e:"recht"}],
 ans:"§ 53 (8): Vor der Beschlussfassung gibt die Teilkonferenz Schülerin oder Schüler und den Eltern Gelegenheit zur Stellungnahme; zur Anhörung kann eine Vertrauensperson aus der Schule hinzugezogen werden.",
 ref:"§ 53 (8) SchulG NRW",
 say:"Nach § 53 Absatz 8 kann eine Vertrauensperson aus dem Kreis der Schülerschaft, der Lehrkräfte oder des pädagogischen Personals hinzugezogen werden.",
 trap:{q:"Was ist der Sinn dieser Regelung?",a:"Waffengleichheit im Verfahren. Ein Jugendlicher vor sechs Erwachsenen ist strukturell unterlegen; die Vertrauensperson gleicht das ein Stück weit aus."}},

{id:"r114",b:"r1",hf:["E"],src:"AMT",t:"single",
 q:"Unter welcher Voraussetzung sind Androhung der Entlassung und Entlassung überhaupt zulässig?",
 o:[
  {t:"Wenn die Schülerin oder der Schüler durch schweres oder wiederholtes Fehlverhalten die Erfüllung der Aufgaben der Schule oder die Rechte anderer ernstlich gefährdet oder verletzt hat.",ok:1},
  {t:"Wenn drei schriftliche Verweise vorliegen.",why:"Es gibt keine solche Zählregel im Gesetz.",e:"recht"},
  {t:"Wenn die Eltern der Maßnahme zustimmen.",why:"Zustimmung der Eltern ist keine Voraussetzung; Gelegenheit zur Stellungnahme schon.",e:"recht"},
  {t:"Wenn die Schülerin oder der Schüler nicht mehr schulpflichtig ist.",why:"Die Schulpflicht ändert das Verfahren (Bestätigung durch die Schulaufsichtsbehörde), nicht die materielle Voraussetzung.",e:"recht"}],
 ans:"§ 53 (4) Satz 1. Zusätzlich: Bei nicht mehr Schulpflichtigen kann die Entlassung ohne vorherige Androhung erfolgen, wenn innerhalb von 30 Tagen insgesamt 20 Unterrichtsstunden unentschuldigt versäumt wurden.",
 ref:"§ 53 (4) SchulG NRW",
 say:"Zulässig nur bei schwerem oder wiederholtem Fehlverhalten, durch das die Aufgaben der Schule oder die Rechte anderer ernstlich gefährdet oder verletzt wurden.",
 trap:{q:"Was bedeutet „ernstlich“?",a:"Ein unbestimmter Rechtsbegriff, der im Einzelfall auszufüllen ist. Praktisch: Es reicht nicht, dass Unterricht erschwert wird — es muss um die Erfüllung des Auftrags oder um Rechte anderer gehen."}},

{id:"r115",b:"r1",hf:["E"],src:"AMT",t:"single",
 q:"Wie werden Ordnungsmaßnahmen den Eltern mitgeteilt?",
 o:[
  {t:"Schriftlich, und sie werden begründet.",ok:1},
  {t:"Mündlich im Elterngespräch, schriftlich nur auf Verlangen.",why:"§ 53 Absatz 9 verlangt die schriftliche Bekanntgabe mit Begründung ohne Antrag.",e:"recht"},
  {t:"Über das Zeugnis.",why:"Ordnungsmaßnahmen werden nicht über das Zeugnis mitgeteilt.",e:"recht"},
  {t:"Durch Aushang in der Schule.",why:"Ausgeschlossen schon aus Datenschutzgründen.",e:"recht"}],
 ans:"§ 53 (9): Ordnungsmaßnahmen werden den Eltern schriftlich bekannt gegeben und begründet. Die Begründung ist nicht Formsache — sie ist die Grundlage der Überprüfbarkeit im Widerspruchsverfahren.",
 ref:"§ 53 (9) SchulG NRW",
 say:"Ordnungsmaßnahmen werden den Eltern nach § 53 Absatz 9 schriftlich bekannt gegeben und begründet.",
 trap:{q:"Was gehört in die Begründung?",a:"Der Sachverhalt, die verletzte Pflicht, die bereits versuchten erzieherischen Einwirkungen und warum sie nicht ausreichten — also die Verhältnismäßigkeit in Textform."}},

{id:"r116",b:"r1",hf:["E","S"],src:"AMT",t:"case",
 q:"Ein Schüler hat einen Mitschüler auf dem Schulhof geschlagen. Was ist dein erster Schritt?",
 stem:"Fallfrage.",
 o:[
  {t:"Situation sichern, Verletzten versorgen, Sachverhalt aufnehmen und die Schulleitung informieren.",ok:1},
  {t:"Sofort eine Ordnungsmaßnahme aussprechen.",why:"Du kannst gar keine aussprechen — Ordnungsmaßnahmen liegen bei Schulleitung oder Teilkonferenz, nicht bei der einzelnen Lehrkraft.",e:"verfahren"},
  {t:"Zunächst ein erzieherisches Gespräch führen und die Sache dabei belassen.",why:"Bei Gewalt gegen Personen greift § 53 Absatz 1: Ordnungsmaßnahmen dienen auch dem Schutz von Personen. Ein Gespräch allein wird der Schutzpflicht nicht gerecht.",e:"verfahren"},
  {t:"Die Eltern beider Seiten anrufen und vermitteln.",why:"Elternkontakt kommt, aber nicht als erster Schritt und nicht ohne Schulleitung — Verletzung, Dokumentation und Unfallmeldung gehen vor.",e:"verfahren"}],
 ans:"Erst Gefahrenabwehr und Fürsorge, dann Sachverhalt, dann Meldung. § 53 (1) nennt ausdrücklich den Schutz von Personen als Zweck. Bei Verletzung kommt die Unfallmeldung hinzu; die Verantwortung für Unfallverhütung und Erste Hilfe liegt nach § 59 SchulG bei der Schulleitung. Erst danach stellt sich die Frage der Maßnahme — und die entscheidet nicht du.",
 ref:"§ 53 (1), § 59 SchulG NRW",
 say:"Zuerst Situation sichern und den Verletzten versorgen, dann den Sachverhalt aufnehmen und die Schulleitung informieren. Die Entscheidung über eine Ordnungsmaßnahme liegt ohnehin nicht bei mir.",
 trap:{q:"Und wenn die Eltern des Geschlagenen Anzeige erstatten wollen?",a:"Das ist ihr Recht und liegt außerhalb meiner Zuständigkeit. Ich informiere sachlich über den schulischen Weg und verweise für alles Weitere an die Schulleitung."}},

{id:"r117",b:"r1",hf:["E"],src:"AMT",t:"single",
 q:"Was sagt § 53 (2) für den Fall, dass eine ganze Klasse oder Lerngruppe gemeinschaftlich auffällt?",
 o:[
  {t:"Den Ursachen für das Fehlverhalten soll in besonderer Weise nachgegangen werden.",ok:1},
  {t:"Die Klassenkonferenz ist einzuberufen.",why:"Keine solche Vorgabe an dieser Stelle.",e:"recht"},
  {t:"Die Klasse ist gemeinsam zu ermahnen.",why:"Kollektive Einwirkung wäre gerade problematisch — Absatz 1 verlangt individuelle Zurechenbarkeit.",e:"recht"},
  {t:"Die Eltern aller Beteiligten sind schriftlich zu informieren.",why:"Die schriftliche Elterninformation bezieht das Gesetz auf wiederholtes Fehlverhalten Einzelner, nicht auf den Gruppenfall.",e:"recht"}],
 ans:"§ 53 (2) Satz 3: Bei besonders häufigem Fehlverhalten einer Schülerin oder eines Schülers oder bei gemeinschaftlichem Fehlverhalten der Klasse soll den Ursachen in besonderer Weise nachgegangen werden. Das Gesetz verlangt hier also Analyse, nicht Sanktion.",
 ref:"§ 53 (2) SchulG NRW",
 say:"Bei gemeinschaftlichem Fehlverhalten verlangt § 53 Absatz 2 ausdrücklich, den Ursachen in besonderer Weise nachzugehen. Das Gesetz schreibt an dieser Stelle Analyse vor, nicht Sanktion.",
 trap:{q:"Das steht wirklich so im Gesetz?",a:"Ja, Absatz 2 Satz 3. Das ist ein starkes Argument, wenn im Kollegium nach Kollektivstrafen gerufen wird."}},

{id:"r118",b:"r1",hf:["E"],src:"AMT",t:"match",
 q:"Ordne zu: erzieherische Einwirkung nach § 53 (2) oder Ordnungsmaßnahme nach § 53 (3)?",
 pairs:[
  ["Ausschluss von der laufenden Unterrichtsstunde","Erzieherische Einwirkung (Abs. 2)"],
  ["Vorübergehender Ausschluss vom Unterricht für drei Tage","Ordnungsmaßnahme (Abs. 3)"],
  ["Schriftliche Missbilligung des Fehlverhaltens","Erzieherische Einwirkung (Abs. 2)"],
  ["Schriftlicher Verweis","Ordnungsmaßnahme (Abs. 3)"],
  ["Überweisung in eine parallele Lerngruppe","Ordnungsmaßnahme (Abs. 3)"],
  ["Maßnahmen mit dem Ziel der Wiedergutmachung","Erzieherische Einwirkung (Abs. 2)"]],
 ans:"Die beiden gefährlichen Paare: Missbilligung (erzieherisch) gegen Verweis (Ordnungsmaßnahme), und Ausschluss von der Stunde (erzieherisch) gegen Ausschluss vom Unterricht ab einem Tag (Ordnungsmaßnahme).",
 ref:"§ 53 (2) und (3) SchulG NRW",
 say:"Die Grenze verläuft zwischen schriftlicher Missbilligung und schriftlichem Verweis sowie zwischen dem Ausschluss von der laufenden Stunde und dem Ausschluss vom Unterricht ab einem Tag.",
 trap:{q:"Warum ist diese Grenze so wichtig?",a:"Weil ab ihr das Verfahren greift: Zuständigkeit der Schulleitung, Anhörung, schriftliche Begründung. Eine Ordnungsmaßnahme, die ich als Lehrkraft ausspreche, ist rechtswidrig."}},

{id:"r119",b:"r1",hf:["E","S"],src:"AMT",t:"single",
 q:"Wo ist die Pflicht der Schule geregelt, jedem Anschein von Vernachlässigung oder Misshandlung nachzugehen und ein Schutzkonzept zu erstellen?",
 o:[
  {t:"§ 42 (6) SchulG NRW",ok:1},
  {t:"§ 53 (1) SchulG NRW",why:"§ 53 Absatz 1 nennt den Schutz von Personen als Zweck von Maßnahmen, regelt aber nicht die Kinderschutzpflicht.",e:"recht"},
  {t:"§ 44 SchulG NRW",why:"§ 44 regelt Information und Beratung.",e:"recht"},
  {t:"§ 54 SchulG NRW",why:"§ 54 ist die Schulgesundheit — Prävention und Früherkennung von Krankheiten, nicht Kinderschutz im Sinne von Gewaltschutz.",e:"recht"}],
 ans:"§ 42 (6): Die Sorge für das Wohl der Schülerinnen und Schüler erfordert es, jedem Anschein von Vernachlässigung oder Misshandlung nachzugehen. Die Schule entscheidet rechtzeitig über die Einbeziehung des Jugendamtes oder anderer Stellen. Jede Schule erstellt ein Schutzkonzept gegen Gewalt und sexuellen Missbrauch; es bedarf der Zustimmung der Schulkonferenz.",
 ref:"§ 42 (6) SchulG NRW",
 say:"Die Kinderschutzpflicht steht in § 42 Absatz 6: jedem Anschein von Vernachlässigung oder Misshandlung nachgehen, rechtzeitig über die Einbeziehung des Jugendamtes entscheiden, und jede Schule erstellt ein Schutzkonzept mit Zustimmung der Schulkonferenz.",
 trap:{q:"Was heißt „jedem Anschein“?",a:"Es ist bewusst niedrigschwellig. Ich muss keine Gewissheit haben — der Anschein löst die Pflicht zum Nachgehen aus. Was ich nicht tue: allein ermitteln. Ich gebe es weiter."}},

{id:"r120",b:"r1",hf:["E","S"],src:"AMT",t:"speak",
 q:"Erläutere das Verhältnis von erzieherischen Einwirkungen und Ordnungsmaßnahmen und begründe, warum die Verhältnismäßigkeit hier der entscheidende Maßstab ist.",
 stem:"90 Sekunden. Rechtssicher sprechen.",
 musts:[
  "Ich habe § 53 SchulG NRW korrekt als Rechtsgrundlage benannt.",
  "Ich habe die Zweckbestimmung genannt: geordnete Unterrichts- und Erziehungsarbeit sowie Schutz von Personen und Sachen.",
  "Ich habe den Verhältnismäßigkeitsgrundsatz und den Nachrang der Ordnungsmaßnahmen erklärt.",
  "Ich habe je zwei Beispiele aus Absatz 2 und Absatz 3 korrekt zugeordnet.",
  "Ich habe die Zuständigkeit richtig benannt (Schulleitung bei Nr. 1–3, Teilkonferenz bei Nr. 4–5).",
  "Ich habe die individuelle Zurechenbarkeit erwähnt.",
  "Ich habe § 54 nicht fälschlich als Verfahrensnorm genannt."],
 model:"Zweck zuerst (Absatz 1: geordnete Arbeit und Schutz von Personen und Sachen), dann der Doppelmaßstab: Verhältnismäßigkeit allgemein und der ausdrückliche Nachrang der Ordnungsmaßnahmen. Dann die beiden Kataloge mit je zwei Beispielen und der Grenze dazwischen. Dann Zuständigkeit und Verfahren: Anhörung, Entscheidung, schriftliche Begründung. Zum Schluss die pädagogische Wendung — dass das Gesetz bei gemeinschaftlichem Fehlverhalten selbst Ursachenanalyse verlangt und damit den pädagogischen Vorrang festschreibt.",
 crit:["sach","folge","komplex"],
 ref:"§ 53 SchulG NRW (BASS 1-1)",
 trap:{q:"Sie haben eben § 53 Absatz 7 für die Teilkonferenz genannt. Sind Sie sicher? In vielen Zusammenfassungen steht § 54.",a:"Ja, sicher. § 54 SchulG NRW regelt die Schulgesundheit. Die Teilkonferenz steht in § 53 Absatz 7."}}
);
/* ===================== BLOCK: RECHT II — RECHTSLANDKARTE (18) ===================== */
Q.push(
{id:"r201",b:"r2",hf:["S"],src:"AMT",t:"single",
 q:"Was ist die BASS?",
 o:[
  {t:"Die Bereinigte Amtliche Sammlung der Schulvorschriften NRW — die nach Gliederungsnummern geordnete Sammlung aller schulrelevanten Rechts- und Verwaltungsvorschriften.",ok:1},
  {t:"Ein Gesetz, das die Schulaufsicht regelt.",why:"Die BASS ist kein Gesetz, sondern eine Sammlung. Das Gesetz ist das SchulG NRW und steht in der BASS unter 1-1.",e:"recht"},
  {t:"Die Ausbildungsordnung für den Vorbereitungsdienst.",why:"Das ist die OVP. Sie ist in der BASS enthalten, aber die BASS ist die Sammlung insgesamt.",e:"recht"},
  {t:"Ein Erlass des Ministeriums zur Unterrichtsorganisation.",why:"Die BASS enthält solche Erlasse, ist aber selbst keiner.",e:"recht"}],
 ans:"Die BASS ist die Sammlung, nicht die Norm. Sie ist Teil des Amtsblatts NRW und online unter bass.schule.nrw verfügbar. Die BASS-Gliederungsnummer ist die Fundstelle, mit der du zitierst.",
 ref:"bass.schule.nrw",
 say:"Die BASS ist die Bereinigte Amtliche Sammlung der Schulvorschriften NRW — das Regal, in dem alle schulrelevanten Rechts- und Verwaltungsvorschriften nach Gliederungsnummern geordnet stehen.",
 trap:{q:"Nennen Sie mir eine BASS-Fundstelle, die Sie im Alltag brauchen.",a:"Zum Beispiel den Aufsichtserlass, BASS 12-08 Nr. 1, oder die Richtlinien für Schulfahrten, BASS 14-12 Nr. 2."}},

{id:"r202",b:"r2",hf:["S"],src:"AMT",t:"match",
 q:"Ordne die Vorschriften ihren BASS-Fundstellen bzw. ihrem Regelungsgegenstand zu.",
 pairs:[
  ["Schulgesetz NRW","BASS 1-1"],
  ["Kerncurriculum für die Lehrerausbildung im Vorbereitungsdienst","BASS 20-03 Nr. 21"],
  ["Allgemeine Dienstordnung (ADO)","BASS 21-02 Nr. 4"],
  ["Richtlinien für Schulfahrten","BASS 14-12 Nr. 2"],
  ["Aufsichtserlass","BASS 12-08 Nr. 1"],
  ["APO-GOSt","BASS 13-32 Nr. 3.1"]],
 ans:"Sechs Fundstellen, die du im Kolloquium sicher nennen können solltest. Sie decken Gesetz, Ausbildung, Dienstpflichten, Fahrten, Aufsicht und Oberstufe ab.",
 ref:"bass.schule.nrw",
 say:"Die wichtigsten Fundstellen: SchulG unter 1-1, Kerncurriculum unter 20-03 Nr. 21, ADO unter 21-02 Nr. 4, Schulfahrten unter 14-12 Nr. 2, Aufsichtserlass unter 12-08 Nr. 1 und die APO-GOSt unter 13-32 Nr. 3.1.",

{id:"r203",b:"r2",hf:["S","L"],src:"AMT",t:"single",
 q:"Was regeln die APOs — etwa die APO-S I und die APO-GOSt?",
 o:[
  {t:"Die Ausbildung und Prüfung in den einzelnen Bildungsgängen: Aufnahme, Stundentafel, Leistungsnachweise, Versetzung, Prüfungen und Abschlüsse.",ok:1},
  {t:"Die Ausbildung der Lehrkräfte im Vorbereitungsdienst.",why:"Das ist die OVP. Die APOs betreffen die Bildungsgänge der Schülerinnen und Schüler.",e:"recht"},
  {t:"Die Dienstpflichten der Lehrkräfte.",why:"Das ist die ADO.",e:"recht"},
  {t:"Die Aufsichtspflicht auf dem Schulgelände.",why:"Das regelt der Aufsichtserlass, BASS 12-08 Nr. 1.",e:"recht"}],
 ans:"APO steht für Ausbildungs- und Prüfungsordnung. Die Ermächtigung steht in § 52 SchulG; dort ist auch aufgelistet, was geregelt werden darf — von Aufnahmevoraussetzungen über Versetzung bis zu Nachteilsausgleich bei Behinderung.",
 ref:"§ 52 SchulG NRW; APO-GOSt BASS 13-32 Nr. 3.1",
 say:"Die APOs regeln die Bildungsgänge der Schülerinnen und Schüler — Aufnahme, Stundentafel, Leistungsnachweise, Versetzung, Prüfungen und Abschlüsse. Ihre Ermächtigungsgrundlage ist § 52 SchulG.",
 trap:{q:"Welche APO betrifft Sie in Ihrem Unterricht?",a:"In der Sekundarstufe I die APO-S I, in der Oberstufe die APO-GOSt — dort steht zum Beispiel, wie sich die Kursabschlussnote aus Klausuren und sonstiger Mitarbeit zusammensetzt."}},

{id:"r204",b:"r2",hf:["S"],src:"AMT",t:"single",
 q:"Was regelt die ADO?",
 o:[
  {t:"Die Dienstpflichten von Lehrkräften und Schulleitungen — Unterrichtseinsatz, Vertretung, Klassenleitungsaufgaben, individuelle Förderung, Zusammenarbeit.",ok:1},
  {t:"Die Ausbildung im Vorbereitungsdienst.",why:"Das ist die OVP.",e:"recht"},
  {t:"Die Leistungsbewertung.",why:"Grundsätze stehen in § 48 SchulG, Details in den APOs.",e:"recht"},
  {t:"Die Mitwirkung der Eltern.",why:"Das steht im Siebten Teil des SchulG, §§ 62 ff.",e:"recht"}],
 ans:"Die Allgemeine Dienstordnung (BASS 21-02 Nr. 4) ist die Grundlage deiner dienstlichen Tätigkeit. § 8 ADO regelt die individuelle Förderung und Erziehung zur Selbstständigkeit, § 10 Absatz 4 die Pflicht zur pädagogischen Abstimmung und Zusammenarbeit.",
 ref:"ADO, BASS 21-02 Nr. 4; §§ 8, 10 ADO",
 say:"Die ADO regelt meine Dienstpflichten. § 8 verpflichtet mich zur individuellen Förderung und zur Erziehung zur Selbstständigkeit, § 10 Absatz 4 zur Abstimmung und Zusammenarbeit im Kollegium.",
 trap:{q:"Zusammenarbeit ist also Dienstpflicht?",a:"Ja — § 10 Absatz 4 ADO in Verbindung mit § 57 Absatz 2 SchulG. Kollegiale Kooperation ist nicht freiwillig, sondern geschuldet."}},

{id:"r205",b:"r2",hf:["V","U"],src:"KS",t:"single",
 q:"Welchen Anspruch formuliert § 1 SchulG NRW?",
 o:[
  {t:"Jeder junge Mensch hat ohne Rücksicht auf wirtschaftliche Lage, Herkunft und Geschlecht ein Recht auf schulische Bildung, Erziehung und individuelle Förderung.",ok:1},
  {t:"Jede Schule hat das Recht auf eigenverantwortliche Gestaltung ihres Unterrichts.",why:"Das ist § 3, schulische Selbstständigkeit und Eigenverantwortung.",e:"recht"},
  {t:"Jede Schülerin und jeder Schüler hat Anspruch auf ein Zeugnis.",why:"Zeugnisse regelt § 49.",e:"recht"},
  {t:"Eltern haben Anspruch auf Information und Beratung.",why:"Das ist § 44.",e:"recht"}],
 ans:"§ 1 ist die Rechtsgrundlage der individuellen Förderung und damit der zentrale Anker der Leitlinie Vielfalt. Absatz 2 ergänzt: Der Zugang steht nach Lernbereitschaft und Leistungsfähigkeit offen.",
 ref:"§ 1 SchulG NRW",
 say:"§ 1 SchulG gibt jedem jungen Menschen ohne Rücksicht auf wirtschaftliche Lage, Herkunft und Geschlecht ein Recht auf Bildung, Erziehung und individuelle Förderung. Das ist mein rechtlicher Anker für Differenzierung.",
 trap:{q:"Recht auf individuelle Förderung — heißt das Anspruch auf Einzelbetreuung?",a:"Nein. Es ist ein Recht auf Förderung im Rahmen der schulischen Möglichkeiten, kein individuell einklagbarer Betreuungsschlüssel."}},

{id:"r206",b:"r2",hf:["E"],src:"KS",t:"multi",
 q:"Was gehört zum Bildungs- und Erziehungsauftrag nach § 2 SchulG NRW?",
 stem:"Mehrfachauswahl.",
 o:[
  {t:"Verwirklichung der in Artikel 7 der Landesverfassung bestimmten Bildungs- und Erziehungsziele",ok:1},
  {t:"Achtung des Erziehungsrechts der Eltern und partnerschaftliches Zusammenwirken",ok:1},
  {t:"Förderung der vorurteilsfreien Begegnung von Menschen mit und ohne Behinderung; inklusive Bildung als Regelfall",ok:1},
  {t:"Erwerb von Kompetenzen für Anforderungen und Chancen in einer digitalisierten Welt",ok:1},
  {t:"Förderung der Integration von Schülerinnen und Schülern, deren Herkunftssprache nicht Deutsch ist",ok:1},
  {t:"Verpflichtung der Lehrkräfte zur politischen Meinungsäußerung im Unterricht",why:"Genau umgekehrt: § 2 Absatz 8 verlangt Unparteilichkeit und untersagt Bekundungen, die den Schulfrieden oder die Neutralität gefährden.",e:"recht"}],
 ans:"§ 2 ist inhaltsreich und lohnt sich: Absatz 5 verankert inklusive Bildung als Regel, Absatz 6 Nummer 9 den verantwortungsbewussten Umgang mit Medien, Absatz 8 die Neutralitätspflicht, Absatz 10 die Sprachförderung bei Achtung der Herkunftssprache.",
 ref:"§ 2 SchulG NRW",
 say:"§ 2 verpflichtet die Schule auf die Ziele der Landesverfassung, auf Partnerschaft mit den Eltern, auf inklusive Bildung als Regelfall, auf Medienkompetenz und auf Sprachförderung bei gleichzeitiger Achtung der Herkunftssprache.",
 trap:{q:"Neutralitätspflicht — dürfen Sie Ihre politische Meinung sagen?",a:"Nicht so, dass die Neutralität oder der Schulfriede gefährdet werden. Kontroverses muss kontrovers bleiben. Das heißt aber nicht Wertneutralität — die freiheitlich-demokratische Grundordnung ist Grundlage, nicht Meinung."}},

{id:"r207",b:"r2",hf:["B"],src:"KS",t:"single",
 q:"Welchen Anspruch begründet § 44 SchulG NRW?",
 o:[
  {t:"Eltern sowie Schülerinnen und Schüler sind in allen grundsätzlichen und wichtigen Schulangelegenheiten zu informieren und zu beraten.",ok:1},
  {t:"Eltern haben Anspruch auf Teilnahme an allen Konferenzen.",why:"Mitwirkung ist im Siebten Teil geregelt und nicht als Teilnahmerecht an allen Konferenzen ausgestaltet.",e:"recht"},
  {t:"Schülerinnen und Schüler haben Anspruch auf Nachteilsausgleich.",why:"Nachteilsausgleich regeln die APOs auf Grundlage von § 52 Absatz 1 Nummer 18.",e:"recht"},
  {t:"Lehrkräfte müssen jede Note schriftlich begründen.",why:"§ 44 Absatz 2 verlangt, Bewertungsmaßstäbe zu erläutern und auf Wunsch den Leistungsstand mitzuteilen — keine generelle Schriftform.",e:"recht"}],
 ans:"§ 44 ist die Rechtsgrundlage schulischer Beratung. Absatz 2: Bewertungsmaßstäbe sind zu erläutern, auf Wunsch werden Leistungsstand und einzelne Beurteilungen erklärt. Absatz 4: Elternsprechtage finden nicht während der Unterrichtszeit am Vormittag statt. Absatz 5: Zusammenarbeit insbesondere mit schulpsychologischem Dienst und Berufsberatung.",
 ref:"§ 44 SchulG NRW",
 say:"§ 44 SchulG begründet den Anspruch auf Information und Beratung in allen grundsätzlichen und wichtigen Schulangelegenheiten — und verpflichtet mich ausdrücklich, Bewertungsmaßstäbe zu erläutern.",
 trap:{q:"Ein Elternteil will die Klausur des Nachbarkindes zum Vergleich sehen.",a:"Ausgeschlossen. § 44 gibt Anspruch auf Information über das eigene Kind; alles andere verletzt den Datenschutz nach §§ 120 ff. SchulG."}},

{id:"r208",b:"r2",hf:["L"],src:"AMT",t:"multi",
 q:"Was regelt § 48 SchulG NRW zur Leistungsbewertung?",
 stem:"Mehrfachauswahl.",
 o:[
  {t:"Die Leistungsbewertung soll über den Stand des Lernprozesses Aufschluss geben und Grundlage der weiteren Förderung sein.",ok:1},
  {t:"Grundlage sind alle Leistungen aus den Bereichen „Schriftliche Arbeiten“ und „Sonstige Leistungen im Unterricht“; beide werden angemessen berücksichtigt.",ok:1},
  {t:"Die sechs Notenstufen mit ihren Definitionen von sehr gut bis ungenügend.",ok:1},
  {t:"Verweigerte Leistung wird wie eine ungenügende Leistung bewertet.",ok:1},
  {t:"Die Gewichtung der Beurteilungsbereiche im Verhältnis 50 zu 50.",why:"Das Gesetz verlangt angemessene Berücksichtigung, keine feste Quote. Konkretisierungen stehen in den APOs und Fachkonferenzbeschlüssen.",e:"recht"}],
 ans:"§ 48 ist die Grundnorm der Leistungsbewertung: Förderfunktion, zwei Beurteilungsbereiche, Notenstufen, Umgang mit Leistungsverweigerung. Die Konkretisierung erfolgt in den APOs.",
 ref:"§ 48 SchulG NRW",
 say:"§ 48 nennt die Förderfunktion der Leistungsbewertung, die beiden Beurteilungsbereiche schriftliche Arbeiten und sonstige Leistungen, die angemessen zu berücksichtigen sind, sowie die sechs Notenstufen.",
 trap:{q:"Was heißt „angemessen“ konkret?",a:"Das füllen die APOs und die Fachkonferenz aus. Wichtig ist, dass keiner der beiden Bereiche verschwindet — eine reine Klausurnote wäre rechtswidrig."}},

{id:"r209",b:"r2",hf:["S"],src:"AMT",t:"match",
 q:"Ordne die Mitwirkungsgremien ihren Paragrafen im SchulG NRW zu.",
 pairs:[
  ["Aufgaben der Schulkonferenz","§ 65"],
  ["Lehrerkonferenz","§ 68"],
  ["Fachkonferenz","§ 70"],
  ["Klassenkonferenz","§ 71"],
  ["Schulpflegschaft","§ 72"],
  ["Klassenpflegschaft","§ 73"]],
 ans:"Der Siebte Teil des SchulG regelt die Schulverfassung. § 62 nennt die Grundsätze der Mitwirkung, § 63 das Verfahren, § 67 die Teilkonferenzen und Eilentscheidungen, § 74 die Schülervertretung.",
 ref:"§§ 62–74 SchulG NRW",
 say:"Die Mitwirkung steht im Siebten Teil: Schulkonferenz § 65, Lehrerkonferenz § 68, Fachkonferenz § 70, Klassenkonferenz § 71, Schulpflegschaft § 72, Klassenpflegschaft § 73.",
 trap:{q:"Welches Gremium ist das oberste?",a:"Die Schulkonferenz. Sie ist paritätisch besetzt und entscheidet unter anderem über das Schulprogramm und über das Fahrtenprogramm."}},

{id:"r210",b:"r2",hf:["S","E"],src:"KS",t:"single",
 q:"Wer legt nach § 65 SchulG das Fahrtenprogramm der Schule fest?",
 o:[
  {t:"Die Schulkonferenz — Anzahl, Dauer und Kostenobergrenze.",ok:1},
  {t:"Die Schulleitung.",why:"Die Schulleitung genehmigt die einzelne Fahrt; das Programm insgesamt beschließt die Schulkonferenz.",e:"verfahren"},
  {t:"Die Klassenpflegschaft.",why:"Die Klassenpflegschaft berät über die konkrete Fahrt, legt aber kein Programm fest.",e:"verfahren"},
  {t:"Der Schulträger.",why:"Der Schulträger ist für Sachkosten zuständig, nicht für das pädagogische Fahrtenprogramm.",e:"verfahren"}],
 ans:"Die Schulkonferenz legt das Fahrtenprogramm fest — Anzahl, Dauer und Kostenobergrenze, diese möglichst niedrig, damit alle teilnehmen können. Die Genehmigung der einzelnen Fahrt erteilt die Schulleitung.",
 ref:"§ 65 SchulG NRW; Richtlinien für Schulfahrten, BASS 14-12 Nr. 2; Schulwelt NRW 04/2024",
 say:"Das Fahrtenprogramm mit Anzahl, Dauer und Kostenobergrenze beschließt die Schulkonferenz. Die einzelne Fahrt genehmigt die Schulleitung.",
 trap:{q:"Warum soll die Kostenobergrenze niedrig sein?",a:"Weil kein Kind aus finanziellen Gründen ausgeschlossen werden darf. Bei Bürgergeldbezug übernimmt das Sozialamt die Kosten — bei rechtzeitigem Antrag."}},

{id:"r211",b:"r2",hf:["S"],src:"KS",t:"multi",
 q:"Was gilt rechtlich für Klassenfahrten in NRW?",
 stem:"Mehrfachauswahl.",
 o:[
  {t:"Eine Klassenfahrt ist Unterricht an einem anderen Ort und muss Bezug zum Regelunterricht haben.",ok:1},
  {t:"Buchung und Stornierung erfolgen im Namen der Schule, nicht der Lehrkraft.",ok:1},
  {t:"Vorab ist eine schriftliche, rechtsverbindliche Erklärung aller Eltern zur Kostenübernahme einzuholen.",ok:1},
  {t:"Der Ausschluss von der Teilnahme und die vorzeitige Rückreise erfolgen nur durch die Schulleitung.",ok:1},
  {t:"Das Alkoholverbot gilt auch für volljährige Schülerinnen und Schüler, weil es eine Schulveranstaltung ist.",ok:1},
  {t:"Schülerinnen und Schüler bis Klasse 10 dürfen bei Fehlverhalten allein zurückgeschickt werden.",why:"Ausdrücklich nicht: Kinder und Jugendliche bis einschließlich Klasse 10 dürfen nicht allein auf die Heimreise geschickt werden.",e:"recht"}],
 ans:"Zentral ist der Satz, dass die Fahrt Unterricht an einem anderen Ort ist — daraus folgt alles Weitere: Bezug zum Regelunterricht, Aufsichtspflicht, Geltung schulischer Regeln auch für Volljährige.",
 ref:"Richtlinien für Schulfahrten, BASS 14-12 Nr. 2; Aufsichtserlass, BASS 12-08 Nr. 1; Schulwelt NRW 04/2024",
 say:"Eine Klassenfahrt ist Unterricht an einem anderen Ort. Daraus folgt der nötige Bezug zum Regelunterricht, die fortbestehende Aufsichtspflicht und die Geltung der Schulregeln auch für Volljährige.",
 trap:{q:"Ein volljähriger Schüler beruft sich auf seine Rechte als Erwachsener.",a:"Volljährigkeit ändert die Rechtslage der Schulveranstaltung nicht. Die Teilnahme ist freiwillig in dem Sinne, dass er sie nicht antreten muss — nimmt er teil, gelten die Regeln."}},

{id:"r212",b:"r2",hf:["S"],src:"AMT",t:"single",
 q:"Was regelt § 29 SchulG NRW?",
 o:[
  {t:"Die Unterrichtsvorgaben — Richtlinien, Rahmenvorgaben und Lehrpläne, die Ziele, Inhalte und erwartete Lernergebnisse festlegen.",ok:1},
  {t:"Die Lernmittelfreiheit.",why:"Lernmittel regeln § 30 und § 96.",e:"recht"},
  {t:"Die Unterrichtszeit.",why:"Das ist § 8.",e:"recht"},
  {t:"Die Fachkonferenzarbeit.",why:"Das ist § 70.",e:"recht"}],
 ans:"§ 29: Das Ministerium erlässt in der Regel schulformspezifische Unterrichtsvorgaben. Die Schulen bestimmen daraus in Verbindung mit ihrem Schulprogramm schuleigene Vorgaben. Absatz 3 ist wichtig: Die Vorgaben sind so zu fassen, dass für die Lehrkräfte ein pädagogischer Gestaltungsspielraum bleibt.",
 ref:"§ 29 SchulG NRW",
 say:"§ 29 regelt die Unterrichtsvorgaben. Bemerkenswert ist Absatz 3: Sie müssen so gefasst sein, dass ein pädagogischer Gestaltungsspielraum bleibt.",
 trap:{q:"Wie viel Spielraum haben Sie tatsächlich?",a:"Beim Was wenig, beim Wie viel. Der Kernlehrplan gibt die Kompetenzerwartungen vor, der schulinterne Lehrplan konkretisiert, die methodische Umsetzung liegt bei mir."}},

{id:"r213",b:"r2",hf:["S"],src:"AMT",t:"single",

  {t:"In der ADO.",why:"Die ADO regelt Dienstpflichten.",e:"recht"}],
 ans:"Das Kerncurriculum konturiert und strukturiert die schulpraktische Ausbildung. ZfsL und Schulen erstellen daraus ihre Ausbildungsprogramme und stimmen sich ab; die Fachseminarpläne sind mit dem Kernseminarplan abgestimmt.",
 ref:"Kerncurriculum, BASS 20-03 Nr. 21",

{id:"r214",b:"r2",hf:["S"],src:"AMT",t:"single",
 q:"Was ist der Referenzrahmen Schulqualität NRW?",
 o:[
  {t:"Ein Orientierungsrahmen, der Merkmale guter Schule beschreibt und Schulen bei Qualitätsentwicklung und Selbstvergewisserung unterstützt.",ok:1},
  {t:"Eine Rechtsverordnung, deren Einhaltung überprüft wird.",why:"Der Referenzrahmen ist kein unmittelbar verpflichtendes Recht, sondern ein Orientierungsinstrument.",e:"recht"},

  {t:"Ein Verzeichnis der Kernlehrpläne.",why:"Kein Zusammenhang.",e:"recht"}],
 ans:"Der Referenzrahmen beschreibt Schulqualität in Inhaltsbereichen und Dimensionen — etwa 3.6 Gesundheit und Bewegung oder 2.8 Feedback und Beratung. Das Kerncurriculum verweist ausdrücklich auf ihn für qualitative Anforderungen.",
 ref:"Referenzrahmen Schulqualität NRW; Kerncurriculum BASS 20-03 Nr. 21",

{id:"r215",b:"r2",hf:["S","U"],src:"KS",t:"single",

{id:"r216",b:"r2",hf:["S"],src:"AMT",t:"single",

  {t:"Nur im Kerncurriculum, Handlungsfeld S.",why:"Das Kerncurriculum beschreibt die Kompetenz, die Dienstpflicht steht in ADO und SchulG.",e:"recht"},

{id:"r218",b:"r2",hf:["S"],src:"AMT",t:"speak",
 q:"Erkläre einer Referendarin im ersten Quartal die Systematik des Schulrechts in NRW.",
 stem:"90 Sekunden. Ordnung schaffen, nicht Paragrafen aufzählen.",
 musts:[
  "Ich habe die BASS als Sammlung und nicht als Norm erklärt.",
  "Ich habe das SchulG als Gesetz eingeordnet und mindestens zwei Paragrafen korrekt genannt.",
  "Ich habe die APOs von der OVP unterschieden.",
  "Ich habe die ADO als Dienstordnung eingeordnet.",
  "Ich habe mindestens eine BASS-Fundstelle korrekt genannt.",
  "Ich habe gesagt, wo man nachschaut, statt alles auswendig zu behaupten."],
 model:"Erst die Ebenen: Gesetz (SchulG), Rechtsverordnungen (APOs, OVP, AO-SF), Verwaltungsvorschriften und Erlasse (ADO, Aufsichtserlass, Richtlinien für Schulfahrten). Dann die BASS als das Ordnungssystem, in dem alles nach Gliederungsnummern steht. Dann die Zuordnung nach Frage: Wenn es um Schülerinnen und Schüler geht, SchulG und APO. Wenn es um mich als Lehrkraft geht, ADO. Wenn es um meine Ausbildung geht, OVP und Kerncurriculum. Zum Schluss der ehrliche Satz, dass niemand das auswendig kann — entscheidend ist, die Systematik zu kennen.",
 crit:["sach","folge","komm"],

);

 q:"Was ist der Unterschied zwischen Verhältnisprävention und Verhaltensprävention?",

  {t:"Verhältnisprävention betrifft Lehrkräfte, Verhaltensprävention die Lernenden.",why:"Die Unterscheidung folgt der Ansatzebene, nicht der Personengruppe.",e:"begriff"},

{id:"lg02",b:"lg",hf:["S"],src:"KS",t:"single",
 q:"Welche Regelung im SchulG verankert die Verantwortung für Arbeits- und Gesundheitsschutz an der Schule?",
 o:[
  {t:"§ 59 Absatz 8 SchulG — die Schulleitung ist für Unfallverhütung, wirksame Erste Hilfe sowie Arbeits- und Gesundheitsschutz verantwortlich.",ok:1},
  {t:"§ 54 SchulG — Schulgesundheit.",why:"§ 54 regelt die Schulgesundheitspflege für Schülerinnen und Schüler durch die unteren Gesundheitsbehörden, nicht den Arbeitsschutz der Lehrkräfte.",e:"recht"},
  {t:"§ 2 SchulG — Bildungs- und Erziehungsauftrag.",why:"§ 2 Absatz 6 Nummer 8 nennt gesundes Leben als Lernziel für Lernende, nicht den Arbeitsschutz.",e:"recht"},
  {t:"§ 3 SchulG — Qualitätsentwicklung.",why:"Kein Bezug zum Gesundheitsschutz.",e:"recht"}],
 ans:"§ 59 Absatz 8 macht die Schulleitung verantwortlich. Das ist dein Argument, wenn Gesundheit als individuelles Problem behandelt wird: Es gibt eine institutionelle Zuständigkeit.",
 ref:"§ 59 (8) SchulG NRW; nach Tell, PPT Lehrergesundheit",
 say:"§ 59 Absatz 8 SchulG macht die Schulleitung für Unfallverhütung, Erste Hilfe sowie Arbeits- und Gesundheitsschutz verantwortlich — Gesundheit ist damit institutionell verankert.",
 trap:{q:"Was folgt daraus praktisch für Sie als Berufsanfänger?",a:"Dass ich Belastung ansprechen darf, ohne mich zu rechtfertigen — und dass die Schule eine Zuständigkeit hat, an die ich mich wenden kann."}},

{id:"lg03",b:"lg",hf:["S"],src:"KS",t:"single",
 q:"Was besagt Kompetenz 9 der Anlage 1 zur OVP im Kontext Lehrergesundheit?",
 o:[
  {t:"Lehrkräfte sind sich der besonderen Anforderungen des Berufs bewusst, lernen mit Belastungen umzugehen, setzen Arbeitszeit und Arbeitsmittel ökonomisch ein und praktizieren kollegiale Beratung.",ok:1},
  {t:"Lehrkräfte nehmen regelmäßig an Gesundheitsfortbildungen teil.",why:"Fortbildung ist eine Maßnahme, nicht der Kompetenzwortlaut.",e:"recht"},
  {t:"Lehrkräfte dokumentieren ihre Arbeitszeit.",why:"Keine Aussage der Kompetenz 9.",e:"recht"},
  {t:"Lehrkräfte sind verpflichtet, Supervision in Anspruch zu nehmen.",why:"Kollegiale Beratung ja, Supervisionspflicht nein.",e:"recht"}],
 ans:"Kompetenz 9 verbindet drei Dinge: Bewusstsein für die Anforderungen, Umgang mit Belastung, ökonomischer Einsatz von Zeit und Mitteln — und ausdrücklich kollegiale Beratung als Hilfe zur Unterrichtsentwicklung und Arbeitsentlastung.",
 ref:"Anlage 1 zur OVP, Kompetenz 9; nach Tell, PPT Lehrergesundheit",
 say:"Kompetenz 9 verlangt, mit Belastungen umgehen zu lernen, Arbeitszeit und Arbeitsmittel ökonomisch einzusetzen und kollegiale Beratung als Hilfe zur Unterrichtsentwicklung und Arbeitsentlastung zu praktizieren.",
 trap:{q:"Kollegiale Beratung — machen Sie das?",a:"Konkret werden: Format, Frequenz, ein Beispiel, was sich dadurch verändert hat. Ein Ja ohne Beleg ist wertlos."}},

{id:"lg04",b:"lg",hf:["S"],src:"KS",t:"single",
 q:"Was bezeichnet „emotionale Dissonanz“ im Lehrberuf?",
 o:[
  {t:"Gefühle zu zeigen, die man nicht spürt, oder Gefühle zu vermeiden, die man spürt.",ok:1},
  {t:"Den Widerspruch zwischen pädagogischem Anspruch und schulischer Realität.",why:"Das ist ein anderes, ebenfalls belastendes Phänomen — aber nicht die Definition emotionaler Dissonanz.",e:"begriff"},
  {t:"Konflikte im Kollegium.",why:"Emotionale Dissonanz ist intrapersonal, nicht interpersonal.",e:"begriff"},
  {t:"Die Diskrepanz zwischen Selbst- und Fremdwahrnehmung.",why:"Auch das ist etwas anderes.",e:"begriff"}],
 ans:"Emotionale Dissonanz entsteht in interaktionsstarken Berufen mit hoher emotionaler Anforderung und ist stressfördernd. Die beiden Regulationsstrategien sind Surface Acting und Deep Acting.",
 ref:"Eckert, Marcus / Scherenberg, Viviane / Schandro, Eva: Lehrergesundheit. Stuttgart: Reclam, 2024",
 say:"Emotionale Dissonanz heißt, Gefühle zu zeigen, die ich nicht spüre, oder Gefühle zu vermeiden, die ich spüre. Sie ist in interaktionsstarken Berufen typisch und stressfördernd.",
 trap:{q:"Kennen Sie das aus dem eigenen Unterricht?",a:"Ein konkretes Beispiel bereithalten — etwa nach einem schwierigen Elterngespräch direkt in die nächste Stunde."}},

{id:"lg05",b:"lg",hf:["S"],src:"KS",t:"match",
 q:"Ordne die Begriffe zur emotionalen Regulation zu.",
 pairs:[
  ["Unerwünschte Emotionen unterdrücken und erwünschte vorspielen","Surface Acting"],
  ["Die eigene Empfindung so regulieren, dass die gewünschte Emotion tatsächlich empfunden wird","Deep Acting"],
  ["Aus Überzeugung und guten Gründen die erwartete Emotion zeigen — mit deutlich geringerer Belastung","Faking in good faith"]],
 ans:"Eckert und Kolleginnen weisen darauf hin, dass Surface Acting für manche weniger belastend ist, wenn die richtige Intention dahintersteht: Wer aus Überzeugung zeigt, was erwartet wird, betreibt meist automatisch Deep Acting.",
 ref:"Eckert et al. 2024, S. 91",
 say:"Surface Acting unterdrückt und spielt vor, Deep Acting reguliert das tatsächliche Empfinden. Faking in good faith beschreibt den Fall, in dem Surface Acting aus Überzeugung geschieht und deshalb kaum belastet.",
 trap:{q:"Ist Deep Acting nicht Selbstmanipulation?",a:"Ein guter Einwand. Die Grenze ist die Authentizität: Wenn ich meine Haltung ändere, ist es Entwicklung. Wenn ich mein Empfinden dauerhaft überschreibe, ist es riskant."}},

{id:"lg06",b:"lg",hf:["S"],src:"KS",t:"single",
 q:"Was besagt die Broaden-and-build-Theorie im Kontext der Lehrergesundheit?",
 o:[
  {t:"Positive emotionale Zustände wie Dankbarkeit erweitern Möglichkeiten sowie Entscheidungs- und Experimentierfreude und führen zu Kompetenzerleben.",ok:1},
  {t:"Belastung baut mit der Zeit Widerstandskraft auf.",why:"Das wäre eine Resilienzannahme, nicht Broaden-and-build.",e:"modell"},
  {t:"Positive Emotionen sind eine Folge, nicht eine Ursache von Erfolg.",why:"Die Theorie beschreibt gerade die umgekehrte Wirkrichtung.",e:"modell"},
  {t:"Belastungen sollten gleichmäßig auf das Kollegium verteilt werden.",why:"Keine Aussage der Theorie.",e:"modell"}],
 ans:"Der Gegenbegriff ist die Abwärtsspirale aus Problemfaszination, Hilflosigkeit und verengtem Suchmodus. Broaden-and-build beschreibt die Aufwärtsspirale — mit dem Zusatz, dass sie auch das Kompetenzerleben der unterrichteten Lernenden betrifft.",
 ref:"nach Tell, PPT Lehrergesundheit; Eckert et al. 2024",
 say:"Broaden-and-build beschreibt eine Aufwärtsspirale: Positive Zustände wie Dankbarkeit erweitern den Handlungsraum und die Experimentierfreude — im Gegensatz zur Abwärtsspirale aus Problemfaszination und verengtem Suchmodus.",
 trap:{q:"Klingt nach positivem Denken.",a:"Der Einwand ist berechtigt, wenn man es dabei belässt. Der Unterschied ist die Verhältnisebene: Ohne veränderte Rahmenbedingungen bleibt es Selbstoptimierung."}},

{id:"lg07",b:"lg",hf:["S"],src:"KS",t:"single",
 q:"Was ist mit „Benefit Finding“ gemeint?",
 o:[
  {t:"Das Gute im Schlechten sehen — eine problemhafte Situation als Gelegenheit zum Wachsen bearbeiten und daraus konkrete erste Schritte ableiten.",ok:1},
  {t:"Vorteile des Lehrberufs gegenüber anderen Berufen benennen.",why:"Nicht gemeint.",e:"begriff"},
  {t:"Ressourcen im Kollegium identifizieren.",why:"Das gehört zur sozialen Unterstützung.",e:"begriff"},
  {t:"Belastungen dokumentieren, um sie der Schulleitung vorzulegen.",why:"Kein Bezug.",e:"begriff"}],
 ans:"Das Verfahren ist strukturiert: problemhafte Situation auswählen, formulieren, was geschehen muss, damit das Problem nicht mehr besteht, erste Schritte identifizieren, Unterstützung suchen, den eigenen Erfolg würdigen. Die Nähe zur lösungsorientierten Logik Lohmanns ist unübersehbar.",
 ref:"nach Tell, PPT Lehrergesundheit",
 say:"Benefit Finding heißt, das Gute im Schlechten zu finden — aber strukturiert: Situation auswählen, Zielzustand formulieren, erste Schritte identifizieren, Unterstützung suchen und den eigenen Erfolg würdigen.",
 trap:{q:"Und wenn eine Situation einfach nur schlecht ist?",a:"Dann ist Benefit Finding das falsche Werkzeug. Es ersetzt weder Entlastung noch, wenn nötig, professionelle Hilfe."}},

{id:"lg08",b:"lg",hf:["S"],src:"KS",t:"multi",
 q:"Welche Formen sozialer Unterstützung nennt deine Zusammenfassung?",
 stem:"Mehrfachauswahl.",
 o:[
  {t:"Emotionale Unterstützung — aktives Zuhören ist meist wirksamer als der direkte Ratschlag",ok:1},
  {t:"Praktische Unterstützung — die Erfahrung, sich auf Kolleginnen und Kollegen verlassen zu können",ok:1},
  {t:"Informationelle Unterstützung — eigenes Wissen zur Verfügung stellen",ok:1},
  {t:"Motivationale Unterstützung — kleine Erfolge feiern, Misserfolge gemeinsam verarbeiten",ok:1},
  {t:"Finanzielle Unterstützung",why:"Nicht Teil dieser Systematik.",e:"begriff"}],
 ans:"Vier Formen — und die wichtige Bedingung: Soziale Unterstützung wirkt nur, wenn sie bewusst wahrgenommen und gewürdigt wird. Vorhandene, aber unbemerkte Unterstützung entlastet nicht.",
 ref:"nach Tell, PPT Lehrergesundheit; Eckert et al. 2024",
 say:"Emotionale, praktische, informationelle und motivationale Unterstützung. Entscheidend ist, dass sie bewusst wahrgenommen und gewürdigt wird — sonst wirkt sie nicht.",
 trap:{q:"Warum ist aktives Zuhören wirksamer als ein Ratschlag?",a:"Weil der Ratschlag unterstellt, das Problem sei gelöst, wenn man nur wüsste wie. Meist ist das Problem aber die Belastung selbst, und die braucht zuerst Anerkennung."}},

{id:"lg09",b:"lg",hf:["S"],src:"KS",t:"single",
 q:"Was bezeichnet „interessierte Selbstgefährdung“?",
 o:[
  {t:"Dauerhafte Selbstausbeutung aus eigenem Antrieb — man gefährdet sich, weil man die Sache gut machen will.",ok:1},
  {t:"Das bewusste Eingehen beruflicher Risiken.",why:"Zu allgemein; der Kern ist die Selbstgefährdung aus Engagement.",e:"begriff"},
  {t:"Die Weigerung, Hilfe anzunehmen.",why:"Eine mögliche Folge, nicht die Definition.",e:"begriff"},
  {t:"Überforderung durch zu große Klassen.",why:"Das wäre eine Verhältnisbelastung, keine Selbstgefährdung.",e:"begriff"}],
 ans:"Der tückische Punkt ist die Motivation: Es sind nicht die Gleichgültigen, die ausbrennen, sondern die Engagierten. Gegenmittel sind bewusstes Pausenmanagement, realistische Arbeitsorganisation und Reflexion des eigenen Handelns.",
 ref:"nach Tell, PPT Lehrergesundheit",
 say:"Interessierte Selbstgefährdung meint dauerhafte Selbstausbeutung aus eigenem Antrieb. Gefährdet sind gerade die Engagierten — deshalb ist Selbstfürsorge kein Zeichen von Gleichgültigkeit.",
 trap:{q:"Sind Sie selbst gefährdet?",a:"Ehrlich antworten. Ein konkretes Muster benennen und eine Gegenmaßnahme, die du wirklich umsetzt — nicht eine, die gut klingt."}},

{id:"lg10",b:"lg",hf:["S"],src:"KS",t:"match",
 q:"Ordne die Selbstmanagement-Instrumente ihrer Funktion zu.",
 pairs:[
  ["Wunsch, Ergebnis, Hindernis, Plan — mentale Kontrastierung mit Wenn-Dann-Plan","WOOP"],
  ["Sehr kleine Gewohnheiten an bestehende Routinen koppeln","Tiny Habits"],
  ["Nicht wertende Aufmerksamkeit auf den gegenwärtigen Moment, etwa als MBSR","Achtsamkeit"]],
 ans:"Alle drei sind Verhaltensprävention. Sie ersetzen keine Veränderung der Rahmenbedingungen — genau das ist der Einwand, den du im Kolloquium selbst formulieren solltest.",
 ref:"nach Tell, PPT Lehrergesundheit",
 say:"WOOP arbeitet mit mentaler Kontrastierung und Wenn-Dann-Plänen, Tiny Habits mit sehr kleinen Gewohnheiten an bestehenden Routinen, Achtsamkeit mit nicht wertender Aufmerksamkeit.",
 trap:{q:"Was bringen diese Techniken, wenn die Stundenzahl bleibt?",a:"Wenig, wenn sie allein stehen. Deshalb die Unterscheidung: Sie sind Verhaltensprävention und brauchen die Verhältnisprävention als Gegenstück."}},

{id:"lg11",b:"lg",hf:["S"],src:"KS",t:"multi",
 q:"Welche Bedingungen machen Schule laut deiner Zusammenfassung zu einem gesunden Arbeitsraum?",
 stem:"Mehrfachauswahl.",
 o:[
  {t:"Psychische Gesundheit ernst nehmen und Belastungen offen ansprechen können",ok:1},
  {t:"Transparenz und Planungssicherheit, etwa durch frühzeitige Kommunikation von Prüfungen und klare Erwartungen",ok:1},
  {t:"Selbstfürsorge stärken durch Pausenmanagement und realistische Arbeitsorganisation",ok:1},
  {t:"Fortbildungen zu Gesundheitskompetenz, etwa Achtsamkeit, Resilienz, WOOP",ok:1},
  {t:"Belastungen individuell lösen, um das Kollegium nicht zu belasten",why:"Widerspricht dem Kern: Gesundheit ist gemeinsame Verantwortung von Schulleitung, Kollegium und Schulträger.",e:"begriff"}],
 ans:"Der zusammenfassende Satz lautet: Schule wird zum gesunden Arbeitsraum, wenn Gesundheit nicht allein als Aufgabe des Einzelnen verstanden wird, sondern als gemeinsame Verantwortung — und wenn Verhältnis- und Verhaltensprävention verbunden werden.",
 ref:"nach Tell, PPT Lehrergesundheit",

{id:"lg12",b:"lg",hf:["S","U","E"],src:"KS",t:"single",
 q:"In welchen Handlungsfeldern verortet das Kerncurriculum Gesundheitsthemen?",

  {t:"Ausschließlich in Handlungsfeld E.",why:"Gesundheitserziehung ja, aber nicht ausschließlich.",e:"hf"},

{id:"lg13",b:"lg",hf:["S"],src:"ERG",t:"case",
 q:"Eine Kollegin wirkt seit Wochen erschöpft, zieht sich zurück und wird gereizt. Was tust du?",
 stem:"Fallfrage.",
 o:[
  {t:"Das Gespräch unter vier Augen suchen, ohne zu diagnostizieren, und praktische Unterstützung anbieten.",ok:1},
  {t:"Die Schulleitung informieren, damit sie eingreift.",why:"Ohne vorheriges Gespräch ist das ein Vertrauensbruch. Es kann später richtig sein — aber nicht als erster Schritt.",e:"verfahren"},
  {t:"Abwarten, weil es nicht deine Zuständigkeit ist.",why:"Kollegiale Fürsorge ist Teil der professionellen Rolle; § 10 Absatz 4 ADO verlangt Zusammenarbeit.",e:"verfahren"},
  {t:"Ihr Entlastungstechniken wie WOOP empfehlen.",why:"Ratschläge sind nach Eckert weniger wirksam als aktives Zuhören — und sie wirken hier leicht übergriffig.",e:"verfahren"}],
 ans:"Emotionale Unterstützung geht vor: zuhören statt raten. Praktische Unterstützung — eine Aufsicht übernehmen, Material teilen — ist oft wirksamer als jedes Gespräch über Techniken. Wenn Hinweise auf eine ernsthafte Erkrankung bestehen, gehört das an professionelle Hilfe, nicht an dich.",
 ref:"Eckert et al. 2024; § 10 (4) ADO",
 say:"Ich würde das Gespräch unter vier Augen suchen, zuhören statt raten, und konkret praktische Entlastung anbieten. Diagnostizieren gehört nicht zu meiner Rolle.",

{id:"lg14",b:"lg",hf:["S"],src:"KS",t:"speak",
 q:"Ein Ausschussmitglied sagt: „Lehrergesundheit ist doch ein Modethema.“ Positioniere dich.",
 stem:"90 Sekunden. Gegenposition aushalten gehört zu Kriterium 5.",
 musts:[
  "Ich habe den Einwand ernst genommen statt ihn abzuwehren.",
  "Ich habe die rechtliche Verankerung genannt (§ 59 Absatz 8 SchulG oder Kompetenz 9 Anlage 1).",
  "Ich habe Verhältnis- und Verhaltensprävention unterschieden.",
  "Ich habe mindestens einen Fachbegriff korrekt verwendet (emotionale Dissonanz, interessierte Selbstgefährdung, Broaden-and-build).",
  "Ich habe den berechtigten Kern des Einwands benannt.",
  "Ich habe eine eigene Position begründet."],
 model:"Der starke Zug ist, dem Einwand zuerst recht zu geben: Ja, es gibt eine Variante des Themas, die auf Selbstoptimierung hinausläuft und die Verhältnisse unangetastet lässt. Genau dagegen steht die Unterscheidung von Verhältnis- und Verhaltensprävention. Dann die rechtliche Verankerung, damit es kein Wellness-Thema bleibt: § 59 Absatz 8 SchulG und Kompetenz 9 der Anlage 1. Dann ein Fachbegriff, der zeigt, dass es um Belastungsmechanismen geht und nicht um Befindlichkeit — emotionale Dissonanz oder interessierte Selbstgefährdung. Und zum Schluss die eigene Position, ruhig zugespitzt: Wer im ersten Berufsjahr lernt, Belastung zu bearbeiten, unterrichtet in zwanzig Jahren noch.",
 crit:["eigen","komm","sach"],
 ref:"§ 59 (8) SchulG; Anlage 1 OVP Kompetenz 9; Eckert et al. 2024",
 trap:{q:"Sie geben mir also recht?",a:"In einem Punkt ja — nicht im Ganzen. Das ist keine Schwäche, sondern genau das, was Kriterium 4 verlangt."}}
);

{id:"be01",b:"be",hf:["B"],src:"KS",t:"multi",
 q:"Worauf bezieht sich schulische Beratung nach § 44 SchulG NRW insbesondere?",

 o:[
  {t:"Lernentwicklung",ok:1},{t:"Schullaufbahn",ok:1},{t:"Bildungswege",ok:1},
  {t:"Übergänge",ok:1},{t:"Leistungsentwicklung",ok:1},
  {t:"Familiäre Konflikte",why:"Familiäre Konflikte können Anlass sein, sind aber nicht Gegenstand schulischer Beratung. Hier greift die Netzwerkorientierung — Jugendhilfe, Schulsozialarbeit, Beratungsstellen.",e:"begriff"}],

 trap:{q:"Ein Schüler erzählt Ihnen von einer Trennung der Eltern. Beraten Sie da?",a:"Ich höre zu und nehme es ernst, aber ich berate nicht in Familienfragen. Ich kläre, was er von mir braucht, und verweise auf die Beratungslehrkraft oder Schulsozialarbeit."}},

{id:"be02",b:"be",hf:["B"],src:"KS",t:"single",
 q:"Welcher Satz beschreibt die Rollengrenze schulischer Beratung am genauesten?",

  {t:"Beratung ist Aufgabe der Beratungslehrkraft.",why:"Ausdrücklich nicht: Beratung ist Aufgabe jeder Lehrkraft. Die Beratungslehrkraft ist Teil des Netzwerks.",e:"begriff"},

{id:"be04",b:"be",hf:["B"],src:"KS",t:"single",
